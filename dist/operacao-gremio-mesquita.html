/* ---------------- Tokens ---------------- */
:root {
  --roxo: #8034a0;
  --roxo-escuro: #5b2173;
  --roxo-medio: #6c2a89;
  --lavanda: #f3eaf8;
  --lavanda-2: #e7d8f0;
  --papel: #ffffff;
  --tinta: #2b1638;
  --tinta-2: #63506f;
  --linha: #e3d7ea;
  --amarelo: #ffc83d;
  --amarelo-borda: #d9a20f;

  --cat-cultura: #e0446a;
  --cat-estrutura: #2a88d6;
  --cat-divulgacao: #e38b00;
  --cat-esporte: #2f9e43;
  --cat-games: #7548d8;
  --cat-logistica: #0d948b;

  --col-backlog: #f25c5c;
  --col-afazer: #f2ae2e;
  --col-andamento: #3aa6e8;
  --col-revisao: #a162e8;
  --col-concluido: #4db548;

  --bom: #1d8a4d;
  --ruim: #cf2539;
  --alerta: #c96d00;
  --caixa: #1d8a4d;
  --prestigio: #b97f00;
  --tradicao: #8c521d;

  --fonte: 'Archivo OG', 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --raio-painel: 18px;
  --raio-card: 10px;
  --raio-botao: 10px;
  --sombra-modal: 0 24px 64px rgba(36, 8, 54, 0.5);
  --foco: var(--amarelo);
  --lateral: 300px;
  --gutter: 16px;
}

/* ---------------- Base ---------------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--roxo);
  color: var(--tinta);
  font-family: var(--fonte);
  font-size: 15px;
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
}
body.com-modal { overflow: hidden; }
h1, h2, h3, h4, p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button, input, select { font: inherit; color: inherit; }
img { display: block; }
a { color: inherit; }
dl, dd { margin: 0; }

:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; border-radius: 6px; }
.painel :focus-visible, .modal :focus-visible, .card :focus-visible, .cartaz-missao :focus-visible { --foco: var(--roxo); }

.ic { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.2em; }
.visualmente-oculto {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.pular {
  position: absolute; left: 12px; top: -48px; z-index: 50;
  background: var(--amarelo); color: var(--tinta); padding: 8px 14px; border-radius: 8px; font-weight: 700;
}
.pular:focus { top: 12px; }

/* ---------------- Botões ---------------- */
.botao {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 18px;
  border: 2px solid transparent; border-radius: var(--raio-botao);
  font-weight: 700; font-size: 15px; line-height: 1.1; text-decoration: none;
  cursor: pointer; transition: transform 80ms ease, background-color 120ms ease, border-color 120ms ease;
  white-space: nowrap;
}
.botao:active { transform: translateY(1px); }
.botao-primario { background: var(--amarelo); border-color: var(--amarelo-borda); color: var(--tinta); }
.botao-primario:hover { background: #ffd666; }
.botao-secundario { background: var(--papel); border-color: var(--lavanda-2); color: var(--tinta); }
.botao-secundario:hover { border-color: var(--roxo); }
.botao-fantasma { background: transparent; border-color: rgba(255, 255, 255, 0.55); color: #fff; }
.botao-fantasma:hover { border-color: #fff; background: rgba(255, 255, 255, 0.08); }
.botao-perigo { background: var(--ruim); border-color: #a51b2c; color: #fff; }
.botao-pequeno { min-height: 34px; padding: 6px 12px; font-size: 13.5px; border-radius: 8px; }
.botao-grande { min-height: 54px; padding: 14px 26px; font-size: 17px; }
.botao[aria-disabled='true'], .botao:disabled {
  background: #efe9f2; border-color: #e1d7e7; color: #8d7d97; cursor: not-allowed;
}
.botao-icone { min-width: 44px; padding: 8px; }

/* ---------------- Marca ---------------- */
.marca { display: inline-flex; flex-direction: column; line-height: 0.82; color: #fff; }
.marca-escola { font-style: italic; font-weight: 800; font-stretch: 75%; font-size: 0.72em; }
.marca-mesquita { font-style: italic; font-weight: 900; font-stretch: 70%; font-size: 1.25em; letter-spacing: -0.01em; text-transform: uppercase; }

/* ---------------- Tela inicial ---------------- */
.tela-inicio {
  min-height: 100vh; display: grid; gap: 28px 48px; align-content: center;
  grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
  grid-template-areas: 'cabeca cabeca' 'heroi equipe';
  padding: 28px clamp(16px, 5vw, 64px) 40px; color: #fff;
  max-width: 1320px; margin: 0 auto;
}
.inicio-cabeca { grid-area: cabeca; display: flex; justify-content: space-between; align-items: center; font-size: 28px; }
.inicio-heroi { grid-area: heroi; align-self: center; max-width: 900px; }
.inicio-time { grid-area: equipe; align-self: center; }
.inicio-time h2 { font-size: 15px; font-weight: 700; color: #e9dcf1; margin-bottom: 14px; }
.titulo-jogo {
  font-weight: 900; font-stretch: 125%; text-transform: uppercase; line-height: 0.9; letter-spacing: -0.02em;
  font-size: clamp(40px, 8.4vw, 108px);
}
@media (min-width: 1001px) {
  /* Com a coordenação ao lado, o título é dimensionado para caber na coluna dele. */
  .titulo-jogo { font-size: clamp(40px, 5.9vw, 90px); }
}
.titulo-jogo .linha { display: block; }
.titulo-jogo .faixa {
  display: inline-block; background: #fff; color: var(--roxo); padding: 0.1em 0.16em 0.03em; margin-top: 0.2em;
}
.inicio-texto { margin-top: 22px; max-width: 60ch; font-size: clamp(16px, 2.1vw, 19px); color: #f1e6f7; }
.inicio-acoes { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; }
.inicio-continuar { margin-top: 18px; color: #f1e6f7; font-size: 14px; }
.inicio-equipe { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 16px; }
.inicio-membro { display: flex; align-items: center; gap: 12px; }
.inicio-membro .avatar { width: 76px; height: 76px; border: 4px solid #fff; }
.inicio-membro .avatar-iniciais { font-size: 24px; }
.inicio-membro .nome { display: block; font-weight: 800; font-stretch: 110%; font-size: 18px; line-height: 1.1; }
.inicio-membro .cargo { display: block; font-size: 13px; color: #e9dcf1; line-height: 1.25; margin-top: 2px; }
@media (max-width: 1000px) {
  .tela-inicio { grid-template-columns: minmax(0, 1fr); grid-template-areas: 'cabeca' 'heroi' 'equipe'; align-content: start; }
  .inicio-equipe { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
}
.inicio-rodape { font-size: 13px; color: #dccbe8; }

/* ---------------- Barra de topo (telas secundárias) ---------------- */
.barra-topo {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 18px clamp(16px, 4vw, 40px); color: #fff;
}
.barra-topo h1 { font-weight: 900; font-stretch: 120%; font-size: clamp(24px, 4vw, 38px); line-height: 1; letter-spacing: -0.01em; }
.barra-topo .marca { font-size: 18px; margin-left: auto; }

/* ---------------- Seleção de missão ---------------- */
.tela-missoes { max-width: 1320px; margin: 0 auto; padding-bottom: 40px; }
.missoes-intro { padding: 0 clamp(16px, 4vw, 40px) 18px; color: #f1e6f7; max-width: 70ch; }
.grade-missoes {
  display: grid; gap: 18px; padding: 0 clamp(16px, 4vw, 40px);
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
}
.cartaz-missao {
  --tema: var(--roxo);
  display: flex; flex-direction: column; gap: 12px;
  background: var(--papel); color: var(--tinta); border-radius: var(--raio-painel); padding: 0 18px 18px; overflow: hidden;
}
.cartaz-faixa { height: 12px; margin: 0 -18px; background: var(--tema); }
.cartaz-missao h2 { font-weight: 900; font-stretch: 115%; font-size: 23px; line-height: 1.05; letter-spacing: -0.01em; color: var(--tinta); }
.cartaz-desc { color: var(--tinta-2); font-size: 14px; }
.cartaz-dados { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.cartaz-dados dt { color: var(--tinta-2); }
.cartaz-dados dd { font-weight: 700; }
.cartaz-projetos { display: grid; gap: 4px; font-size: 13.5px; border-top: 1px solid var(--linha); padding-top: 10px; }
.cartaz-projetos li { display: flex; align-items: center; gap: 8px; }
.cartaz-projetos .tempo-longo { margin-left: auto; font-size: 12px; color: var(--alerta); font-weight: 700; white-space: nowrap; }
.ponto-cat { width: 10px; height: 10px; border-radius: 3px; background: var(--cat); flex: none; }
.cartaz-missao .botao { margin-top: auto; }

/* ---------------- Jogo: HUD ---------------- */
.tela-jogo { min-height: 100vh; display: flex; flex-direction: column; }
.hud {
  display: grid; align-items: center; gap: 10px 18px; color: #fff;
  grid-template-columns: auto auto 1fr auto;
  grid-template-areas:
    'marca rodada recursos acoes'
    'missao missao evento evento';
  padding: 12px var(--gutter) 10px;
}
.hud-marca { grid-area: marca; display: flex; align-items: center; gap: 14px; min-width: 0; }
.hud-marca .marca { font-size: 15px; }
.hud-titulo { font-weight: 900; font-stretch: 115%; font-size: 20px; line-height: 1.05; letter-spacing: -0.01em; }
.hud-modo { font-size: 12px; color: #eadcf2; }
.hud-rodada { grid-area: rodada; display: flex; align-items: center; gap: 10px; }
.hud-rodada .numero { font-weight: 900; font-stretch: 125%; font-size: 30px; line-height: 1; }
.hud-rodada .numero small { font-size: 16px; font-weight: 700; opacity: 0.8; }
.hud-rodada .rotulo { font-size: 12px; line-height: 1.1; color: #eadcf2; }
.pips { display: flex; gap: 4px; margin-top: 3px; }
.pip { width: 18px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.28); }
.pip.feita { background: #fff; }
.pip.atual { background: var(--amarelo); }
.hud-recursos { grid-area: recursos; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.recurso {
  display: flex; align-items: center; gap: 8px; background: var(--papel); color: var(--tinta);
  border-radius: 999px; padding: 6px 14px 6px 10px; min-height: 40px;
}
.recurso dt { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--tinta-2); }
.recurso dd { font-weight: 800; font-size: 17px; }
.recurso-caixa .ic { color: var(--caixa); }
.recurso-prestigio .ic { color: var(--prestigio); }
.recurso-tradicao .ic { color: var(--tradicao); }
.recurso.pulsa { animation: pulsa 600ms ease; }
@keyframes pulsa { 0% { transform: scale(1); } 35% { transform: scale(1.08); } 100% { transform: scale(1); } }
.hud-acoes { grid-area: acoes; display: flex; gap: 8px; justify-content: flex-end; }
.hud-missao { grid-area: missao; display: flex; align-items: center; gap: 10px; font-size: 14px; min-width: 0; }
.barra-missao { width: 120px; height: 8px; background: rgba(255, 255, 255, 0.25); border-radius: 4px; overflow: hidden; flex: none; }
.barra-missao span { display: block; height: 100%; background: var(--amarelo); }
.hud-missao.cumprida .barra-missao span { background: #7be38a; }
.hud-evento { grid-area: evento; display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; min-height: 32px;
  font-size: 13px; font-weight: 600; border: 2px solid transparent; line-height: 1.2;
}
button.chip { cursor: pointer; }
.chip-evento { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.45); color: #fff; }
.chip-evento.negativo { border-color: #ff9aa6; }
.chip-evento.positivo { border-color: #8ee39a; }
.chip-evento.despesa { border-color: #ffc46b; }
.chip-bonus { background: #e9f9ec; color: #145c33; border-color: #a6e2b3; }

/* Faixa do evento ativo (lembrete da regra da rodada) */
.faixa-evento {
  margin: 0 var(--gutter) 10px; display: flex; align-items: flex-start; gap: 10px;
  background: var(--roxo-escuro); color: #fff; border-radius: 12px; padding: 10px 14px; font-size: 14px;
  border-left: 6px solid var(--amarelo);
}
.faixa-evento.negativo { border-left-color: #ff7b8b; }
.faixa-evento.positivo { border-left-color: #7be38a; }
.faixa-evento.despesa { border-left-color: #ffb23d; }
.faixa-evento strong { font-weight: 800; }
.faixa-evento .estado-regra { display: block; color: #ecdff3; font-size: 13px; margin-top: 2px; }

/* ---------------- Jogo: corpo ---------------- */
.jogo-corpo {
  flex: 1; display: grid; gap: 14px; padding: 0 var(--gutter) var(--gutter);
  grid-template-columns: minmax(0, 1fr) var(--lateral); align-items: start;
}
.quadro {
  display: grid; gap: 12px; grid-template-columns: repeat(5, minmax(180px, 1fr));
  align-items: start; min-width: 0; overflow-x: auto;
}
.coluna {
  --cor-col: var(--col-backlog);
  background: var(--papel); color: var(--tinta); border-radius: var(--raio-painel); padding: 14px 12px 14px;
  min-height: 420px; display: flex; flex-direction: column;
  transition: box-shadow 120ms ease, opacity 120ms ease;
}
.coluna-backlog { --cor-col: var(--col-backlog); }
.coluna-afazer { --cor-col: var(--col-afazer); }
.coluna-andamento { --cor-col: var(--col-andamento); }
.coluna-revisao { --cor-col: var(--col-revisao); }
.coluna-concluido { --cor-col: var(--col-concluido); }
.coluna-cabeca {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  padding: 0 4px 10px; border-bottom: 3px solid var(--cor-col); margin-bottom: 12px;
}
.coluna-cabeca h2 { font-size: 17px; font-weight: 700; white-space: nowrap; }
.coluna-contagem { font-weight: 800; font-size: 17px; }
.coluna-contagem.cheia { color: var(--ruim); }
.coluna-limite { font-size: 12px; color: var(--tinta-2); font-weight: 600; }
.coluna-cards { display: flex; flex-direction: column; gap: 10px; flex: 1; }
.coluna-vazia { color: var(--tinta-2); font-size: 13px; padding: 10px 6px; border: 2px dashed var(--linha); border-radius: 10px; text-align: center; }
.coluna-dica-soltar { display: none; font-size: 12.5px; font-weight: 700; color: var(--bom); padding: 0 4px 8px; }

/* Estados durante o arraste */
.quadro.arrastando .coluna.alvo-valido { box-shadow: 0 0 0 4px var(--amarelo); }
.quadro.arrastando .coluna.alvo-valido .coluna-dica-soltar { display: block; }
.quadro.arrastando .coluna.alvo-valido.sobre { box-shadow: 0 0 0 6px #fff, 0 0 0 10px var(--amarelo); }
.quadro.arrastando .coluna.alvo-invalido { opacity: 0.62; }
.quadro.arrastando .coluna.origem { opacity: 1; }

/* ---------------- Card de projeto ---------------- */
.card {
  --cat: var(--cat-cultura);
  position: relative; background: var(--papel);
  border: 2px solid var(--cat); border-left-width: 8px; border-radius: var(--raio-card);
  padding: 10px 10px 10px 10px; display: flex; flex-direction: column; gap: 8px;
  cursor: pointer;
}
.card[draggable='true'] { cursor: grab; }
.card.sendo-arrastado { opacity: 0.45; }
.card-cat-cultura { --cat: var(--cat-cultura); }
.card-cat-estrutura { --cat: var(--cat-estrutura); }
.card-cat-divulgacao { --cat: var(--cat-divulgacao); }
.card-cat-esporte { --cat: var(--cat-esporte); }
.card-cat-games { --cat: var(--cat-games); }
.card-cat-logistica { --cat: var(--cat-logistica); }
.card-topo { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.card-categoria { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--cat); }
.card-riscos { display: inline-flex; gap: 4px; color: var(--tinta-2); }
.card-riscos .ic { width: 16px; height: 16px; }
.card-titulo { font-size: 15.5px; font-weight: 800; line-height: 1.2; }
.card-titulo button {
  all: unset; cursor: pointer; display: inline; border-radius: 4px;
}
.card-titulo button:focus-visible { outline: 3px solid var(--roxo); outline-offset: 2px; }
.card-dinheiro { display: grid; gap: 2px; font-size: 13px; padding-bottom: 6px; border-bottom: 1px dashed var(--linha); }
.card-dinheiro div { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card-dinheiro dt { color: var(--tinta-2); }
.card-dinheiro dd { font-weight: 800; white-space: nowrap; }
.card-numeros { display: flex; flex-wrap: wrap; gap: 3px 14px; font-size: 12.5px; }
.card-numeros + .card-numeros { margin-top: -5px; }
.card-numeros div { display: flex; align-items: center; gap: 5px; min-width: 0; flex: 1 1 auto; }
.card-numeros dt { color: var(--tinta-2); display: inline-flex; align-items: center; }
.card-numeros dd { font-weight: 700; white-space: nowrap; }
.card-numeros .ic { width: 15px; height: 15px; }
.card-numeros .prestigio .ic { color: var(--prestigio); }
.card-numeros .tradicao .ic { color: var(--tradicao); }
.card-numeros .zero dd { color: #a99bb2; font-weight: 600; }
.card-progresso { display: grid; gap: 4px; font-size: 12.5px; }
.segmentos { display: flex; gap: 4px; }
.segmentos span { flex: 1; height: 8px; border-radius: 4px; background: var(--lavanda-2); }
.segmentos span.feito { background: var(--col-andamento); }
.card-equipe { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--tinta-2); }
.card-equipe .avatar { width: 26px; height: 26px; font-size: 10px; border-width: 2px; }
.card-selos { display: flex; flex-wrap: wrap; gap: 4px; }
.selo { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 2px 7px; font-size: 11.5px; font-weight: 700; line-height: 1.35; }
.selo .ic { width: 13px; height: 13px; }
.selo-alerta { background: #fff1dd; color: #8a4a00; }
.selo-ruim { background: #fde5e8; color: #a3192b; }
.selo-bom { background: #e5f6ea; color: #17663a; }
.selo-info { background: var(--lavanda); color: var(--roxo-escuro); }
.card-acoes { display: flex; flex-wrap: wrap; gap: 6px; }
.card-acoes .botao { flex: 1 1 auto; }
.card.concluido { background: #f7fbf7; }
.card.concluido .card-titulo { color: #2c4a36; }
.card.congelado::after {
  content: ''; position: absolute; inset: 0; border-radius: 4px; pointer-events: none;
  background: repeating-linear-gradient(-45deg, transparent 0 9px, rgba(207, 37, 57, 0.06) 9px 18px);
}

/* ---------------- Avatares ---------------- */
.avatar {
  width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none;
  border: 3px solid var(--papel); background: #f4d7c4;
}
.avatar-iniciais {
  display: inline-grid; place-items: center; font-weight: 800; font-size: 13px; color: #fff;
  background: var(--cat, #7d6a8a); letter-spacing: 0.02em;
}
.avatar-iniciais[data-cat='cultura'] { --cat: var(--cat-cultura); }
.avatar-iniciais[data-cat='estrutura'] { --cat: var(--cat-estrutura); }
.avatar-iniciais[data-cat='divulgacao'] { --cat: #b86f00; }
.avatar-iniciais[data-cat='esporte'] { --cat: var(--cat-esporte); }
.avatar-iniciais[data-cat='games'] { --cat: var(--cat-games); }
.avatar-iniciais[data-cat='logistica'] { --cat: var(--cat-logistica); }
.avatar-iniciais[data-cat='coringa'] { --cat: var(--roxo-escuro); }

/* ---------------- Lateral: equipe e diário ---------------- */
.lateral { display: flex; flex-direction: column; gap: 14px; min-width: 0; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; border-radius: var(--raio-painel); }
.painel { background: var(--papel); color: var(--tinta); border-radius: var(--raio-painel); padding: 16px; }
.painel h2 { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.painel h3 { font-size: 13px; font-weight: 700; color: var(--tinta-2); margin: 14px 0 8px; }
.equipe-resumo { font-size: 13px; color: var(--tinta-2); margin-top: 2px; }
.lista-pessoas { display: grid; gap: 6px; }
.pessoa { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 10px; }
.pessoa .avatar { width: 38px; height: 38px; }
.pessoa-texto { min-width: 0; flex: 1; display: grid; }
.pessoa-nome { font-weight: 700; font-size: 14px; line-height: 1.2; }
.pessoa-papel { font-size: 12px; color: var(--tinta-2); line-height: 1.25; }
.status { font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.status-livre { background: #e5f6ea; color: #17663a; }
.status-ocupado { background: #e2f1fc; color: #12588a; }
.status-revisando { background: #efe5fb; color: #5a2b9b; }
.status-doente { background: #fde5e8; color: #a3192b; }
.status-ausente { background: #f1edf3; color: #7d6d87; }
.pessoa.ausente { opacity: 0.7; }
.lista-voluntarios { grid-template-columns: 1fr; }
.lista-voluntarios .pessoa .avatar { width: 32px; height: 32px; font-size: 11px; border-width: 2px; }

.abas { display: flex; gap: 4px; background: var(--lavanda); padding: 4px; border-radius: 12px; }
.aba {
  flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 8px 6px; min-height: 38px;
  font-weight: 700; font-size: 13px; cursor: pointer; color: var(--tinta-2);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.aba[aria-selected='true'] { background: var(--papel); color: var(--tinta); box-shadow: 0 1px 0 var(--lavanda-2); }
.aba-painel { margin-top: 12px; font-size: 13.5px; }
.historico-rodada h4 { font-size: 12.5px; font-weight: 800; color: var(--roxo); margin: 10px 0 4px; }
.historico-rodada li { padding: 4px 0; border-bottom: 1px solid var(--lavanda); }
.historico-rodada li.missao { color: var(--bom); font-weight: 700; }
.historico-rodada li.evento { color: #6b2a8a; }

.tabela-financas { width: 100%; border-collapse: collapse; font-size: 13px; }
.tabela-financas th { text-align: left; font-size: 12px; color: var(--tinta-2); font-weight: 700; padding: 4px 4px; border-bottom: 2px solid var(--linha); }
.tabela-financas td { padding: 5px 4px; border-bottom: 1px solid var(--lavanda); vertical-align: top; }
.tabela-financas td.valor { text-align: right; font-weight: 700; white-space: nowrap; }
.tabela-financas td.saldo { text-align: right; color: var(--tinta-2); white-space: nowrap; }
.mais { color: var(--bom); }
.menos { color: var(--ruim); }
.resumo-financeiro { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; margin-bottom: 10px; font-size: 13px; }
.resumo-financeiro dd { text-align: right; font-weight: 700; }
.regras-lista { display: grid; gap: 8px; padding-left: 18px; list-style: decimal; }
.regras-lista li::marker { font-weight: 800; color: var(--roxo); }
.nota { font-size: 12.5px; color: var(--tinta-2); }

/* ---------------- Navegação do celular ---------------- */
.nav-celular { display: none; }
.trocar-coluna { display: none; }
.botao-equipe-lateral { display: none; }

/* ---------------- Modais ---------------- */
.modal-fundo {
  position: fixed; inset: 0; z-index: 40; background: rgba(34, 6, 52, 0.62);
  display: grid; place-items: center; padding: 16px; overflow-y: auto;
}
.modal {
  width: min(560px, 100%); background: var(--papel); color: var(--tinta); border-radius: 20px; box-shadow: var(--sombra-modal);
  display: flex; flex-direction: column; max-height: calc(100vh - 32px); overflow: hidden;
  animation: entra 160ms ease-out;
}
.modal:focus { outline: none; }
.modal-largo { width: min(760px, 100%); }
@keyframes entra { from { transform: translateY(10px) scale(0.98); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-cabeca { padding: 20px 22px 6px; display: flex; align-items: flex-start; gap: 12px; }
.modal-cabeca h2 { font-weight: 900; font-stretch: 112%; font-size: 23px; line-height: 1.1; letter-spacing: -0.01em; flex: 1; }
.modal-cabeca .botao-icone { margin: -6px -8px 0 0; }
.modal-sub { font-size: 13.5px; color: var(--tinta-2); margin-top: 4px; font-weight: 500; letter-spacing: 0; font-stretch: 100%; }
.modal-corpo { padding: 10px 22px 8px; overflow-y: auto; display: grid; gap: 14px; }
.modal-rodape {
  padding: 14px 22px 20px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end;
  border-top: 1px solid var(--lavanda);
}
.modal-rodape .botao { flex: 0 1 auto; }
.caixa-info { background: var(--lavanda); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.caixa-alerta { background: #fff1dd; border-radius: 12px; padding: 12px 14px; font-size: 14px; color: #6e3c00; display: flex; gap: 10px; }
.caixa-alerta .ic { color: var(--alerta); margin-top: 2px; }
.caixa-bom { background: #e5f6ea; border-radius: 12px; padding: 12px 14px; font-size: 14px; color: #145c33; display: flex; gap: 10px; }

/* Carta de evento */
.carta-evento { --tipo: var(--ruim); border: 3px solid var(--tipo); border-radius: 16px; overflow: hidden; }
.carta-evento.positivo { --tipo: var(--bom); }
.carta-evento.despesa { --tipo: var(--alerta); }
.carta-evento-tipo {
  background: var(--tipo); color: #fff; padding: 8px 14px; font-weight: 800; font-size: 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.carta-evento-corpo { padding: 14px 16px 16px; display: grid; gap: 10px; }
.carta-evento h3 { font-weight: 900; font-stretch: 118%; font-size: 26px; line-height: 1.02; letter-spacing: -0.015em; }
.carta-evento blockquote { margin: 0; font-style: italic; font-size: 16px; color: var(--tinta-2); }
.carta-evento .efeito { background: var(--lavanda); border-radius: 10px; padding: 10px 12px; font-weight: 600; }
.carta-evento .quando { font-size: 13px; color: var(--tinta-2); display: flex; align-items: center; gap: 6px; }

/* Listas de escolha (equipe, revisor, decisão) */
.lista-opcoes { display: grid; gap: 8px; }
.opcao {
  display: flex; align-items: center; gap: 12px; border: 2px solid var(--linha); border-radius: 12px;
  padding: 8px 12px; cursor: pointer; background: var(--papel); text-align: left; width: 100%;
}
.opcao:hover { border-color: #c9b3d8; }
.opcao.marcada { border-color: var(--roxo); background: #faf5fd; }
.opcao.desabilitada { cursor: not-allowed; opacity: 0.6; }
.opcao input { width: 20px; height: 20px; accent-color: var(--roxo); flex: none; margin: 0; }
.opcao .avatar { width: 40px; height: 40px; }
.opcao-texto { flex: 1; min-width: 0; display: grid; gap: 1px; }
.opcao-texto strong { font-size: 15px; }

.opcao-tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.decisao-opcao { display: grid; gap: 2px; justify-items: start; }
.decisao-opcao strong { font-size: 15px; }
.decisao-opcao span { font-size: 13px; color: var(--tinta-2); }
details.indisponiveis summary { cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--tinta-2); padding: 4px 0; }

.resumo-linhas { display: grid; gap: 6px; }

.mini-recursos { display: flex; flex-wrap: wrap; gap: 8px; }

.passos { display: grid; gap: 10px; counter-reset: passo; }
.passos li { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; font-size: 14.5px; }
.passos li::before {
  counter-increment: passo; content: counter(passo);

}
.lista-simples { display: grid; gap: 6px; padding-left: 18px; list-style: disc; font-size: 14px; }

/* ---------------- Tela final ---------------- */
.tela-fim { max-width: 1100px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 40px) 40px; color: #fff; }
.fim-grade { display: grid; gap: 16px; grid-template-columns: 1.15fr 1fr; align-items: start; }
.fim-destaque { grid-column: 1 / -1; display: grid; gap: 14px; }
.carimbo {

.fim-resumo { font-size: clamp(16px, 2vw, 19px); color: #f1e6f7; max-width: 70ch; }
.aproveitamento { display: grid; gap: 8px; max-width: 720px; }
.aproveitamento-barra { position: relative; height: 18px; background: rgba(255, 255, 255, 0.22); border-radius: 9px; }

.aproveitamento-legenda { position: relative; height: 32px; font-size: 12px; color: #e3d3ec; }

.lista-projetos-fim { display: grid; gap: 6px; font-size: 14px; }

  <script>
/*
 * Operação Grêmio — Mesquita
 * util.js — utilidades sem regra de jogo: sorteio determinístico, clonagem e formatação.
 *
 * Todos os arquivos do jogo seguem o mesmo padrão: um bloco que pendura o próprio
 * módulo em `OG` (objeto global). Assim o jogo abre com duplo clique no index.html
 * (sem servidor) e os testes do Node carregam os mesmos arquivos.
 */
(function (global) {
  'use strict';
  const OG = (global.OG = global.OG || {});

  /**
   * Sorteio determinístico (mulberry32). O estado do sorteio fica salvo dentro do
   * estado da partida (`estado.rng`), então recarregar a página não muda os sorteios.
   */
  function aleatorio(estado) {
    const a = (estado.rng + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    estado.rng = a;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  function inteiroAleatorio(estado, n) {
    return Math.floor(aleatorio(estado) * n);
  }

  function embaralhar(estado, lista) {
    const copia = lista.slice();
    for (let i = copia.length - 1; i > 0; i--) {
      const j = inteiroAleatorio(estado, i + 1);
      const tmp = copia[i];
      copia[i] = copia[j];
      copia[j] = tmp;
    }
    return copia;
  }

  /** O estado é 100% JSON, então a clonagem por JSON é suficiente e segura. */
  function clonar(obj) {
    return JSON.parse(JSON.stringify(obj));
  }

  const NBSP = ' ';

  /** 1234 -> "R$ 1.234,00" (com espaço que não quebra linha). */
  function formatarDinheiro(valor) {
    const negativo = valor < 0;
    const centavosTotais = Math.round(Math.abs(valor) * 100);
    const inteiro = Math.floor(centavosTotais / 100)
      .toString()
      .replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const centavos = (centavosTotais % 100).toString().padStart(2, '0');
    return (negativo ? '−' : '') + 'R$' + NBSP + inteiro + ',' + centavos;
  }

  /** Valor com sinal, para históricos: +R$ 80,00 / −R$ 40,00 */
  function formatarDinheiroComSinal(valor) {
    if (valor > 0) return '+' + formatarDinheiro(valor);
    return formatarDinheiro(valor);
  }

  function formatarPontos(valor) {
    return (valor > 0 ? '+' : valor < 0 ? '−' : '') + Math.abs(valor);
  }

  /** Lista em português: ["a","b","c"] -> "a, b e c" */
  function listaPt(itens) {
    if (itens.length <= 1) return itens.join('');
    return itens.slice(0, -1).join(', ') + ' e ' + itens[itens.length - 1];
  }

  function plural(n, singular, pluralTexto) {
    return n === 1 ? singular : pluralTexto;
  }

  OG.util = {
    aleatorio,
    inteiroAleatorio,
    embaralhar,
    clonar,
    formatarDinheiro,
    formatarDinheiroComSinal,
    formatarPontos,
    listaPt,
    plural,
    NBSP,
  };
})(globalThis);

</script>
  <script>
/*
 * regras.js — números que definem a partida. Mudou o balanceamento? É aqui.
 */
(function (global) {
  'use strict';
  const OG = (global.OG = global.OG || {});

  OG.regras = Object.freeze({
    VERSAO_ESTADO: 1,

    TOTAL_RODADAS: 4,
    EVENTOS_POR_PARTIDA: 4,
    LIMITE_EM_ANDAMENTO: 2,

    CAIXA_INICIAL: 500,
    // Opção "Caixa apertado" (Configurações): com R$ 500 o caixa nunca trava a partida
    // nas simulações (menor caixa ~R$ 250). Com R$ 200 o dinheiro vira decisão de verdade.
    CAIXA_APERTADO: 200,
    PRESTIGIO_INICIAL: 20,
    TRADICAO_INICIAL: 20,

    // Especialista na equipe: desconto no custo do projeto (por pessoa).
    DESCONTO_ESPECIALISTA: 10,

    // Trabalhador temporário (evento "Patrício Ajudou"): esta rodada e a próxima.
    DURACAO_TEMPORARIO: 2,

    // Despesa obrigatória sem caixa: o que faltar vira desgaste de prestígio.
    REAIS_POR_PONTO_DE_DESGASTE: 10,

    // Pontuação final.
    REAIS_POR_PONTO: 10,
    PONTOS_POR_PROJETO: 5,

    COLUNAS: Object.freeze([
      Object.freeze({ id: 'backlog', nome: 'Backlog', dica: 'Projetos da missão ainda não escolhidos.' }),
      Object.freeze({ id: 'afazer', nome: 'A Fazer', dica: 'Escolhidos e prontos para começar.' }),
      Object.freeze({ id: 'andamento', nome: 'Em Andamento', dica: 'Sendo executados. Máximo de 2.', limite: 2 }),
      Object.freeze({ id: 'revisao', nome: 'Revisão', dica: 'Execução terminada. Um coordenador confere.' }),
      Object.freeze({ id: 'concluido', nome: 'Concluído', dica: 'Pronto! Retorno e pontos creditados.' }),
    ]),

    /*
     * Classificações, em % da META da missão (aproveitamento).
     *
     * Por que não pontos absolutos? Com a fórmula de pontuação, só o caixa e os
     * recursos iniciais já valem 90 pontos: com os limites originais em pontos
     * (100/80/60/40), quem não fizesse NADA terminaria como "GRÊMIO DESTAQUE".
     * Além disso, cada missão tem um potencial diferente (a Farroupilha rende
     * tradição, a Junina não). Então os mesmos números 100/80/60/40 passaram a ser
     * porcentagem de APROVEITAMENTO:
     *   pontos conquistados na partida ÷ pontos que o melhor plano possível conquistaria
     * ("conquistados" = pontuação final − pontos iniciais; o melhor plano é calculado
     * a partir dos próprios cards em pontuacao.js, sem eventos).
     */
    CLASSIFICACOES: Object.freeze([
      Object.freeze({ minimo: 100, nome: 'GRÊMIO LENDÁRIO' }),
      Object.freeze({ minimo: 80, nome: 'GRÊMIO DESTAQUE' }),
      Object.freeze({ minimo: 60, nome: 'GRÊMIO APROVADO' }),
      Object.freeze({ minimo: 40, nome: 'GRÊMIO SOBREVIVEU' }),
      Object.freeze({ minimo: -Infinity, nome: 'A DIREÇÃO QUER CONVERSAR' }),
    ]),
  });
})(globalThis);

</script>

 * personagens.js — coordenadores e voluntários ficam em listas SEPARADAS.
 *
 * Especialidade: quem é especialista na categoria do projeto dá R$ 10 de desconto

  <script>
/*
 * estado.js — leitura do estado da partida (seletores) e erros de regra.
 *
 * Princípio: os números exibidos são SEMPRE derivados do estado real.
 * Caixa, prestígio e tradição não são contadores soltos: são a soma do livro-caixa
 * (`estado.livro`), onde cada lançamento tem rodada, tipo e motivo.
 * A ocupação de cada pessoa também é derivada (equipes dos cards, revisões, doença).
 */
(function (global) {
  'use strict';
  const OG = (global.OG = global.OG || {});

  class ErroDeRegra extends Error {
    constructor(mensagem) {
      super(mensagem);
      this.name = 'ErroDeRegra';
    }
  }

  function exigir(condicao, mensagem) {
    if (!condicao) throw new ErroDeRegra(mensagem);
  }

  // ---------- Dados ----------

  function projeto(id) {
    return OG.dados.projetosPorId[id] || null;
  }

  function projetoDaCarta(carta) {
    return projeto(carta.projetoId);
  }

  function missao(estado) {
    return OG.dados.missoesPorId[estado.missaoId] || null;
  }

  let mapaPessoas = null;
  function indicePessoas() {
    if (!mapaPessoas) {
      mapaPessoas = {};
      OG.dados.coordenadores.forEach(function (p) {
        mapaPessoas[p.id] = Object.assign({ papel: 'coordenador' }, p);
      });
      OG.dados.voluntarios.forEach(function (p) {
        mapaPessoas[p.id] = Object.assign({ papel: 'voluntario' }, p);
      });
    }
    return mapaPessoas;
  }

  function pessoa(id) {
    return indicePessoas()[id] || null;
  }

  function todasPessoas() {
    const idx = indicePessoas();
    return Object.keys(idx).map(function (id) {
      return idx[id];
    });
  }

  function ehCoordenador(id) {
    const p = pessoa(id);
    return !!p && p.papel === 'coordenador';
  }

  function ehEspecialista(p, proj) {
    if (!p || !proj) return false;
    const e = p.especialidade || {};
    if (e.coringa) return true;
    if (e.categorias && e.categorias.indexOf(proj.categoria) !== -1) return true;
    if (e.riscos && e.riscos.some(function (r) { return proj.riscos.indexOf(r) !== -1; })) return true;
    return false;
  }

  // ---------- Cards ----------

  function carta(estado, id) {
    for (let i = 0; i < estado.cartas.length; i++) {
      if (estado.cartas[i].id === id) return estado.cartas[i];
    }
    return null;
  }

  function cartasNaColuna(estado, coluna) {
    return estado.cartas
      .filter(function (c) { return c.coluna === coluna; })
      .sort(function (a, b) { return a.ordem - b.ordem; });
  }

  function totalConcluidos(estado) {
    return cartasNaColuna(estado, 'concluido').length;
  }

  // ---------- Recursos (derivados do livro-caixa) ----------

  function recursos(estado) {
    const r = { dinheiro: 0, prestigio: 0, tradicao: 0 };
    estado.livro.forEach(function (l) {
      r[l.recurso] += l.valor;
    });
    return r;
  }

  // ---------- Evento da rodada ----------

  function definicaoEvento(id) {
    return OG.dados.eventosPorId[id] || null;
  }

  function eventoAtual(estado) {
    return estado.eventoAtual ? definicaoEvento(estado.eventoAtual.id) : null;
  }

  /** O evento vale para a rodada depois de confirmado (fase de planejamento em diante). */
  function eventoAtivo(estado, id) {
    return !!estado.eventoAtual &&
      estado.eventoAtual.id === id &&
      estado.eventoAtual.rodada === estado.rodada &&
      estado.eventoAtual.resolvido === true;
  }

  /** Motivo pelo qual o card está congelado nesta rodada (Impressora / Quadra), ou null. */
  function bloqueioDaCarta(estado, c) {
    const proj = projetoDaCarta(c);
    if (eventoAtivo(estado, 'ev_impressora') && proj.categoria === 'divulgacao') {
      return 'Impressora do T11 pifou: cards de Divulgação não avançam nesta rodada.';
    }
    if (eventoAtivo(estado, 'ev_quadra') && proj.riscos.indexOf('quadra') !== -1) {
      return 'A quadra continua em reforma: projetos que usam a quadra ficam parados nesta rodada.';
    }
    return null;
  }

  // ---------- Pessoas ----------

  function registroTemporario(estado, pessoaId) {
    for (let i = 0; i < estado.temporarios.length; i++) {
      const t = estado.temporarios[i];
      if (t.pessoaId === pessoaId && t.ateRodada >= estado.rodada) return t;
    }
    return null;
  }

  function presente(estado, pessoaId) {
    const p = pessoa(pessoaId);
    if (!p) return false;
    if (p.somentePorEvento) return !!registroTemporario(estado, pessoaId);
    return true;
  }

  /** Quantas rodadas a pessoa ainda fica (contando a atual). Pessoas fixas: Infinity. */
  function rodadasRestantes(estado, pessoaId) {
    const p = pessoa(pessoaId);
    if (!p) return 0;
    if (!p.somentePorEvento) return Infinity;
    const t = registroTemporario(estado, pessoaId);
    return t ? t.ateRodada - estado.rodada + 1 : 0;
  }

  function cartaDaPessoa(estado, pessoaId) {
    for (let i = 0; i < estado.cartas.length; i++) {
      const c = estado.cartas[i];
      if (c.coluna === 'andamento' && c.equipe.indexOf(pessoaId) !== -1) return c;
    }
    return null;
  }

  function estaDoente(estado, pessoaId) {
    return estado.doentes.some(function (d) {
      return d.pessoaId === pessoaId && d.rodada === estado.rodada;
    });
  }

  /**
   * Situação de uma pessoa agora.
   * codigo: 'ausente' | 'doente' | 'ocupado' | 'revisando' | 'livre'
   */
  function statusPessoa(estado, pessoaId) {
    const p = pessoa(pessoaId);
    if (!p || !presente(estado, pessoaId)) {
      return { codigo: 'ausente', texto: 'Só aparece com o evento “Patrício Ajudou”' };
    }
    if (estaDoente(estado, pessoaId)) {
      return { codigo: 'doente', texto: 'Com influenza nesta rodada' };
    }
    const c = cartaDaPessoa(estado, pessoaId);
    if (c) {
      return { codigo: 'ocupado', texto: 'Em ' + projetoDaCarta(c).nome, cartaId: c.id };
    }
    if (estado.revisoresDaRodada.indexOf(pessoaId) !== -1) {
      return { codigo: 'revisando', texto: 'Revisou um projeto nesta rodada' };
    }
    return { codigo: 'livre', texto: 'Disponível' };
  }

  function pessoasLivres(estado) {
    return todasPessoas().filter(function (p) {
      return statusPessoa(estado, p.id).codigo === 'livre';
    });
  }

  function coordenadoresLivres(estado) {
    return pessoasLivres(estado).filter(function (p) {
      return p.papel === 'coordenador';
    });
  }

  /** Rodada em que um projeto iniciado agora ficaria pronto para revisão e se ainda dá tempo de concluir. */
  function terminaATempo(estado, c) {
    const proj = projetoDaCarta(c);
    const restante = proj.tempo - c.progresso;
    // Executa nas rodadas atual..atual+restante-1 e é revisado na rodada seguinte.
    return estado.rodada + restante <= OG.regras.TOTAL_RODADAS;
  }

  OG.estado = {
    ErroDeRegra,
    exigir,
    projeto,
    projetoDaCarta,
    missao,
    pessoa,
    todasPessoas,
    ehCoordenador,
    ehEspecialista,
    carta,
    cartasNaColuna,
    totalConcluidos,
    recursos,
    definicaoEvento,
    eventoAtual,
    eventoAtivo,
    bloqueioDaCarta,
    registroTemporario,
    presente,
    rodadasRestantes,
    cartaDaPessoa,
    estaDoente,
    statusPessoa,
    pessoasLivres,
    coordenadoresLivres,
    terminaATempo,
  };
})(globalThis);

  <script>
/*
 * financas.js — livro-caixa, custo de projetos (com descontos) e despesas.
 *
 * Regras:
 *  - Caixa nunca fica negativo (não existe dívida nesta versão).
 *  - Prestígio e tradição nunca ficam abaixo de 0.
 *  - Custo final = custo base − 50% (se houver Doação do Sindicato)
 *                   − R$ 10 por especialista na equipe
 *                   − R$ 40 (se houver Material Encontrado)
 *    nunca abaixo de R$ 0. Descontos pendentes são consumidos pelo PRÓXIMO projeto iniciado.
 *  - Despesa obrigatória sem caixa suficiente: paga-se o que houver e o que faltar
 *    vira desgaste: −1 Prestígio a cada R$ 10 (arredondado para cima).
 */
(function (global) {
  'use strict';
  const OG = (global.OG = global.OG || {});

  function lancar(estado, recurso, valor, tipo, descricao) {
    if (!valor) return 0;
    const atual = OG.estado.recursos(estado)[recurso];
    let aplicado = valor;
    if (atual + valor < 0) {
      if (recurso === 'dinheiro') {
        // Nunca deveria acontecer: toda cobrança valida o caixa antes.
        throw new Error('Erro interno: o caixa ficaria negativo (' + descricao + ').');
      }
      aplicado = -atual;
    }
    if (aplicado === 0) return 0;
    estado.livro.push({
      rodada: estado.rodada,
      recurso: recurso,
      valor: aplicado,
      tipo: tipo,
      descricao: descricao,
    });
    return aplicado;
  }

  function caixa(estado) {
    return OG.estado.recursos(estado).dinheiro;
  }

  /**
   * Calcula o custo de iniciar o card com a equipe informada.
   * Retorna { base, itens: [{rotulo, valor}], final, jaPago, especialistas }
   */
  function calcularCusto(estado, carta, equipe) {
    const E = OG.estado;
    const proj = E.projetoDaCarta(carta);
    const ids = Array.isArray(equipe) ? equipe : [];
    const especialistas = ids.filter(function (id) {
      return E.ehEspecialista(E.pessoa(id), proj);
    });

    if (carta.custoPago !== null) {
      return { base: proj.custo, itens: [], final: 0, jaPago: true, especialistas: especialistas };
    }

    const itens = [];
    let valor = proj.custo;

    estado.descontosPendentes
      .filter(function (d) { return d.tipo === 'percentual'; })
      .forEach(function (d) {
        const desconto = Math.floor((valor * d.valor) / 100);
        if (desconto > 0) {
          itens.push({ rotulo: d.origem + ' (−' + d.valor + '%)', valor: -desconto });
          valor -= desconto;
        }
      });

    especialistas.forEach(function (id) {
      itens.push({ rotulo: 'Especialista: ' + E.pessoa(id).nome, valor: -OG.regras.DESCONTO_ESPECIALISTA });
      valor -= OG.regras.DESCONTO_ESPECIALISTA;
    });

    estado.descontosPendentes
      .filter(function (d) { return d.tipo === 'fixo'; })
      .forEach(function (d) {
        itens.push({ rotulo: d.origem, valor: -d.valor });
        valor -= d.valor;
      });

    return {
      base: proj.custo,
      itens: itens,
      final: Math.max(0, valor),
      jaPago: false,
      especialistas: especialistas,
    };
  }

  /** Despesa sem alternativa: paga o que der; o resto vira desgaste de prestígio. */
  function cobrarDespesaObrigatoria(estado, despesaId) {
    const desp = OG.dados.despesas[despesaId];
    const disponivel = caixa(estado);
    const pago = Math.min(desp.valor, disponivel);
    if (pago > 0) lancar(estado, 'dinheiro', -pago, 'despesa', desp.nome);
    const falta = desp.valor - pago;
    let desgaste = 0;
    if (falta > 0) {
      desgaste = Math.ceil(falta / OG.regras.REAIS_POR_PONTO_DE_DESGASTE);
      desgaste = -lancar(
        estado,
        'prestigio',
        -desgaste,
        'desgaste',
        'Faltou ' + OG.util.formatarDinheiro(falta) + ' para pagar: ' + desp.nome
      );
    }
    return { pago: pago, falta: falta, desgaste: desgaste, despesa: desp };
  }

  /** Despesa que o jogador escolheu pagar: exige caixa suficiente. */
  function pagarDespesaOpcional(estado, despesaId) {
    const desp = OG.dados.despesas[despesaId];
    OG.estado.exigir(
      caixa(estado) >= desp.valor,
      'Caixa insuficiente para pagar ' + desp.nome + ' (' + OG.util.formatarDinheiro(desp.valor) + ').'
    );
    lancar(estado, 'dinheiro', -desp.valor, 'despesa', desp.nome);
    return desp;
  }

  OG.financas = {
    lancar,
    caixa,
    calcularCusto,
    cobrarDespesaObrigatoria,
    pagarDespesaOpcional,
  };
})(globalThis);

</script>
  <script>
/*
 * kanban.js — regras de movimentação dos cards.
 *
 * Fluxo: BACKLOG -> A FAZER -> EM ANDAMENTO -> REVISÃO -> CONCLUÍDO
 *   - BACKLOG <-> A FAZER: planejamento (livre).
 *   - A FAZER -> EM ANDAMENTO: exige vaga (máx. 2), equipe completa e caixa. Paga o custo UMA vez.
 *   - EM ANDAMENTO -> REVISÃO: automático no fim da rodada quando o progresso completa
 *     (ou na hora, com o Mutirão). O jogador não consegue "pular" a execução.
 *   - REVISÃO -> CONCLUÍDO: um coordenador livre confere. Credita retorno e pontos UMA vez.
 *   - Cards iniciados não voltam por ação do jogador (só por evento).
 *
 * Toda regra é validada AQUI, no núcleo. A interface só reflete o resultado.
 */
(function (global) {
  'use strict';
  const OG = (global.OG = global.OG || {});

  const ORDEM = ['backlog', 'afazer', 'andamento', 'revisao', 'concluido'];

  function E() { return OG.estado; }
  function exigir(c, m) { OG.estado.exigir(c, m); }
  function nomeColuna(id) {
    const col = OG.regras.COLUNAS.find(function (c) { return c.id === id; });
    return col ? col.nome.toUpperCase() : id;
  }

  function mensagemFase(estado) {
    switch (estado.fase) {
      case 'evento': return 'Primeiro confira o evento da rodada.';
      case 'decisao': return 'Primeiro decida o efeito do evento no fim da rodada.';
      case 'resumo': return 'A rodada terminou. Avance para a próxima rodada.';
      case 'fim': return 'A partida acabou.';
      default: return 'Ação indisponível agora.';
    }
  }

  function validarFase(estado) {
    exigir(estado.fase === 'planejamento', mensagemFase(estado));
  }

  function obterCarta(estado, cartaId) {
    const c = E().carta(estado, cartaId);
    exigir(!!c, 'Card não encontrado.');
    return c;
  }

  function validarProvas(estado, c) {
    if (!E().eventoAtivo(estado, 'ev_provas')) return;
    const movidas = estado.cartasMovidasNaRodada;
    if (movidas.length === 0 || movidas.indexOf(c.id) !== -1) return;
    const outra = E().carta(estado, movidas[0]);
    exigir(false, 'Semana de Provas: só um card pode ser movimentado nesta rodada, e já foi “' +
      E().projetoDaCarta(outra).nome + '”.');
  }

  function validarNaoCongelada(estado, c) {
    const motivo = E().bloqueioDaCarta(estado, c);
    exigir(!motivo, motivo);
  }

  function registrarMovimento(estado, c) {
    if (estado.cartasMovidasNaRodada.indexOf(c.id) === -1) estado.cartasMovidasNaRodada.push(c.id);
  }

  function moverPara(estado, c, coluna) {
    c.coluna = coluna;
    c.ordem = estado.proximaOrdem++;
  }

  function historico(estado, tipo, texto) {
    estado.historico.push({ rodada: estado.rodada, tipo: tipo, texto: texto });
  }

  // ---------------- Planejamento (BACKLOG <-> A FAZER) ----------------

  function validarPlanejar(estado, c) {
    validarFase(estado);
    exigir(c.coluna === 'backlog', 'Só cards do BACKLOG podem ir para A FAZER.');
    validarNaoCongelada(estado, c);
    validarProvas(estado, c);
  }

  function planejar(estado, cartaId) {
    const c = obterCarta(estado, cartaId);
    validarPlanejar(estado, c);
    moverPara(estado, c, 'afazer');
    registrarMovimento(estado, c);
    historico(estado, 'acao', E().projetoDaCarta(c).nome + ' foi para A FAZER.');
  }

  function validarDesplanejar(estado, c) {
    validarFase(estado);
    exigir(c.coluna === 'afazer', 'Só cards de A FAZER podem voltar para o BACKLOG.');
    exigir(c.custoPago === null, 'Este projeto já foi pago: ele fica em A FAZER até ser retomado.');
    validarProvas(estado, c);
  }

  function desplanejar(estado, cartaId) {
    const c = obterCarta(estado, cartaId);
    validarDesplanejar(estado, c);
    moverPara(estado, c, 'backlog');
    registrarMovimento(estado, c);
    historico(estado, 'acao', E().projetoDaCarta(c).nome + ' voltou para o BACKLOG.');
  }

  // ---------------- Início (A FAZER -> EM ANDAMENTO) ----------------

  function iniciadosNaRodada(estado) {
    return estado.cartas.filter(function (c) {
      return c.iniciadoNaRodada === estado.rodada && c.coluna !== 'backlog' && c.coluna !== 'afazer';
    });
  }

  /** Pessoas que poderiam entrar na equipe deste card agora. */
  function candidatos(estado, c) {
    const proj = E().projetoDaCarta(c);
    const restante = proj.tempo - c.progresso;
    return E().pessoasLivres(estado).filter(function (p) {
      return E().rodadasRestantes(estado, p.id) >= restante;
    });
  }

  /** Validações que não dependem da equipe escolhida (usadas também no arrastar). */
  function validarPreInicio(estado, c) {
    validarFase(estado);
    exigir(c.coluna === 'afazer',
      c.coluna === 'backlog'
        ? 'Primeiro planeje: mova o card para A FAZER.'
        : 'Só cards em A FAZER podem ser iniciados.');
    if (E().eventoAtivo(estado, 'ev_chimarrao')) {
      const iniciado = iniciadosNaRodada(estado)[0];
      exigir(!iniciado,
        'Acabou o Chimarrão: a equipe só teve força para começar um projeto nesta rodada' +
        (iniciado ? ' (já começou “' + E().projetoDaCarta(iniciado).nome + '”).' : '.'));
    }
    validarProvas(estado, c);
    validarNaoCongelada(estado, c);
    const emAndamento = E().cartasNaColuna(estado, 'andamento').length;
    exigir(emAndamento < OG.regras.LIMITE_EM_ANDAMENTO,
      'Limite atingido: já há ' + OG.regras.LIMITE_EM_ANDAMENTO +
      ' projetos EM ANDAMENTO. Espere um terminar a execução.');

    const proj = E().projetoDaCarta(c);
    const cand = candidatos(estado, c);
    exigir(cand.length >= proj.trabalhadores,
      'Falta gente: este projeto precisa de ' + proj.trabalhadores + ' ' +
      OG.util.plural(proj.trabalhadores, 'pessoa livre', 'pessoas livres') + ' e há ' + cand.length + '.');

    if (c.custoPago === null) {
      // Melhor caso: tantos especialistas quanto possível.
      const especialistas = cand.filter(function (p) { return E().ehEspecialista(p, proj); })
        .slice(0, proj.trabalhadores)
        .map(function (p) { return p.id; });
      const melhor = OG.financas.calcularCusto(estado, c, especialistas);
      const disponivel = OG.financas.caixa(estado);
      exigir(disponivel >= melhor.final,
        'Caixa insuficiente: iniciar ' + proj.nome + ' custa ' + OG.util.formatarDinheiro(melhor.final) +
        ' e o caixa tem ' + OG.util.formatarDinheiro(disponivel) + '.');
    }
  }

  function validarEquipe(estado, c, equipe) {
    const proj = E().projetoDaCarta(c);
    exigir(Array.isArray(equipe), 'Escolha a equipe do projeto.');
    const unicos = equipe.filter(function (id, i) { return equipe.indexOf(id) === i; });
    exigir(unicos.length === equipe.length, 'A mesma pessoa foi escolhida duas vezes.');
    exigir(equipe.length === proj.trabalhadores,
      proj.nome + ' precisa de exatamente ' + proj.trabalhadores + ' ' +
      OG.util.plural(proj.trabalhadores, 'pessoa', 'pessoas') + ' (escolhidas: ' + equipe.length + ').');
    const restante = proj.tempo - c.progresso;
    equipe.forEach(function (id) {
      const p = E().pessoa(id);
      exigir(!!p, 'Pessoa desconhecida na equipe.');
      const st = E().statusPessoa(estado, id);
      exigir(st.codigo === 'livre', p.nome + ' não está disponível: ' + st.texto.toLowerCase() + '.');
      const fica = E().rodadasRestantes(estado, id);
      exigir(fica >= restante,
        p.nome + ' só fica mais ' + fica + ' ' + OG.util.plural(fica, 'rodada', 'rodadas') +
        ', e este projeto precisa de ' + restante + '.');
    });
  }

  function validarInicio(estado, c, equipe) {
    validarPreInicio(estado, c);
    validarEquipe(estado, c, equipe);
    const custo = OG.financas.calcularCusto(estado, c, equipe);
    const disponivel = OG.financas.caixa(estado);
    exigir(disponivel >= custo.final,
      'Caixa insuficiente: com essa equipe o projeto custa ' + OG.util.formatarDinheiro(custo.final) +
      ' e o caixa tem ' + OG.util.formatarDinheiro(disponivel) + '.');
    return custo;
  }

  function iniciar(estado, cartaId, equipe) {
    const c = obterCarta(estado, cartaId);
    const proj = E().projetoDaCarta(c);
    const custo = validarInicio(estado, c, equipe);
    const fmt = OG.util.formatarDinheiro;

    if (custo.jaPago) {
      historico(estado, 'acao', proj.nome + ' foi retomado. O custo já tinha sido pago, nada foi cobrado.');
    } else {
      if (custo.final > 0) {
        OG.financas.lancar(estado, 'dinheiro', -custo.final, 'custo', 'Início: ' + proj.nome);
      }
      c.custoPago = custo.final;
      c.custoItens = custo.itens;
      const usados = estado.descontosPendentes.map(function (d) { return d.origem; });
      estado.descontosPendentes = [];
      let texto = proj.nome + ' começou. Custo pago: ' + fmt(custo.final);
      if (custo.itens.length) texto += ' (base ' + fmt(custo.base) + ')';
      if (usados.length) texto += '. Desconto usado: ' + OG.util.listaPt(usados);
      historico(estado, 'acao', texto + '.');
    }

    moverPara(estado, c, 'andamento');
    c.equipe = equipe.slice();
    c.iniciadoNaRodada = estado.rodada;
    registrarMovimento(estado, c);
  }

  // ---------------- Revisão (REVISÃO -> CONCLUÍDO) ----------------

  function validarPreRevisao(estado, c) {
    validarFase(estado);
    exigir(c.coluna === 'revisao',
      c.coluna === 'andamento'
        ? 'O projeto ainda está em execução. Ele vai para REVISÃO no fim da rodada em que completar o progresso.'
        : 'Só cards em REVISÃO podem ser concluídos.');
    validarProvas(estado, c);
    validarNaoCongelada(estado, c);
    exigir(E().coordenadoresLivres(estado).length > 0,
      'Nenhum coordenador livre para revisar. Coordenadores em projetos, doentes ou que já revisaram nesta rodada não podem revisar.');
  }

  function validarRevisao(estado, c, revisorId) {
    validarPreRevisao(estado, c);
    const p = E().pessoa(revisorId);
    exigir(!!p, 'Escolha um coordenador para revisar.');
    exigir(E().ehCoordenador(revisorId), 'Só coordenadores fazem a revisão final. ' + p.nome + ' é voluntário.');
    const st = E().statusPessoa(estado, revisorId);
    exigir(st.codigo === 'livre', p.nome + ' não está disponível: ' + st.texto.toLowerCase() + '.');
  }

  function verificarMissao(estado) {
    if (estado.missaoCumprida) return;
    const m = E().missao(estado);
    if (E().totalConcluidos(estado) < m.objetivo) return;
    estado.missaoCumprida = true;
    const rec = m.recompensa;
    const partes = [];
    if (rec.dinheiro) {
      OG.financas.lancar(estado, 'dinheiro', rec.dinheiro, 'recompensa', 'Missão cumprida: ' + m.nome);
      partes.push(OG.util.formatarDinheiroComSinal(rec.dinheiro));
    }
    if (rec.prestigio) {
      OG.financas.lancar(estado, 'prestigio', rec.prestigio, 'recompensa', 'Missão cumprida: ' + m.nome);
      partes.push('+' + rec.prestigio + ' Prestígio');
    }
    if (rec.tradicao) {
      OG.financas.lancar(estado, 'tradicao', rec.tradicao, 'recompensa', 'Missão cumprida: ' + m.nome);
      partes.push('+' + rec.tradicao + ' Tradição');
    }
    historico(estado, 'missao', 'MISSÃO CUMPRIDA: ' + m.nome + '! Recompensa: ' + OG.util.listaPt(partes) + '.');
  }

  function revisar(estado, cartaId, revisorId) {
    const c = obterCarta(estado, cartaId);
    validarRevisao(estado, c, revisorId);
    const proj = E().projetoDaCarta(c);

    moverPara(estado, c, 'concluido');
    c.revisor = revisorId;
    c.concluidoNaRodada = estado.rodada;
    estado.revisoresDaRodada.push(revisorId);
    registrarMovimento(estado, c);

    if (!c.recompensado) {
      c.recompensado = true;
      OG.financas.lancar(estado, 'dinheiro', proj.retorno, 'retorno', 'Concluído: ' + proj.nome);
      if (proj.prestigio) OG.financas.lancar(estado, 'prestigio', proj.prestigio, 'pontos', 'Concluído: ' + proj.nome);
      if (proj.tradicao) OG.financas.lancar(estado, 'tradicao', proj.tradicao, 'pontos', 'Concluído: ' + proj.nome);
      const lucro = proj.retorno - (c.custoPago || 0);
      historico(estado, 'acao', proj.nome + ' CONCLUÍDO (revisão: ' + E().pessoa(revisorId).nome + '). Retorno ' +
        OG.util.formatarDinheiro(proj.retorno) + ', lucro do projeto ' + OG.util.formatarDinheiro(lucro) + '.');
    }
    verificarMissao(estado);
  }

  // ---------------- Completar equipe ----------------

  function completarEquipe(estado, cartaId, pessoaId) {
    validarFase(estado);
    const c = obterCarta(estado, cartaId);
    const proj = E().projetoDaCarta(c);
    exigir(c.coluna === 'andamento', 'Só projetos EM ANDAMENTO recebem reforço na equipe.');
    exigir(c.equipe.length < proj.trabalhadores, 'A equipe deste projeto já está completa.');
    const p = E().pessoa(pessoaId);
    exigir(!!p, 'Pessoa desconhecida.');
    const st = E().statusPessoa(estado, pessoaId);
    exigir(st.codigo === 'livre', p.nome + ' não está disponível: ' + st.texto.toLowerCase() + '.');
    const restante = proj.tempo - c.progresso;
    const fica = E().rodadasRestantes(estado, pessoaId);
    exigir(fica >= restante, p.nome + ' só fica mais ' + fica + ' ' + OG.util.plural(fica, 'rodada', 'rodadas') + '.');
    c.equipe.push(pessoaId);
    historico(estado, 'acao', p.nome + ' reforçou a equipe de ' + proj.nome + '.');
  }

  // ---------------- Mutirão ----------------

  function mutiraoDisponivel(estado) {
    return estado.fase === 'planejamento' &&
      !!estado.mutirao &&
      estado.mutirao.rodada === estado.rodada &&
      !estado.mutirao.usado;
  }

  function usarMutirao(estado, cartaId) {
    validarFase(estado);
    exigir(mutiraoDisponivel(estado), 'Não há Mutirão disponível nesta rodada.');
    const c = obterCarta(estado, cartaId);
    exigir(c.coluna === 'andamento', 'O Mutirão só ajuda projetos EM ANDAMENTO.');
    validarNaoCongelada(estado, c);
    const proj = E().projetoDaCarta(c);
    c.progresso += 1;
    estado.mutirao.usado = true;
    if (c.progresso >= proj.tempo) {
      moverPara(estado, c, 'revisao');
      c.equipeFinal = c.equipe.slice();
      c.equipe = [];
      historico(estado, 'acao', 'Mutirão da Gurizada: ' + proj.nome + ' terminou a execução na hora e foi para REVISÃO.');
    } else {
      historico(estado, 'acao', 'Mutirão da Gurizada: ' + proj.nome + ' avançou para ' + c.progresso + '/' + proj.tempo + '.');
    }
  }

  // ---------------- Arrastar e soltar ----------------

  /**
   * Diz se o card pode ir para a coluna e qual ação isso dispara.
   * acao: 'planejar' | 'desplanejar' | 'iniciar' (pede equipe) | 'revisar' (pede revisor)
   */
  function avaliarMovimento(estado, cartaId, destino) {
    const c = E().carta(estado, cartaId);
    if (!c) return { ok: false, motivo: 'Card não encontrado.' };
    if (c.coluna === destino) return { ok: false, motivo: 'O card já está em ' + nomeColuna(destino) + '.', mesmaColuna: true };
    const de = ORDEM.indexOf(c.coluna);
    const para = ORDEM.indexOf(destino);
    if (para === -1) return { ok: false, motivo: 'Coluna inválida.' };
    try {
      if (c.coluna === 'backlog' && destino === 'afazer') { validarPlanejar(estado, c); return { ok: true, acao: 'planejar' }; }
      if (c.coluna === 'afazer' && destino === 'backlog') { validarDesplanejar(estado, c); return { ok: true, acao: 'desplanejar' }; }
      if (c.coluna === 'afazer' && destino === 'andamento') { validarPreInicio(estado, c); return { ok: true, acao: 'iniciar' }; }
      if (c.coluna === 'revisao' && destino === 'concluido') { validarPreRevisao(estado, c); return { ok: true, acao: 'revisar' }; }
    } catch (erro) {
      if (erro instanceof OG.estado.ErroDeRegra) return { ok: false, motivo: erro.message };
      throw erro;
    }
    if (estado.fase !== 'planejamento') return { ok: false, motivo: mensagemFase(estado) };
    if (c.coluna === 'concluido') return { ok: false, motivo: 'Projetos concluídos não mudam mais de coluna.' };
    if (para < de) {
      return { ok: false, motivo: 'Projetos iniciados não voltam: o custo já foi pago e a equipe está trabalhando.' };
    }
    if (c.coluna === 'backlog') return { ok: false, motivo: 'Primeiro planeje: mova o card para A FAZER.' };
    if (c.coluna === 'afazer') return { ok: false, motivo: 'Antes o projeto precisa ser executado: inicie-o em EM ANDAMENTO.' };
    if (c.coluna === 'andamento') {
      return { ok: false, motivo: 'A execução não pode ser pulada: o card vai sozinho para REVISÃO no fim da rodada em que completar o progresso.' };
    }
    return { ok: false, motivo: 'Movimento não permitido.' };
  }

  OG.kanban = {
    ORDEM,
    nomeColuna,
    mensagemFase,
    iniciadosNaRodada,
    candidatos,
    validarPreInicio,
    validarInicio,
    validarPreRevisao,
    validarRevisao,
    planejar,
    desplanejar,
    iniciar,
    revisar,
    completarEquipe,
    mutiraoDisponivel,
    usarMutirao,
    avaliarMovimento,
    verificarMissao,
  };
})(globalThis);

</script>
  <script>
/*
 * eventos.js (núcleo) — baralho, revelação, efeitos imediatos e efeitos de fim de rodada.
 *
 * Ciclo de um evento:
 *   1. revelarEvento: no início da rodada, a carta é virada (fase 'evento').
 *      Sorteios (ex.: quem pegou influenza) acontecem aqui e ficam salvos.
 *   2. confirmarEvento: aplica o efeito imediato UMA vez (guardado por `resolvido`).
 *   3. Durante a rodada valem as restrições (chimarrão, provas, impressora, quadra).
 *   4. No fim da rodada, decisaoFimRodada/aplicarDecisaoFimRodada resolvem os efeitos
 *      que dependem dos projetos em andamento (reunião, fornecedor, equipamento, mesas).
 */
(function (global) {
  'use strict';
  const OG = (global.OG = global.OG || {});

  function E() { return OG.estado; }
  function F() { return OG.financas; }
  function fmt(v) { return OG.util.formatarDinheiro(v); }
  function exigir(c, m) { OG.estado.exigir(c, m); }

  function historico(estado, tipo, texto) {
    estado.historico.push({ rodada: estado.rodada, tipo: tipo, texto: texto });
  }

  // ---------------- Baralho ----------------

  // Eventos que travam a rodada inteira. Na rodada 1 eles seriam só punição (ainda não
  // há nada para terminar) e dois deles na mesma partida tornavam a missão quase impossível.
  const SEVEROS = ['ev_chimarrao', 'ev_provas'];

  /**
   * Monta os 4 eventos da partida (um por rodada), sem repetição. Regras de composição:
   *  - pelo menos 1 evento positivo (a partida não vira só punição);
   *  - no máximo 1 evento severo (Chimarrão ou Provas), e nunca na rodada 1.
   */
  function montarBaralho(estado) {
    const ids = OG.dados.eventos.map(function (ev) { return ev.id; });
    const embaralhados = OG.util.embaralhar(estado, ids);
    const n = OG.regras.EVENTOS_POR_PARTIDA;
    const tipo = function (id) { return OG.dados.eventosPorId[id].tipo; };

    const mao = [];
    let severos = 0;
    for (let i = 0; i < embaralhados.length && mao.length < n; i++) {
      const id = embaralhados[i];
      if (SEVEROS.indexOf(id) !== -1) {
        if (severos >= 1) continue;
        severos++;
      }
      mao.push(id);
    }

    if (!mao.some(function (id) { return tipo(id) === 'positivo'; })) {
      const positivo = embaralhados.find(function (id) { return tipo(id) === 'positivo' && mao.indexOf(id) === -1; });
      mao[OG.util.inteiroAleatorio(estado, n)] = positivo;
    }

    if (SEVEROS.indexOf(mao[0]) !== -1) {
      const j = 1 + OG.util.inteiroAleatorio(estado, n - 1);
      const tmp = mao[0];
      mao[0] = mao[j];
      mao[j] = tmp;
    }
    return mao;
  }

  // ---------------- Revelação ----------------

  function revelarEvento(estado) {
    const id = estado.baralho[estado.rodada - 1];
    const def = E().definicaoEvento(id);
    exigir(!!def, 'Evento desconhecido no baralho.');
    const ev = { id: id, rodada: estado.rodada, resolvido: false, alvo: null, escolha: null, escolhaFim: null };

    if (id === 'ev_influenza') {
      const livres = E().pessoasLivres(estado);
      if (livres.length) ev.alvo = livres[OG.util.inteiroAleatorio(estado, livres.length)].id;
    }

    estado.eventoAtual = ev;
    estado.fase = 'evento';
    historico(estado, 'evento', 'Rodada ' + estado.rodada + ' — evento: ' + def.nome + '.');
  }

  // ---------------- Opções da carta ----------------

  function opcaoDespesaObrigatoria(estado, despesaId) {
    const desp = OG.dados.despesas[despesaId];
    const caixa = F().caixa(estado);
    if (caixa >= desp.valor) {
      return [{ id: 'ok', rotulo: 'Pagar ' + fmt(desp.valor), habilitado: true }];
    }
    const falta = desp.valor - caixa;
    const desgaste = Math.ceil(falta / OG.regras.REAIS_POR_PONTO_DE_DESGASTE);
    return [{
      id: 'ok',
      rotulo: 'Pagar ' + fmt(caixa) + ' (faltam ' + fmt(falta) + ': −' + desgaste + ' Prestígio)',
      habilitado: true,
    }];
  }

  /** Botões da carta revelada. Sempre há pelo menos uma opção habilitada. */
  function opcoesEvento(estado) {
    const ev = estado.eventoAtual;
    if (!ev || estado.fase !== 'evento') return [];
    const def = E().definicaoEvento(ev.id);

    switch (ev.id) {
      case 'ev_impressoes': {
        const valor = OG.dados.despesas.impressoes.valor;
        const pode = F().caixa(estado) >= valor;
        return [
          { id: 'pagar', rotulo: 'Pagar ' + fmt(valor), habilitado: pode, motivo: pode ? null : 'Caixa insuficiente.' },
          { id: 'recusar', rotulo: 'Recusar (−5 Prestígio)', habilitado: true },
        ];
      }
      case 'ev_reuniao':
        return opcaoDespesaObrigatoria(estado, 'reuniao');
      case 'ev_transporte':
        return opcaoDespesaObrigatoria(estado, 'transporte');
      case 'ev_limpeza':
        return opcaoDespesaObrigatoria(estado, 'limpeza');
      default:
        return [{ id: 'ok', rotulo: def.tipo === 'positivo' ? 'Bah, que beleza!' : 'Entendi', habilitado: true }];
    }
  }

  // ---------------- Efeito imediato ----------------

  function confirmarEvento(estado, escolha) {
    exigir(estado.fase === 'evento', 'Não há evento esperando confirmação.');
    const ev = estado.eventoAtual;
    exigir(!!ev && !ev.resolvido && ev.rodada === estado.rodada, 'Este evento já foi resolvido.');
    const opcoes = opcoesEvento(estado);
    const escolhaFinal = escolha || (opcoes.length === 1 ? opcoes[0].id : null);
    const opcao = opcoes.find(function (o) { return o.id === escolhaFinal; });
    exigir(!!opcao, 'Escolha uma das opções do evento.');
    exigir(opcao.habilitado, opcao.motivo || 'Opção indisponível.');

    const def = E().definicaoEvento(ev.id);
    const R = OG.regras;

    switch (ev.id) {
      case 'ev_reuniao':
      case 'ev_transporte':
      case 'ev_limpeza': {
        const r = F().cobrarDespesaObrigatoria(estado, def.despesa);
        let texto = 'Despesa — ' + r.despesa.nome + ': pago ' + fmt(r.pago) + '.';
        if (r.falta > 0) texto += ' Faltou ' + fmt(r.falta) + ' no caixa: −' + r.desgaste + ' Prestígio.';
        historico(estado, 'dinheiro', texto);
        break;
      }
      case 'ev_impressoes': {
        if (escolhaFinal === 'pagar') {
          F().pagarDespesaOpcional(estado, 'impressoes');
          historico(estado, 'dinheiro', 'Despesa — Impressões de Última Hora: pago ' + fmt(OG.dados.despesas.impressoes.valor) + '.');
        } else {
          const perdeu = -F().lancar(estado, 'prestigio', -5, 'penalidade', 'Recusou: Impressões de Última Hora');
          historico(estado, 'evento', 'Impressões de Última Hora recusadas: −' + perdeu + ' Prestígio.');
        }
        break;
      }
      case 'ev_influenza': {
        if (ev.alvo) {
          estado.doentes.push({ pessoaId: ev.alvo, rodada: estado.rodada });
          historico(estado, 'evento', E().pessoa(ev.alvo).nome + ' pegou influenza e não trabalha nesta rodada.');
        } else {
          historico(estado, 'evento', 'Ninguém estava livre para pegar influenza. Ufa!');
        }
        break;
      }
      case 'ev_post': {
        const perdeu = -F().lancar(estado, 'prestigio', -5, 'penalidade', 'Divulgação Deu Ruim');
        historico(estado, 'evento', 'Divulgação deu ruim: −' + perdeu + ' Prestígio.');
        break;
      }
      case 'ev_patrocinio':
        F().lancar(estado, 'dinheiro', 150, 'receita', 'Patrocínio da Concolores');
        historico(estado, 'dinheiro', 'Patrocínio da Concolores: +' + fmt(150) + '.');
        break;
      case 'ev_viral':
        F().lancar(estado, 'prestigio', 10, 'bonus', 'Divulgação Viral');
        historico(estado, 'evento', 'Divulgação viral: +10 Prestígio.');
        break;
      case 'ev_professor':
        F().lancar(estado, 'dinheiro', 50, 'receita', 'Professor Resolveu Ajudar');
        F().lancar(estado, 'prestigio', 5, 'bonus', 'Professor Resolveu Ajudar');
        historico(estado, 'dinheiro', 'Professor resolveu ajudar: +' + fmt(50) + ' e +5 Prestígio.');
        break;
      case 'ev_patricio':
        estado.temporarios.push({ pessoaId: 'patricio', ateRodada: estado.rodada + R.DURACAO_TEMPORARIO - 1 });
        historico(estado, 'evento', 'Patrício chegou como temporário e fica até o fim da rodada ' +
          Math.min(estado.rodada + R.DURACAO_TEMPORARIO - 1, R.TOTAL_RODADAS) + '.');
        break;
      case 'ev_sindicato':
      case 'ev_material': {
        const origem = ev.id === 'ev_sindicato' ? 'Doação do Sindicato' : 'Material Encontrado';
        estado.descontosPendentes.push({ tipo: def.desconto.tipo, valor: def.desconto.valor, origem: origem });
        historico(estado, 'evento', origem + ': o próximo projeto iniciado ganha desconto.');
        break;
      }
      case 'ev_mutirao':
        estado.mutirao = { rodada: estado.rodada, usado: false };
        historico(estado, 'evento', 'Mutirão disponível nesta rodada: +1 de progresso em um card EM ANDAMENTO.');
        break;
      default:
        // Restrições de rodada (chimarrão, provas, impressora, quadra) e efeitos de fim
        // de rodada (fornecedor, equipamento, mesas) não mexem em nada agora.
        break;
    }

    ev.resolvido = true;
    ev.escolha = escolhaFinal;
    estado.fase = 'planejamento';
  }

  // ---------------- Fim de rodada ----------------

  function alvosComRisco(estado, risco) {
    return E().cartasNaColuna(estado, 'andamento').filter(function (c) {
      return E().projetoDaCarta(c).riscos.indexOf(risco) !== -1;
    });
  }

  function opcaoPagar(estado, despesaId, descricao) {
    const valor = OG.dados.despesas[despesaId].valor;
    const pode = F().caixa(estado) >= valor;
    return {
      id: 'pagar',
      rotulo: 'Pagar ' + fmt(valor),
      descricao: descricao,
      habilitado: pode,
      motivo: pode ? null : 'Caixa insuficiente (' + fmt(F().caixa(estado)) + ').',
    };
  }

  /**
   * Decisão pendente do evento para o fim da rodada, ou null se não há nada a decidir.
   * { eventoId, titulo, pergunta, opcoes: [{id, rotulo, descricao, habilitado, motivo}] }
   */
  function decisaoFimRodada(estado) {
    const ev = estado.eventoAtual;
    if (!ev || ev.rodada !== estado.rodada || !ev.resolvido) return null;
    const def = E().definicaoEvento(ev.id);
    const nome = function (c) { return E().projetoDaCarta(c).nome; };

    switch (ev.id) {
      case 'ev_reuniao': {
        const alvos = E().cartasNaColuna(estado, 'andamento');
        if (!alvos.length) return null;
        return {
          eventoId: ev.id,
          titulo: def.nome,
          pergunta: 'A reunião tomou o tempo da equipe. Qual projeto fica parado nesta rodada?',
          opcoes: alvos.map(function (c) {
            return { id: 'parar:' + c.id, rotulo: nome(c) + ' fica parado', descricao: 'Não ganha progresso nesta rodada.', habilitado: true };
          }),
        };
      }
      case 'ev_fornecedor': {
        const alvos = alvosComRisco(estado, 'fornecedor');
        if (!alvos.length) return null;
        return {
          eventoId: ev.id,
          titulo: def.nome,
          pergunta: 'O fornecedor não entregou. Pagar o extra ou deixar o projeto voltar?',
          opcoes: [opcaoPagar(estado, 'fornecedor', 'O material chega e tudo segue normal.')].concat(
            alvos.map(function (c) {
              return {
                id: 'voltar:' + c.id,
                rotulo: 'Não pagar: ' + nome(c) + ' volta para A FAZER',
                descricao: 'Perde o progresso e libera a equipe. O custo não é cobrado de novo quando recomeçar.',
                habilitado: true,
              };
            })
          ),
        };
      }
      case 'ev_equipamento': {
        const alvos = alvosComRisco(estado, 'equipamento');
        if (!alvos.length) return null;
        const nomes = OG.util.listaPt(alvos.map(nome));
        return {
          eventoId: ev.id,
          titulo: def.nome,
          pergunta: 'Sem o equipamento da escola, ' + nomes + ' não ' + (alvos.length > 1 ? 'andam' : 'anda') + '. Alugar?',
          opcoes: [
            opcaoPagar(estado, 'equipamento', 'Aluga o equipamento e tudo segue normal.'),
            { id: 'parar', rotulo: 'Não alugar: ' + nomes + (alvos.length > 1 ? ' ficam parados' : ' fica parado'), descricao: 'Sem progresso nesta rodada.', habilitado: true },
          ],
        };
      }
      case 'ev_mesas': {
        const alvos = alvosComRisco(estado, 'mesas');
        if (!alvos.length) return null;
        return {
          eventoId: ev.id,
          titulo: def.nome,
          pergunta: 'Faltaram mesas. Pagar o aluguel ou um projeto perde a rodada?',
          opcoes: [opcaoPagar(estado, 'mesas', 'As mesas chegam e tudo segue normal.')].concat(
            alvos.map(function (c) {
              return { id: 'parar:' + c.id, rotulo: 'Não pagar: ' + nome(c) + ' fica parado', descricao: 'Sem progresso nesta rodada.', habilitado: true };
            })
          ),
        };
      }
      default:
        return null;
    }
  }

  /** Aplica a escolha de fim de rodada. Retorna os cards parados e mensagens do resumo. */
  function aplicarDecisaoFimRodada(estado, escolha) {
    const dec = decisaoFimRodada(estado);
    exigir(!!dec, 'Não há decisão de evento pendente.');
    const opcao = dec.opcoes.find(function (o) { return o.id === escolha; });
    exigir(!!opcao, 'Escolha uma das opções.');
    exigir(opcao.habilitado, opcao.motivo || 'Opção indisponível.');

    const def = E().definicaoEvento(dec.eventoId);
    const paradas = [];
    const mensagens = [];

    if (escolha === 'pagar') {
      const desp = F().pagarDespesaOpcional(estado, def.despesa);
      mensagens.push(def.nome + ': pago ' + fmt(desp.valor) + '. Tudo seguiu normal.');
      historico(estado, 'dinheiro', 'Despesa — ' + desp.nome + ': pago ' + fmt(desp.valor) + '.');
    } else if (escolha === 'parar') {
      alvosComRisco(estado, def.risco).forEach(function (c) { paradas.push(c.id); });
    } else if (escolha.indexOf('parar:') === 0) {
      paradas.push(escolha.slice(6));
    } else if (escolha.indexOf('voltar:') === 0) {
      const c = E().carta(estado, escolha.slice(7));
      const proj = E().projetoDaCarta(c);
      c.coluna = 'afazer';
      c.ordem = estado.proximaOrdem++;
      c.progresso = 0;
      c.equipe = [];
      mensagens.push(def.nome + ': ' + proj.nome + ' voltou para A FAZER (o custo já pago continua valendo).');
      historico(estado, 'evento', def.nome + ': ' + proj.nome + ' voltou para A FAZER.');
    }

    estado.eventoAtual.escolhaFim = escolha;
    return { paradas: paradas, mensagens: mensagens, motivo: def.nome };
  }

  OG.eventos = {
    SEVEROS,
    montarBaralho,
    revelarEvento,
    opcoesEvento,
    confirmarEvento,
    decisaoFimRodada,
    aplicarDecisaoFimRodada,
  };
})(globalThis);

  <script>
/*
 * rodada.js — fim de rodada e passagem para a próxima.
 *
 * Ordem do fim de rodada:
 *   1. Resolve o efeito de fim de rodada do evento (pode pedir uma decisão ao jogador).
 *   2. Avança o progresso dos cards EM ANDAMENTO (exceto parados, congelados ou sem equipe).
 *   3. Cards que completaram o progresso vão para REVISÃO e liberam a equipe.
 *   4. Atualiza a disponibilidade: revisores e doentes voltam; temporários vencidos saem.
 *   5. Bônus da rodada não usados expiram (Mutirão).
 *   6. Mostra o resumo. Depois, AVANÇAR vira a próxima carta de evento (ou encerra a partida).
 * Retorno e pontos são creditados na hora da revisão (REVISÃO -> CONCLUÍDO), uma única vez.
 */
(function (global) {
  'use strict';
  const OG = (global.OG = global.OG || {});

  function E() { return OG.estado; }
  function exigir(c, m) { OG.estado.exigir(c, m); }

  function encerrarRodada(estado) {
    exigir(estado.fase === 'planejamento', OG.kanban.mensagemFase(estado));
    const dec = OG.eventos.decisaoFimRodada(estado);
    if (dec) {
      const habilitadas = dec.opcoes.filter(function (o) { return o.habilitado; });
      if (habilitadas.length > 1) {
        estado.fase = 'decisao';
        estado.pendente = { eventoId: dec.eventoId, rodada: estado.rodada };
        return;
      }
      // Só existe um caminho possível: aplica direto e conta no resumo.
      processarFimDeRodada(estado, habilitadas[0].id);
      return;
    }
    processarFimDeRodada(estado, null);
  }

  function resolverDecisao(estado, escolha) {
    exigir(estado.fase === 'decisao', 'Não há decisão pendente.');
    processarFimDeRodada(estado, escolha);
  }

  /** Volta para o quadro sem encerrar (nada foi alterado ao abrir a decisão). */

    estado.doentes.forEach(function (d) {

        linhas.push({ tipo: 'equipe', texto: E().pessoa(d.pessoaId).nome + ' se recuperou da influenza.' });

    estado.doentes = [];

    estado.temporarios.forEach(function (t) {

          texto: p.nome + ' foi embora e deixou ' + E().projetoDaCarta(c).nome + ' com a equipe incompleta. Complete a equipe para ele voltar a andar.',
        });

    estado.temporarios = ficam;

    if (estado.mutirao && !estado.mutirao.usado) {
      linhas.push({ tipo: 'evento', texto: 'O Mutirão da Gurizada não foi usado e acabou.' });

    if (!linhas.length) linhas.push({ tipo: 'info', texto: 'Nada estava em andamento nesta rodada.' });

      estado.historico.push({ rodada: estado.rodada, tipo: 'sistema', texto: 'Fim da partida.' });
      return;

    estado.rodada += 1;
    estado.cartasMovidasNaRodada = [];
    estado.resumo = null;
    OG.eventos.revelarEvento(estado);
