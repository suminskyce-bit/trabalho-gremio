/*
 * pontuacao.js — pontuação final e resumo financeiro.
 *
 * Pontuação = dinheiro restante ÷ 10 (arredondado para baixo)
 *           + prestígio + tradição + projetos concluídos × 5
 * A recompensa da missão já entra no dinheiro/prestígio/tradição quando é conquistada.
 */
(function (global) {
  'use strict';
  const OG = (global.OG = global.OG || {});

  function classificar(aproveitamento) {
    const lista = OG.regras.CLASSIFICACOES;
    for (let i = 0; i < lista.length; i++) {
      if (aproveitamento >= lista[i].minimo) return lista[i].nome;
    }
    return lista[lista.length - 1].nome;
  }

  const cacheMeta = {};

  /**
   * Meta da missão: a pontuação do melhor plano possível SEM eventos, com especialistas
   * em todas as vagas. Testa todas as combinações dos 6 cards que cabem nas vagas que
   * ainda dão tempo de concluir (2 vagas × 3 rodadas; projetos de 2 rodadas no máximo 1 por vaga).
   */
  function metaDaMissao(missaoId, caixaInicial) {
    const R = OG.regras;
    const caixa = caixaInicial === undefined ? R.CAIXA_INICIAL : caixaInicial;
    const chave = missaoId + ':' + caixa;
    if (cacheMeta[chave] !== undefined) return cacheMeta[chave];
    const m = OG.dados.missoesPorId[missaoId];
    const projs = m.projetos.map(function (id) { return OG.dados.projetosPorId[id]; });
    const capacidade = R.LIMITE_EM_ANDAMENTO * (R.TOTAL_RODADAS - 1);
    let melhor = 0;
    for (let mask = 0; mask < (1 << projs.length); mask++) {
      let tempo = 0;
      let longos = 0;
      let dinheiro = caixa;
      let prestigio = R.PRESTIGIO_INICIAL;
      let tradicao = R.TRADICAO_INICIAL;
      let n = 0;
      projs.forEach(function (p, i) {
        if (!(mask & (1 << i))) return;
        tempo += p.tempo;
        if (p.tempo > 1) longos++;
        dinheiro += p.retorno - p.custo + R.DESCONTO_ESPECIALISTA * p.trabalhadores;
        prestigio += p.prestigio;
        tradicao += p.tradicao;
        n++;
      });
      if (tempo > capacidade || longos > R.LIMITE_EM_ANDAMENTO) continue;
      if (n >= m.objetivo) {
        dinheiro += m.recompensa.dinheiro;
        prestigio += m.recompensa.prestigio;
        tradicao += m.recompensa.tradicao;

      const pontos = Math.floor(dinheiro / R.REAIS_POR_PONTO) + prestigio + tradicao + n * R.PONTOS_POR_PROJETO;

      .filter(function (l) { return l.tipo === 'inicial' && l.recurso === 'dinheiro'; })
      .reduce(function (s, l) { return s + l.valor; }, 0);

  function calcular(estado) {
    const R = OG.regras;
    const rec = OG.estado.recursos(estado);
    const concluidos = OG.estado.totalConcluidos(estado);
    const itens = [
      {
        id: 'dinheiro',
        rotulo: 'Dinheiro restante',
        conta: OG.util.formatarDinheiro(rec.dinheiro) + ' ÷ ' + R.REAIS_POR_PONTO,
        pontos: Math.floor(rec.dinheiro / R.REAIS_POR_PONTO),
      },
      { id: 'prestigio', rotulo: 'Prestígio', conta: rec.prestigio + ' × 1', pontos: rec.prestigio },
      { id: 'tradicao', rotulo: 'Tradição', conta: rec.tradicao + ' × 1', pontos: rec.tradicao },
      {
        id: 'projetos',
        rotulo: 'Projetos concluídos',
        conta: concluidos + ' × ' + R.PONTOS_POR_PROJETO,
        pontos: concluidos * R.PONTOS_POR_PROJETO,
      },
    ];
    const total = itens.reduce(function (s, i) { return s + i.pontos; }, 0);
    const missao = OG.estado.missao(estado);
    const caixaInicial = caixaInicialDaPartida(estado);
    const meta = metaDaMissao(estado.missaoId, caixaInicial);
    // Os pontos que o Grêmio já tem no começo (caixa + prestígio + tradição iniciais)
    // não são mérito: o aproveitamento mede só o que foi CONQUISTADO na partida.
    const pontosIniciais = Math.floor(caixaInicial / R.REAIS_POR_PONTO) + R.PRESTIGIO_INICIAL + R.TRADICAO_INICIAL;
    const conquistado = total - pontosIniciais;
    const metaConquista = meta - pontosIniciais;
    const aproveitamento = Math.floor((conquistado * 100) / metaConquista);
    return {
      itens: itens,
      total: total,
      meta: meta,
      pontosIniciais: pontosIniciais,
      conquistado: conquistado,
      metaConquista: metaConquista,
      aproveitamento: aproveitamento,
      classificacao: classificar(aproveitamento),
      concluidos: concluidos,
      missaoCumprida: !!estado.missaoCumprida,
      objetivo: missao.objetivo,
      recompensa: missao.recompensa,
    };
  }

  /** Números para a aula de educação financeira da tela final. */
  function resumoFinanceiro(estado) {
    const r = {
      caixaInicial: 0,
      investido: 0, // custos pagos para iniciar projetos
      receitaProjetos: 0, // retornos recebidos de projetos concluídos
      outrasReceitas: 0, // patrocínio, professor, recompensa da missão
      despesas: 0, // despesas inesperadas pagas
      investimentoParado: 0, // custo de projetos pagos que não foram concluídos
      lucroProjetosConcluidos: 0,
      caixaFinal: OG.estado.recursos(estado).dinheiro,
    };
    estado.livro.forEach(function (l) {
      if (l.recurso !== 'dinheiro') return;
      if (l.tipo === 'inicial') r.caixaInicial += l.valor;
      else if (l.tipo === 'custo') r.investido += -l.valor;
      else if (l.tipo === 'retorno') r.receitaProjetos += l.valor;
      else if (l.tipo === 'despesa') r.despesas += -l.valor;
      else if (l.tipo === 'receita' || l.tipo === 'recompensa') r.outrasReceitas += l.valor;
    });
    estado.cartas.forEach(function (c) {
      if (c.custoPago === null) return;
      if (c.coluna === 'concluido') {
        r.lucroProjetosConcluidos += OG.estado.projetoDaCarta(c).retorno - c.custoPago;
      } else {
        r.investimentoParado += c.custoPago;
      }
    });
    return r;
  }

    classificar,
    metaDaMissao,
    calcular,
    resumoFinanceiro,
  };

 *
 *   const estado = OG.motor.criarPartida('farroupilha', semente);
 *   const r = OG.motor.aplicar(estado, { tipo: 'PLANEJAR', cartaId: 'mateada' });

(function (global) {
  'use strict';
  const OG = (global.OG = global.OG || {});

  /**
   * opcoes.caixaApertado: true começa com regras.CAIXA_APERTADO em vez de CAIXA_INICIAL.
   */
  function criarPartida(missaoId, semente, opcoes) {
    const missao = OG.dados.missoesPorId[missaoId];
    if (!missao) throw new Error('Missão desconhecida: ' + missaoId);
    const R = OG.regras;

    const caixaInicial = apertado ? R.CAIXA_APERTADO : R.CAIXA_INICIAL;

      semente: s,
      rng: s,
      caixaApertado: apertado,
      missaoId: missaoId,

      fase: 'evento',
      cartas: missao.projetos.map(function (projetoId, i) {

          id: projetoId,
          projetoId: projetoId,
          coluna: 'backlog',

          progresso: 0,
          equipe: [],
          equipeFinal: [],

      baralho: [],
      eventoAtual: null,
      cartasMovidasNaRodada: [],
      revisoresDaRodada: [],
      doentes: [],
      temporarios: [],
      descontosPendentes: [],
      mutirao: null,
      missaoCumprida: false,
      pendente: null,
      resumo: null,
      livro: [
        { rodada: 1, recurso: 'dinheiro', valor: caixaInicial, tipo: 'inicial', descricao: 'Caixa inicial do Grêmio' },
        { rodada: 1, recurso: 'prestigio', valor: R.PRESTIGIO_INICIAL, tipo: 'inicial', descricao: 'Prestígio inicial' },
        { rodada: 1, recurso: 'tradicao', valor: R.TRADICAO_INICIAL, tipo: 'inicial', descricao: 'Tradição inicial' },
      ],
      historico: [
        { rodada: 1, tipo: 'sistema', texto: 'Partida iniciada: ' + missao.nome + '. Objetivo: concluir ' + missao.objetivo + ' projetos.' },

  function executar(estado, acao) {

      case 'PLANEJAR': return OG.kanban.planejar(estado, acao.cartaId);
      case 'DESPLANEJAR': return OG.kanban.desplanejar(estado, acao.cartaId);
      case 'INICIAR': return OG.kanban.iniciar(estado, acao.cartaId, acao.equipe);
      case 'REVISAR': return OG.kanban.revisar(estado, acao.cartaId, acao.revisorId);

      case 'USAR_MUTIRAO': return OG.kanban.usarMutirao(estado, acao.cartaId);

/*
 * persistencia.js — salvar/carregar a partida no navegador (localStorage).
 *
 * Nada que vem do armazenamento é confiável: antes de usar, o estado passa por
 * `validarEstado`, que confere estrutura, referências e as regras de integridade
 * (limite de 2 em andamento, ninguém em dois projetos, caixa >= 0, recompensa única...).
 * Se algo estiver errado, a partida salva é descartada.
 * Se o navegador bloquear o armazenamento, o jogo continua funcionando, só não salva.
 */
(function (global) {
  'use strict';
  const OG = (global.OG = global.OG || {});

  const CHAVE = 'operacao-gremio-mesquita:partida';
  const FASES = ['evento', 'planejamento', 'decisao', 'resumo', 'fim'];
  const RECURSOS = ['dinheiro', 'prestigio', 'tradicao'];

  function inteiro(v, min, max) {
    return typeof v === 'number' && Number.isInteger(v) && v >= min && v <= max;
  }

  function validarEstado(e) {
    const falhas = [];
    function checar(cond, msg) { if (!cond) falhas.push(msg); return cond; }

    try {
      if (!checar(e && typeof e === 'object', 'estado não é um objeto')) return { ok: false, motivo: falhas[0] };
      const R = OG.regras;
      const E = OG.estado;
      checar(e.versao === R.VERSAO_ESTADO, 'versão diferente');
      checar(inteiro(e.semente, 0, 4294967295) && inteiro(e.rng, 0, 4294967295), 'sorteio inválido');

        if (!checar(c && typeof c === 'object', 'card inválido')) return;

        checar(!!proj && missao.projetos.indexOf(c.projetoId) !== -1 && c.id === c.projetoId, 'card de outra missão: ' + c.id);

        checar(!vistos[c.id], 'card repetido: ' + c.id);

        checar(OG.kanban.ORDEM.indexOf(c.coluna) !== -1, 'coluna inválida');

        else checar(e.eventoAtual.resolvido === true, 'evento não resolvido');

  <script>
/*
 * ui.js — utilidades da interface: escape de HTML, avisos (toasts), janelas modais
 * acessíveis (foco preso, Esc, devolução do foco) e preservação do foco entre renderizações.
 */
(function (global) {
  'use strict';
  const OG = (global.OG = global.OG || {});

  const FOCAVEIS = 'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea, [tabindex]:not([tabindex="-1"])';

  function esc(valor) {
    return String(valor == null ? '' : valor).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function dinheiro(v) {
    return OG.util.formatarDinheiro(v);
  }

  // ---------------- Avisos ----------------

  function aviso(texto, tipo) {
    const raiz = document.getElementById('avisos');
    if (!raiz || !texto) return;
    const el = document.createElement('div');
    el.className = 'aviso aviso-' + (tipo || 'info');
    // O contêiner já é uma região "ao vivo"; erros ganham prioridade como alerta.
    if (tipo === 'erro') el.setAttribute('role', 'alert');
    const icone = tipo === 'erro' ? 'bloqueado' : tipo === 'bom' ? 'check' : 'info';
    el.innerHTML = OG.icones.icone(icone) + '<span>' + esc(texto) + '</span>';
    el.addEventListener('click', function () { el.remove(); });
    raiz.appendChild(el);
    while (raiz.children.length > 3) raiz.removeChild(raiz.firstChild);
    setTimeout(function () {
      el.classList.add('saindo');
      setTimeout(function () { el.remove(); }, 260);
    }, tipo === 'erro' ? 6500 : 4200);
  }

  // ---------------- Foco ----------------

  function chaveDoFoco() {
    const el = document.activeElement;
    return el && el.dataset ? el.dataset.foco || null : null;
  }

  function restaurarFoco(raiz, chave) {
    if (!chave) return false;
    const alvo = raiz.querySelector('[data-foco="' + chave.replace(/"/g, '') + '"]');
    if (alvo && typeof alvo.focus === 'function') {
      alvo.focus({ preventScroll: true });
      return true;
    }
    return false;
  }

  // ---------------- Modal ----------------

  const modalAtual = { chave: null, dispensavel: false, aoDispensar: null, opener: null };

  function raizModal() {
    return document.getElementById('modal-raiz');
  }

  /**
   * Mostra (ou atualiza) a janela modal.
   * desc = { chave, html, classe, dispensavel, aoDispensar } ou null para fechar.
   * Mesma chave = atualiza o conteúdo sem perder o foco.
   * chaveOpener: data-foco do elemento que abriu a janela (lido ANTES de a tela ser
   * redesenhada), para devolver o foco a ele quando a janela fechar.
   */
  function mostrarModal(desc, chaveOpener) {
    const raiz = raizModal();
    if (!raiz) return;
    if (!desc) {
      fecharModal();
      return;
    }
    const app = document.getElementById('app');
    if (modalAtual.chave === desc.chave) {
      const caixa = raiz.querySelector('.modal');
      if (caixa) {
        const foco = chaveDoFoco();
        const rolagem = caixa.querySelector('.modal-corpo') ? caixa.querySelector('.modal-corpo').scrollTop : 0;
        caixa.className = 'modal ' + (desc.classe || '');
        caixa.innerHTML = desc.html;
        const corpo = caixa.querySelector('.modal-corpo');
        if (corpo) corpo.scrollTop = rolagem;
        if (!restaurarFoco(caixa, foco) && !caixa.contains(document.activeElement)) caixa.focus();
        modalAtual.dispensavel = !!desc.dispensavel;
        modalAtual.aoDispensar = desc.aoDispensar || null;
        return;
      }
    }
    if (!modalAtual.chave) modalAtual.opener = chaveOpener !== undefined ? chaveOpener : chaveDoFoco();
    raiz.innerHTML =
      '<div class="modal-fundo" data-fundo-modal>' +
      '<div class="modal ' + (desc.classe || '') + '" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" tabindex="-1">' +
      desc.html +
      '</div></div>';
    modalAtual.chave = desc.chave;
    modalAtual.dispensavel = !!desc.dispensavel;
    modalAtual.aoDispensar = desc.aoDispensar || null;
    document.body.classList.add('com-modal');
    if (app) {
      app.setAttribute('inert', '');
      app.setAttribute('aria-hidden', 'true');
    }
    const caixa = raiz.querySelector('.modal');
    const inicial = caixa.querySelector('[data-foco-inicial]') || caixa.querySelector(FOCAVEIS) || caixa;
    inicial.focus({ preventScroll: true });
  }

  function fecharModal() {
    const raiz = raizModal();
    if (!modalAtual.chave) return;
    raiz.innerHTML = '';
    modalAtual.chave = null;
    modalAtual.aoDispensar = null;
    document.body.classList.remove('com-modal');
    const app = document.getElementById('app');
    if (app) {
      app.removeAttribute('inert');
      app.removeAttribute('aria-hidden');
      const chave = modalAtual.opener;
      modalAtual.opener = null;
      if (!restaurarFoco(app, chave)) {
        const principal = app.querySelector('[data-foco-principal]');
        if (principal) principal.focus({ preventScroll: true });
      }
    }
  }

  function modalAberto() {
    return modalAtual.chave;
  }

  /** Esc fecha o que é dispensável; Tab fica preso dentro da janela. */
  function tratarTecladoModal(evento) {
    if (!modalAtual.chave) return false;
    const caixa = raizModal().querySelector('.modal');
    if (!caixa) return false;
    if (evento.key === 'Escape') {
      if (modalAtual.dispensavel && modalAtual.aoDispensar) {
        evento.preventDefault();
        modalAtual.aoDispensar();
      }
      return true;
    }
    if (evento.key === 'Tab') {
      const itens = Array.prototype.filter.call(caixa.querySelectorAll(FOCAVEIS), function (el) {
        return el.offsetParent !== null || el === document.activeElement;
      });
      if (!itens.length) {
        evento.preventDefault();
        caixa.focus();
        return true;
      }
      const primeiro = itens[0];
      const ultimo = itens[itens.length - 1];
      if (evento.shiftKey && (document.activeElement === primeiro || !caixa.contains(document.activeElement))) {
        evento.preventDefault();
        ultimo.focus();
      } else if (!evento.shiftKey && (document.activeElement === ultimo || !caixa.contains(document.activeElement))) {
        evento.preventDefault();
        primeiro.focus();
      }
      return true;
    }
    return false;
  }

  function cliqueNoFundo(evento) {
    if (!modalAtual.chave || !modalAtual.dispensavel) return false;
    if (evento.target && evento.target.hasAttribute && evento.target.hasAttribute('data-fundo-modal')) {
      if (modalAtual.aoDispensar) modalAtual.aoDispensar();
      return true;
    }
    return false;
  }

  OG.ui = {
    esc,
    dinheiro,
    aviso,
    chaveDoFoco,
    restaurarFoco,
    mostrarModal,
    fecharModal,
    modalAberto,
    tratarTecladoModal,
    cliqueNoFundo,
  };
})(globalThis);

</script>
  <script>
/*
 * componentes.js — pedaços da interface gerados a partir do estado do jogo.
 * Nada aqui decide regra: botões e avisos consultam o núcleo (OG.kanban, OG.estado...).
 */
(function (global) {
  'use strict';
  const OG = (global.OG = global.OG || {});

  function esc(v) { return OG.ui.esc(v); }
  function ic(nome, classe, rotulo) { return OG.icones.icone(nome, classe, rotulo); }
  function din(v) { return OG.util.formatarDinheiro(v); }
  function E() { return OG.estado; }

  const NOMES_COLUNA = {
    backlog: 'Backlog',
    afazer: 'A fazer',
    andamento: 'Em andamento',
    revisao: 'Revisão',
    concluido: 'Concluído',
  };

  const COLUNA_VAZIA = {
    backlog: 'Todos os projetos da missão já saíram daqui.',
    afazer: 'Planeje: traga projetos do Backlog para cá.',
    andamento: 'Nenhum projeto rodando. Inicie até 2 a partir de A fazer.',
    revisao: 'Projetos que terminam a execução chegam aqui no fim da rodada.',
    concluido: 'Nada concluído ainda. Retorno e pontos entram aqui.',
  };

  const TIPOS_EVENTO = {
    negativo: { rotulo: 'Imprevisto', icone: 'negativo' },
    positivo: { rotulo: 'Boa notícia', icone: 'positivo' },
    despesa: { rotulo: 'Despesa', icone: 'despesa' },
  };

  const QUANDO_EVENTO = {
    agora: 'Vale agora, ao confirmar.',
    rodada: 'Vale durante toda esta rodada.',
    fim: 'É resolvido quando você encerrar a rodada.',
  };

  function plural(n, s, p) { return OG.util.plural(n, s, p); }

  // ---------------- Pessoas ----------------

  function iniciais(nome) {
    const partes = nome.split(/\s+/);
    if (partes.length === 1) return nome.length <= 3 ? nome.toUpperCase() : nome[0].toUpperCase();
    return partes.map(function (s) { return s[0]; }).join('').slice(0, 2).toUpperCase();
  }

  function avatar(p, classe) {
    if (p.foto) {
      return '<img class="avatar ' + (classe || '') + '" src="' + esc(p.foto) + '" alt="" width="40" height="40" loading="lazy">';
    }
    const e = p.especialidade || {};
    const cat = e.coringa ? 'coringa' : (e.categorias || [])[0] || '';
    return '<span class="avatar avatar-iniciais ' + (classe || '') + '" data-cat="' + cat + '" aria-hidden="true">' + esc(iniciais(p.nome)) + '</span>';
  }

  const ROTULO_STATUS = { livre: 'Livre', ocupado: 'Em projeto', revisando: 'Revisou', doente: 'Doente', ausente: 'Fora' };

  function especialidadeTexto(p) {
    return p.especialidade.coringa ? 'Coringa: especialista em tudo' : 'Especialista: ' + p.especialidade.rotulo;
  }

  function pessoaItem(estado, p) {
    const st = E().statusPessoa(estado, p.id);
    const linhas = [];
    if (p.papel === 'coordenador') linhas.push(p.cargo);
    linhas.push(p.papel === 'coordenador' ? especialidadeTexto(p) : p.especialidade.rotulo);
    if (st.codigo === 'ocupado' || st.codigo === 'revisando' || st.codigo === 'doente') linhas.push(st.texto);
    if (p.somentePorEvento) {
      const t = E().registroTemporario(estado, p.id);
      linhas.push(t ? 'Temporário até o fim da rodada ' + Math.min(t.ateRodada, OG.regras.TOTAL_RODADAS) : 'Aparece com o evento “Patrício Ajudou”');
    }
    return '<li class="pessoa ' + (st.codigo === 'ausente' ? 'ausente' : '') + '">' +
      avatar(p) +
      '<div class="pessoa-texto"><span class="pessoa-nome">' + esc(p.nome) + '</span>' +
      linhas.map(function (l) { return '<span class="pessoa-papel">' + esc(l) + '</span>'; }).join('') +
      '</div><span class="status status-' + st.codigo + '">' + ROTULO_STATUS[st.codigo] + '</span></li>';
  }

  function painelEquipe(estado) {
    const coords = OG.dados.coordenadores.map(function (p) { return E().pessoa(p.id); });
    const vols = OG.dados.voluntarios.map(function (p) { return E().pessoa(p.id); });
    const todas = coords.concat(vols).filter(function (p) { return E().presente(estado, p.id); });
    const livres = todas.filter(function (p) { return E().statusPessoa(estado, p.id).codigo === 'livre'; }).length;
    return '<section class="painel painel-equipe" aria-labelledby="titulo-equipe">' +
      '<button class="botao botao-secundario botao-pequeno fechar-lateral" data-acao="fechar-lateral">' + ic('fechar') + ' Fechar</button>' +
      '<h2 id="titulo-equipe">' + ic('pessoas') + ' Equipe</h2>' +
      '<p class="equipe-resumo">' + livres + ' de ' + todas.length + ' pessoas livres agora. Especialista na categoria do projeto dá R$ 10,00 de desconto.</p>' +
      '<h3>Coordenação (só eles revisam)</h3><ul class="lista-pessoas">' + coords.map(function (p) { return pessoaItem(estado, p); }).join('') + '</ul>' +
      '<h3>Voluntários</h3><ul class="lista-pessoas lista-voluntarios">' + vols.map(function (p) { return pessoaItem(estado, p); }).join('') + '</ul>' +
      '</section>';
  }

  // ---------------- Cards ----------------

  function botao(acao, rotulo, op) {
    op = op || {};
    const classes = 'botao botao-pequeno ' + (op.primario ? 'botao-primario' : 'botao-secundario');
    const motivo = op.motivo ? ' aria-disabled="true" data-motivo="' + esc(op.motivo) + '" title="' + esc(op.motivo) + '"' : '';
    return '<button type="button" class="' + classes + '" data-acao="' + acao + '"' +
      (op.carta ? ' data-carta="' + esc(op.carta) + '"' : '') +
      ' data-foco="' + acao + ':' + esc(op.carta || '') + '"' + motivo + '>' +
      (op.icone ? ic(op.icone) : '') + '<span>' + esc(rotulo) + '</span></button>';
  }

  function selo(tipo, icone, texto, dica) {
    return '<span class="selo selo-' + tipo + '"' + (dica ? ' title="' + esc(dica) + '"' : '') + '>' + ic(icone) + esc(texto) + '</span>';
  }

  function selosDaCarta(estado, c) {
    const p = E().projetoDaCarta(c);
    const s = [];
    const planejando = estado.fase === 'planejamento';
    const bloqueio = c.coluna !== 'concluido' ? E().bloqueioDaCarta(estado, c) : null;
    if (bloqueio) s.push(selo('ruim', 'parado', 'Parado nesta rodada', bloqueio));
    if ((c.coluna === 'backlog' || c.coluna === 'afazer') && !E().terminaATempo(estado, c) && estado.fase !== 'fim') {
      s.push(selo('alerta', 'alerta', 'Não termina a tempo', 'Começando agora, não dá tempo de executar e revisar antes do fim da partida: o custo vira dinheiro parado.'));
    }
    if (c.coluna === 'afazer' && c.custoPago !== null) {
      s.push(selo('bom', 'check', 'Já pago', 'Voltou por causa de um evento: recomeça sem cobrar o custo de novo.'));
    }
    if (c.coluna === 'andamento' && c.equipe.length < p.trabalhadores) {
      const falta = p.trabalhadores - c.equipe.length;
      s.push(selo('ruim', 'reforco', 'Falta ' + falta + ' ' + plural(falta, 'pessoa', 'pessoas'), 'Sem a equipe completa o projeto não avança no fim da rodada.'));
    }
    const ev = planejando && estado.eventoAtual ? E().definicaoEvento(estado.eventoAtual.id) : null;
    if (ev && ev.quando === 'fim' && c.coluna !== 'revisao' && c.coluna !== 'concluido') {
      if (ev.risco && p.riscos.indexOf(ev.risco) !== -1) {
        s.push(selo('alerta', ev.risco, 'Risco no fim da rodada', ev.nome + ': ' + ev.efeito));
      } else if (ev.id === 'ev_reuniao' && c.coluna === 'andamento') {
        s.push(selo('alerta', 'alerta', 'Pode parar na reunião', ev.efeito));
      }
    }
    if (c.coluna === 'revisao' && planejando && estado.rodada === OG.regras.TOTAL_RODADAS) {
      s.push(selo('alerta', 'alerta', 'Última chance de revisar', 'Na última rodada, projeto que não for revisado não conta.'));
    }
    return s.length ? '<div class="card-selos">' + s.join('') + '</div>' : '';
  }

  /** Botões de ação do card. `soBotoes` devolve só os botões, sem o contêiner. */
  function acoesDaCarta(estado, c, soBotoes) {
    if (estado.fase !== 'planejamento') return '';
    const p = E().projetoDaCarta(c);
    const b = [];
    if (c.coluna === 'backlog') {
      const av = OG.kanban.avaliarMovimento(estado, c.id, 'afazer');
      b.push(botao('planejar', 'Planejar', { carta: c.id, motivo: av.ok ? null : av.motivo, icone: 'direita' }));
    } else if (c.coluna === 'afazer') {
      const av = OG.kanban.avaliarMovimento(estado, c.id, 'andamento');
      b.push(botao('abrir-iniciar', c.custoPago !== null ? 'Retomar' : 'Iniciar', { carta: c.id, motivo: av.ok ? null : av.motivo, icone: 'jogar', primario: true }));
    } else if (c.coluna === 'andamento') {
      if (c.equipe.length < p.trabalhadores) {
        const livres = OG.kanban.candidatos(estado, c).length;
        b.push(botao('abrir-completar', 'Completar equipe', { carta: c.id, primario: true, icone: 'reforco', motivo: livres ? null : 'Ninguém livre que possa ficar até o fim deste projeto.' }));
      }
      if (OG.kanban.mutiraoDisponivel(estado)) {
        b.push(botao('mutirao', 'Usar Mutirão', { carta: c.id, icone: 'mutirao', primario: true, motivo: E().bloqueioDaCarta(estado, c) }));
      }
    } else if (c.coluna === 'revisao') {
      const av = OG.kanban.avaliarMovimento(estado, c.id, 'concluido');
      b.push(botao('abrir-revisar', 'Revisar', { carta: c.id, motivo: av.ok ? null : av.motivo, icone: 'revisar', primario: true }));
    }
    if (soBotoes) return b.join('');
    return b.length ? '<div class="card-acoes">' + b.join('') + '</div>' : '';
  }

  function progressoDaCarta(estado, c) {
    const p = E().projetoDaCarta(c);
    if (c.coluna === 'backlog' || c.coluna === 'afazer') return '';
    let texto = '';
    if (c.coluna === 'andamento') {
      const restante = p.tempo - c.progresso;
      texto = 'Execução: ' + c.progresso + ' de ' + p.tempo + ' ' + plural(p.tempo, 'rodada', 'rodadas');
      if (estado.fase === 'planejamento' && !E().bloqueioDaCarta(estado, c) && c.equipe.length >= p.trabalhadores) {
        texto += restante === 1 ? '. Termina no fim desta rodada.' : '. Falta ' + restante + ' rodadas.';
      }
    } else if (c.coluna === 'revisao') {
      texto = 'Execução completa. Falta a revisão.';
    } else {
      const rev = E().pessoa(c.revisor);
      texto = 'Revisado por ' + (rev ? rev.nome : '?') + ' na rodada ' + c.concluidoNaRodada + '.';
    }
    let seg = '';
    for (let i = 0; i < p.tempo; i++) seg += '<span class="' + (i < c.progresso ? 'feito' : '') + '"></span>';
    return '<div class="card-progresso"><div class="segmentos" aria-hidden="true">' + seg + '</div><span>' + esc(texto) + '</span></div>';
  }

  function equipeDaCarta(c) {
    const ids = c.coluna === 'andamento' ? c.equipe : [];
    if (!ids.length) return '';
    const pessoas = ids.map(function (id) { return E().pessoa(id); });
    return '<div class="card-equipe">' + pessoas.map(function (p) { return avatar(p); }).join('') +
      '<span>' + esc(OG.util.listaPt(pessoas.map(function (p) { return p.nome; }))) + '</span></div>';
  }

  function numero(classe, rotulo, icone, valor, zero) {
    return '<div class="' + classe + (zero ? ' zero' : '') + '"><dt>' + (icone ? ic(icone, '', rotulo) : esc(rotulo)) + '</dt><dd>' + valor + '</dd></div>';
  }

  function card(estado, c) {
    const p = E().projetoDaCarta(c);
    const cat = OG.dados.categorias[p.categoria];
    const arrastavel = estado.fase === 'planejamento' && (c.coluna === 'backlog' || c.coluna === 'afazer' || c.coluna === 'revisao');
    const congelado = c.coluna !== 'concluido' && !!E().bloqueioDaCarta(estado, c);
    const classes = ['card', 'card-cat-' + p.categoria];
    if (c.coluna === 'concluido') classes.push('concluido');
    if (congelado) classes.push('congelado');
    const riscos = p.riscos.map(function (r) {
      const def = OG.dados.riscos[r];
      return '<span title="' + esc(def.nome + ' (evento: ' + def.evento + ')') + '">' + ic(r, '', def.nome) + '</span>';
    }).join('');
    const custoTexto = c.custoPago !== null ? din(c.custoPago) : din(p.custo);
    return '<article class="' + classes.join(' ') + '" data-carta="' + esc(c.id) + '"' +
      (arrastavel ? ' draggable="true"' : '') + ' aria-labelledby="titulo-' + esc(c.id) + '">' +
      '<div class="card-topo"><span class="card-categoria">' + ic(cat.icone) + esc(cat.nome) + '</span>' +
      (riscos ? '<span class="card-riscos">' + riscos + '</span>' : '') + '</div>' +
      '<h3 class="card-titulo" id="titulo-' + esc(c.id) + '"><button type="button" data-acao="detalhes" data-carta="' + esc(c.id) + '" data-foco="detalhes:' + esc(c.id) + '">' + esc(p.nome) + '</button></h3>' +
      '<dl class="card-dinheiro">' +
      '<div><dt>' + (c.custoPago !== null ? 'Custo pago' : 'Custo') + '</dt><dd>' + custoTexto + '</dd></div>' +
      '<div><dt>Retorno</dt><dd>' + din(p.retorno) + '</dd></div>' +
      '</dl>' +
      '<dl class="card-numeros">' +
      numero('', 'Tempo', 'tempo', p.tempo + ' ' + plural(p.tempo, 'rodada', 'rodadas')) +
      numero('', 'Pessoas', 'pessoas', p.trabalhadores + ' ' + plural(p.trabalhadores, 'pessoa', 'pessoas')) +
      '</dl><dl class="card-numeros">' +
      numero('prestigio', 'Prestígio', 'prestigio', '+' + p.prestigio, !p.prestigio) +
      numero('tradicao', 'Tradição', 'tradicao', '+' + p.tradicao, !p.tradicao) +
      '</dl>' +
      progressoDaCarta(estado, c) +
      equipeDaCarta(c) +
      selosDaCarta(estado, c) +
      acoesDaCarta(estado, c) +
      '</article>';
  }

  function coluna(estado, def) {
    const cartas = E().cartasNaColuna(estado, def.id);
    const limite = def.limite;
    const cheia = limite && cartas.length >= limite;
    const contagem = limite ? cartas.length + '/' + limite : String(cartas.length);
    const rotuloContagem = limite
      ? cartas.length + ' de ' + limite + ' vagas ocupadas'
      : cartas.length + ' ' + plural(cartas.length, 'card', 'cards');
    return '<section class="coluna coluna-' + def.id + '" data-coluna="' + def.id + '" id="coluna-' + def.id + '" aria-labelledby="col-' + def.id + '">' +
      '<header class="coluna-cabeca"><h2 id="col-' + def.id + '">' + NOMES_COLUNA[def.id] + '</h2>' +
      '<span class="coluna-contagem' + (cheia ? ' cheia' : '') + '" aria-label="' + rotuloContagem + '">' + contagem + '</span></header>' +
      '<p class="coluna-dica-soltar" data-dica-soltar></p>' +
      '<ol class="coluna-cards">' +
      (cartas.length
        ? cartas.map(function (c) { return '<li>' + card(estado, c) + '</li>'; }).join('')
        : '<li class="coluna-vazia">' + COLUNA_VAZIA[def.id] + '</li>') +
      '</ol></section>';
  }

  // ---------------- HUD ----------------

  function chipsDoTopo(estado) {
    const chips = [];
    const ev = estado.eventoAtual ? E().definicaoEvento(estado.eventoAtual.id) : null;
    if (ev && estado.fase !== 'fim') {
      chips.push('<button type="button" class="chip chip-evento ' + ev.tipo + '" data-acao="ver-evento" data-foco="ver-evento">' +
        ic(TIPOS_EVENTO[ev.tipo].icone) + 'Evento: ' + esc(ev.nome) + '</button>');
    }
    estado.descontosPendentes.forEach(function (d) {
      const texto = d.tipo === 'percentual' ? d.valor + '% de desconto' : din(d.valor) + ' de desconto';
      chips.push('<span class="chip chip-bonus" title="Vale para o próximo projeto iniciado">' + ic('positivo') + esc(texto) + ' no próximo projeto</span>');
    });
    return chips.join('');
  }

  function hud(estado) {
    const R = OG.regras;
    const m = E().missao(estado);
    const r = E().recursos(estado);
    const concluidos = E().totalConcluidos(estado);
    let pips = '';
    for (let i = 1; i <= R.TOTAL_RODADAS; i++) {
      const terminou = i < estado.rodada || (i === estado.rodada && (estado.fase === 'resumo' || estado.fase === 'fim'));
      pips += '<span class="pip' + (terminou ? ' feita' : i === estado.rodada ? ' atual' : '') + '"></span>';
    }
    const pct = Math.min(100, Math.round((concluidos / m.objetivo) * 100));
    const podeEncerrar = estado.fase === 'planejamento';
    let encerrar;
    if (estado.fase === 'resumo') {
      const ultima = estado.rodada >= R.TOTAL_RODADAS;
      encerrar = '<button type="button" class="botao botao-primario so-largo" data-acao="avancar" data-foco="encerrar">' +
        ic(ultima ? 'premio' : 'jogar') + '<span>' + (ultima ? 'Ver resultado final' : 'Começar a rodada ' + (estado.rodada + 1)) + '</span></button>';
    } else {
      encerrar = '<button type="button" class="botao botao-primario so-largo" data-acao="encerrar-rodada" data-foco="encerrar"' +
        (podeEncerrar ? '' : ' aria-disabled="true" data-motivo="' + esc(OG.kanban.mensagemFase(estado)) + '"') + '>' +
        ic('rodada') + '<span>Encerrar rodada ' + estado.rodada + '</span></button>';
    }
    return '<header class="hud">' +
      '<div class="hud-marca"><span class="marca" aria-hidden="true"><span class="marca-escola">Escola</span><span class="marca-mesquita">Mesquita</span></span>' +
      '<div><div class="hud-titulo">' + esc(m.nome) + '</div>' +
      (estado.caixaApertado ? '<div class="hud-modo">Modo caixa apertado</div>' : '') + '</div></div>' +
      '<div class="hud-rodada" role="group" aria-label="Rodada ' + estado.rodada + ' de ' + R.TOTAL_RODADAS + '"><span class="numero" aria-hidden="true">' + estado.rodada + '<small>/' + R.TOTAL_RODADAS + '</small></span>' +
      '<span aria-hidden="true"><span class="rotulo">Rodada</span><span class="pips">' + pips + '</span></span></div>' +
      '<dl class="hud-recursos">' +
      '<div class="recurso recurso-caixa" data-recurso="dinheiro"><dt>' + ic('dinheiro') + '<span>Caixa</span></dt><dd>' + din(r.dinheiro) + '</dd></div>' +
      '<div class="recurso recurso-prestigio" data-recurso="prestigio"><dt>' + ic('prestigio') + '<span>Prestígio</span></dt><dd>' + r.prestigio + '</dd></div>' +
      '<div class="recurso recurso-tradicao" data-recurso="tradicao"><dt>' + ic('tradicao') + '<span>Tradição</span></dt><dd>' + r.tradicao + '</dd></div>' +
      '</dl>' +
      '<div class="hud-acoes">' + encerrar +
      '<button type="button" class="botao botao-fantasma botao-icone botao-equipe-lateral" data-acao="abrir-lateral" data-foco="abrir-lateral" aria-label="Abrir equipe e diário">' + ic('pessoas') + '</button>' +
      '<button type="button" class="botao botao-fantasma botao-icone" data-acao="menu" data-foco="menu" aria-label="Menu do jogo">' + ic('menu') + '</button>' +
      '</div>' +
      '<div class="hud-missao' + (estado.missaoCumprida ? ' cumprida' : '') + '">' + ic('missao') +
      '<span>' + (estado.missaoCumprida
        ? '<strong>Missão cumprida!</strong> ' + concluidos + ' projetos concluídos.'
        : 'Missão: <strong>' + concluidos + ' de ' + m.objetivo + '</strong> projetos concluídos') + '</span>' +
      '<span class="barra-missao" aria-hidden="true"><span style="width:' + pct + '%"></span></span></div>' +
      '<div class="hud-evento">' + chipsDoTopo(estado) + '</div>' +
      '</header>';
  }

  /** Lembrete da regra do evento que vale nesta rodada. */
  function faixaEvento(estado) {
    if (estado.fase !== 'planejamento' || !estado.eventoAtual) return '';
    const ev = E().definicaoEvento(estado.eventoAtual.id);
    let situacao = '';
    const nomeCarta = function (id) { return E().projetoDaCarta(E().carta(estado, id)).nome; };
    switch (ev.id) {
      case 'ev_chimarrao': {
        const ini = OG.kanban.iniciadosNaRodada(estado);
        situacao = ini.length ? 'Já começou: ' + nomeCarta(ini[0].id) + '. Mais nenhum início nesta rodada.' : 'Nenhum projeto começou ainda nesta rodada.';
        break;
      }
      case 'ev_provas': {
        const m = estado.cartasMovidasNaRodada;
        situacao = m.length ? 'Card movimentado: ' + nomeCarta(m[0]) + '. Só ele pode continuar andando.' : 'Nenhum card movimentado ainda. Escolha bem.';
        break;
      }
      case 'ev_impressora':
      case 'ev_quadra': {
        const afetados = estado.cartas.filter(function (c) { return c.coluna !== 'concluido' && E().bloqueioDaCarta(estado, c); });
        situacao = afetados.length ? 'Parados: ' + OG.util.listaPt(afetados.map(function (c) { return E().projetoDaCarta(c).nome; })) + '.' : 'Nenhum projeto seu é afetado.';
        break;
      }
      case 'ev_mutirao':
        situacao = OG.kanban.mutiraoDisponivel(estado) ? 'Use o botão “Usar Mutirão” em um card de Em andamento.' : 'Mutirão já usado.';
        break;
      case 'ev_influenza': {
        const alvo = estado.eventoAtual.alvo;
        situacao = alvo ? E().pessoa(alvo).nome + ' está com influenza e volta na próxima rodada.' : 'Ninguém ficou doente.';
        break;
      }
      case 'ev_patricio':
        situacao = 'Patrício está na equipe como temporário.';
        break;
      default:
        if (ev.quando === 'fim') {
          const emRisco = E().cartasNaColuna(estado, 'andamento').filter(function (c) {
            return !ev.risco || E().projetoDaCarta(c).riscos.indexOf(ev.risco) !== -1;
          });
          situacao = emRisco.length
            ? 'Em risco agora: ' + OG.util.listaPt(emRisco.map(function (c) { return E().projetoDaCarta(c).nome; })) + '.'
            : 'Nenhum projeto em andamento é afetado agora.';
        } else {
          return '';
        }
    }
    return '<div class="faixa-evento ' + ev.tipo + '" role="note">' + ic(TIPOS_EVENTO[ev.tipo].icone) +
      '<div><strong>' + esc(ev.nome) + ':</strong> ' + esc(ev.efeito) + '<span class="estado-regra">' + esc(situacao) + '</span></div></div>';
  }

  // ---------------- Diário: histórico, finanças, regras ----------------

  function historico(estado) {
    const porRodada = {};
    estado.historico.forEach(function (h) { (porRodada[h.rodada] = porRodada[h.rodada] || []).push(h); });
    const rodadas = Object.keys(porRodada).map(Number).sort(function (a, b) { return b - a; });
    if (!rodadas.length) return '<p class="nota">Ainda não aconteceu nada.</p>';
    return rodadas.map(function (r) {
      return '<div class="historico-rodada"><h4>Rodada ' + r + '</h4><ul>' +
        porRodada[r].slice().reverse().map(function (h) {
          return '<li class="' + esc(h.tipo) + '">' + esc(h.texto) + '</li>';
        }).join('') + '</ul></div>';
    }).join('');
  }

  function financas(estado) {
    const f = OG.pontuacao.resumoFinanceiro(estado);
    let saldo = 0;
    const linhas = estado.livro.filter(function (l) { return l.recurso === 'dinheiro'; }).map(function (l) {
      saldo += l.valor;
      return { l: l, saldo: saldo };
    }).reverse();
    return '<dl class="resumo-financeiro">' +
      '<dt>Caixa inicial</dt><dd>' + din(f.caixaInicial) + '</dd>' +
      '<dt>Investido em projetos</dt><dd class="menos">' + din(-f.investido) + '</dd>' +
      '<dt>Retorno de projetos</dt><dd class="mais">' + OG.util.formatarDinheiroComSinal(f.receitaProjetos) + '</dd>' +
      '<dt>Patrocínios e recompensas</dt><dd class="mais">' + OG.util.formatarDinheiroComSinal(f.outrasReceitas) + '</dd>' +
      '<dt>Despesas inesperadas</dt><dd class="menos">' + din(-f.despesas) + '</dd>' +
      '<dt><strong>Caixa agora</strong></dt><dd>' + din(f.caixaFinal) + '</dd>' +
      '</dl>' +
      '<table class="tabela-financas"><caption class="visualmente-oculto">Lançamentos do caixa, do mais recente ao mais antigo</caption>' +
      '<thead><tr><th scope="col">Rod.</th><th scope="col">O quê</th><th scope="col" style="text-align:right">Valor</th><th scope="col" style="text-align:right">Saldo</th></tr></thead><tbody>' +
      linhas.map(function (x) {
        return '<tr><td>' + x.l.rodada + '</td><td>' + esc(x.l.descricao) + '</td><td class="valor ' + (x.l.valor >= 0 ? 'mais' : 'menos') + '">' +
          OG.util.formatarDinheiroComSinal(x.l.valor) + '</td><td class="saldo">' + din(x.saldo) + '</td></tr>';
      }).join('') + '</tbody></table>' +
      '<p class="nota" style="margin-top:8px">Retorno é tudo o que entrou de um projeto. Lucro é o retorno menos o custo.</p>';
  }

  function regrasResumo() {
    return '<ol class="regras-lista">' +
      '<li>Cada rodada começa com um evento. Ele vale para a rodada inteira.</li>' +
      '<li>Planeje: leve projetos do Backlog para A fazer.</li>' +
      '<li>Inicie: monte a equipe e pague o custo. No máximo 2 projetos em andamento.</li>' +
      '<li>Encerre a rodada: projetos em andamento ganham 1 rodada de progresso. Quem completar vai para Revisão.</li>' +
      '<li>Revise: um coordenador livre confere e o projeto vai para Concluído. Só aí entram retorno, prestígio e tradição.</li>' +
      '</ol>' +
      '<ul class="lista-simples" style="margin-top:12px">' +
      '<li>Especialista na categoria do projeto: R$ 10,00 de desconto por pessoa.</li>' +
      '<li>Quem revisa fica ocupado até o fim da rodada.</li>' +
      '<li>Projeto iniciado na última rodada não termina a tempo.</li>' +
      '<li>O caixa nunca fica negativo. Despesa sem dinheiro vira perda de prestígio.</li>' +
      '<li>Pontos: caixa ÷ 10 + prestígio + tradição + 5 por projeto concluído.</li>' +
      '</ul>';
  }

  function painelDiario(estado, aba) {
    const abas = [
      { id: 'historico', rotulo: 'Histórico', icone: 'historico' },
      { id: 'financas', rotulo: 'Finanças', icone: 'financas' },
      { id: 'regras', rotulo: 'Regras', icone: 'regras' },
    ];
    const conteudo = aba === 'financas' ? financas(estado) : aba === 'regras' ? regrasResumo() : historico(estado);
    return '<section class="painel painel-diario" aria-label="Diário do Grêmio">' +
      '<div class="abas" role="tablist" aria-label="Diário do Grêmio">' +
      abas.map(function (a) {
        return '<button type="button" class="aba" role="tab" id="aba-' + a.id + '" aria-controls="painel-aba" aria-selected="' + (aba === a.id) + '" data-acao="aba" data-aba="' + a.id + '" data-foco="aba:' + a.id + '" tabindex="' + (aba === a.id ? '0' : '-1') + '">' +
          ic(a.icone) + a.rotulo + '</button>';
      }).join('') + '</div>' +
      '<div class="aba-painel" role="tabpanel" id="painel-aba" aria-labelledby="aba-' + aba + '">' + conteudo + '</div></section>';
  }

  // ---------------- Evento ----------------

  function cartaEvento(estado, idTitulo) {
    const ev = estado.eventoAtual;
    const def = E().definicaoEvento(ev.id);
    const tipo = TIPOS_EVENTO[def.tipo];
    let extra = '';
    if (ev.id === 'ev_influenza') {
      const p = ev.alvo ? E().pessoa(ev.alvo) : null;
      extra = '<p class="caixa-info">' + (p ? '<strong>Quem pegou:</strong> ' + esc(p.nome) + ' (' + esc(p.papel === 'coordenador' ? p.cargo : p.especialidade.rotulo) + ').' : 'Ninguém estava livre para ficar doente.') + '</p>';
    }
    return '<div class="carta-evento ' + def.tipo + '">' +
      '<div class="carta-evento-tipo"><span>' + ic(tipo.icone) + ' ' + tipo.rotulo + '</span><span>Rodada ' + ev.rodada + ' de ' + OG.regras.TOTAL_RODADAS + '</span></div>' +
      '<div class="carta-evento-corpo">' +
      '<h3 id="' + (idTitulo || 'modal-titulo') + '">' + esc(def.nome) + '</h3>' +
      '<blockquote>“' + esc(def.texto) + '”</blockquote>' +
      '<p class="efeito">' + esc(def.efeito) + '</p>' + extra +
      '<p class="quando">' + ic('tempo') + QUANDO_EVENTO[def.quando] + '</p>' +
      '</div></div>';
  }

  // ---------------- Custo ----------------

  function contaCusto(estado, custo) {
    const caixa = OG.financas.caixa(estado);
    if (custo.jaPago) {
      return '<p class="caixa-bom">' + ic('check') + '<span>O custo deste projeto já foi pago antes. Retomar não cobra nada.</span></p>';
    }
    return '<dl class="conta">' +
      '<dt>Custo base</dt><dd>' + din(custo.base) + '</dd>' +
      custo.itens.map(function (i) { return '<dt class="desconto">' + esc(i.rotulo) + '</dt><dd class="desconto">' + din(i.valor) + '</dd>'; }).join('') +
      '<dt class="total">Total a pagar</dt><dd>' + din(custo.final) + '</dd>' +
      '<dt>Caixa agora</dt><dd>' + din(caixa) + '</dd>' +
      '<dt>Caixa depois</dt><dd class="' + (caixa - custo.final < 0 ? 'menos' : '') + '">' + din(caixa - custo.final) + '</dd>' +
      '</dl>';
  }

  OG.componentes = {
    NOMES_COLUNA,
    TIPOS_EVENTO,
    avatar,
    especialidadeTexto,
    painelEquipe,
    card,
    acoesDaCarta,
    coluna,
    hud,
    faixaEvento,
    painelDiario,
    regrasResumo,
    cartaEvento,
    contaCusto,
    botao,
  };
})(globalThis);

</script>
  <script>
/*
 * telas.js — telas (início, missões, jogo, fim) e o conteúdo das janelas modais.
 * Cada função recebe o estado da aplicação e devolve HTML. Quem decide o que mostrar
 * é o app.js; quem decide as regras é o núcleo.
 */
(function (global) {
  'use strict';
  const OG = (global.OG = global.OG || {});

  function esc(v) { return OG.ui.esc(v); }
  function ic(nome, classe, rotulo) { return OG.icones.icone(nome, classe, rotulo); }
  function din(v) { return OG.util.formatarDinheiro(v); }
  function E() { return OG.estado; }
  function C() { return OG.componentes; }
  function plural(n, s, p) { return OG.util.plural(n, s, p); }

  // Faixa de cor de cada cartaz de missão (a Farroupilha leva as cores da bandeira do RS).
  const TEMAS = {
    farroupilha: 'linear-gradient(90deg, #1d8a4d 0 33.3%, #d42a2a 33.3% 66.6%, #f5c400 66.6%)',
    junina: '#f08a24',
    halloween: 'repeating-linear-gradient(90deg, #ff7a00 0 22px, #2b1638 22px 44px)',
    gamer: '#7548d8',
    liga: '#2f9e43',
    cultural: '#e0446a',
    profissoes: '#2a88d6',
    talentos: '#c2189b',
    estudante: '#ffc83d',
    concolor: '#0d948b',
  };

  function textoRecompensa(rec) {
    const partes = [];
    if (rec.dinheiro) partes.push('+' + din(rec.dinheiro));
    if (rec.prestigio) partes.push('+' + rec.prestigio + ' Prestígio');
    if (rec.tradicao) partes.push('+' + rec.tradicao + ' Tradição');
    return OG.util.listaPt(partes);
  }

  function marca(extra) {
    return '<span class="marca' + (extra ? ' ' + extra : '') + '" aria-hidden="true"><span class="marca-escola">Escola Técnica</span><span class="marca-mesquita">Mesquita</span></span>';
  }

  // ======================= Telas =======================

  function telaInicio(app) {
    const salvo = app.estado;
    const botoes = [];
    let detalheSalvo = '';
    if (salvo) {
      const m = E().missao(salvo);
      if (salvo.fase === 'fim') {
        botoes.push('<button type="button" class="botao botao-secundario botao-grande" data-acao="continuar" data-foco="continuar">' + ic('premio') + 'Ver o resultado da última partida</button>');
      } else {
        botoes.push('<button type="button" class="botao botao-primario botao-grande" data-acao="continuar" data-foco="continuar" data-foco-principal>' + ic('jogar') + 'Continuar partida</button>');
        detalheSalvo = '<p class="inicio-continuar">Partida salva: ' + esc(m.nome) + ', rodada ' + salvo.rodada + ' de ' + OG.regras.TOTAL_RODADAS + '.</p>';
      }
    }
    const novaPrincipal = !salvo || salvo.fase === 'fim';
    botoes.push('<button type="button" class="botao ' + (novaPrincipal ? 'botao-primario' : 'botao-fantasma') + ' botao-grande" data-acao="jogar" data-foco="jogar"' + (novaPrincipal ? ' data-foco-principal' : '') + '>' +
      (novaPrincipal ? ic('jogar') : '') + (salvo && !novaPrincipal ? 'Nova partida' : 'Jogar') + '</button>');
    botoes.push('<button type="button" class="botao botao-fantasma botao-grande" data-acao="como-jogar" data-foco="como-jogar">' + ic('ajuda') + 'Como jogar</button>');
    botoes.push('<button type="button" class="botao botao-fantasma botao-grande" data-acao="configuracoes" data-foco="configuracoes">' + ic('config') + 'Configurações</button>');

    const membros = OG.dados.coordenadores.map(function (p) {
      return '<li class="inicio-membro">' + C().avatar(E().pessoa(p.id)) + '<span><span class="nome">' + esc(p.nome) + '</span><span class="cargo">' + esc(p.cargo) + '</span></span></li>';
    }).join('');

    return '<main class="tela tela-inicio" id="conteudo">' +
      '<div class="inicio-cabeca">' + marca() + '</div>' +
      '<section class="inicio-heroi" aria-labelledby="titulo-jogo">' +
      '<h1 class="titulo-jogo" id="titulo-jogo"><span class="linha">Operação</span><span class="faixa">Grêmio</span><span class="visualmente-oculto"> — Mesquita</span></h1>' +
      '<p class="inicio-texto">Organize os eventos da escola num quadro Kanban: escolha os projetos, monte a equipe, cuide do caixa e encare os imprevistos. São 4 rodadas, uns 20 minutos.</p>' +
      '<div class="inicio-acoes">' + botoes.join('') + '</div>' + detalheSalvo +
      (app.config.caixaApertado ? '<p class="inicio-continuar">Configuração ativa: caixa apertado (novas partidas começam com ' + din(OG.regras.CAIXA_APERTADO) + ').</p>' : '') +
      '</section>' +
      '<section class="inicio-time" aria-labelledby="titulo-coordenacao"><h2 id="titulo-coordenacao">A coordenação do Grêmio</h2><ul class="inicio-equipe">' + membros + '</ul></section>' +
      '</main>';
  }

  function telaMissoes(app) {
    const caixa = app.config.caixaApertado ? OG.regras.CAIXA_APERTADO : OG.regras.CAIXA_INICIAL;
    const cartazes = OG.dados.missoes.map(function (m) {
      const projetos = m.projetos.map(function (id) {
        const p = OG.dados.projetosPorId[id];
        return '<li><span class="ponto-cat" style="--cat: var(--cat-' + p.categoria + ')" title="' + esc(OG.dados.categorias[p.categoria].nome) + '"></span>' +
          esc(p.nome) + (p.tempo > 1 ? '<span class="tempo-longo">2 rodadas</span>' : '') + '</li>';
      }).join('');
      return '<li class="cartaz-missao" style="--tema: ' + TEMAS[m.id] + '">' +
        '<div class="cartaz-faixa" style="background: ' + TEMAS[m.id] + '"></div>' +
        '<h2>' + esc(m.nome) + '</h2>' +
        '<p class="cartaz-desc">' + esc(m.descricao) + '</p>' +
        '<dl class="cartaz-dados">' +
        '<dt>Objetivo</dt><dd>Concluir ' + m.objetivo + ' dos 6 projetos</dd>' +
        '<dt>Recompensa</dt><dd>' + esc(textoRecompensa(m.recompensa)) + '</dd>' +

        '</dl>' +
        '<ul class="cartaz-projetos" aria-label="Projetos da missão">' + projetos + '</ul>' +
        '<button type="button" class="botao botao-primario" data-acao="escolher-missao" data-missao="' + m.id + '" data-foco="missao:' + m.id + '">Jogar ' + esc(m.nome) + '</button>' +
        '</li>';
    }).join('');
    return '<main class="tela tela-missoes" id="conteudo">' +
      '<header class="barra-topo"><button type="button" class="botao botao-fantasma botao-pequeno" data-acao="voltar-inicio" data-foco="voltar-inicio" data-foco-principal>' + ic('voltar') + 'Início</button>' +
      '<h1>Escolha a missão</h1>' + marca() + '</header>' +
      '<p class="missoes-intro">Cada missão traz 6 projetos. O Grêmio começa com ' + din(caixa) + ', 20 de prestígio e 20 de tradição. A meta é a pontuação do melhor plano possível sem imprevistos.</p>' +
      '<ul class="grade-missoes">' + cartazes + '</ul>' +
      '</main>';
  }

  function telaJogo(app) {
    const estado = app.estado;
    const colunas = OG.regras.COLUNAS;
    const aba = app.ui.abaMobile;
    const trocar = '<nav class="trocar-coluna" aria-label="Colunas do quadro">' + colunas.map(function (col) {
      const n = E().cartasNaColuna(estado, col.id).length;
      return '<button type="button" data-acao="coluna-mobile" data-coluna="' + col.id + '" aria-current="' + (app.ui.colunaMobile === col.id) + '" data-foco="colmob:' + col.id + '">' +
        C().NOMES_COLUNA[col.id] + ' ' + (col.limite ? n + '/' + col.limite : n) + '</button>';
    }).join('') + '</nav>';

    const podeEncerrar = estado.fase === 'planejamento';
    const rotuloNav = estado.fase === 'resumo'
      ? (estado.rodada >= OG.regras.TOTAL_RODADAS ? 'Ver resultado' : 'Próxima rodada')
      : 'Encerrar rodada';
    const acaoNav = estado.fase === 'resumo' ? 'avancar' : 'encerrar-rodada';
    const navCelular = '<nav class="nav-celular" aria-label="Navegação do jogo">' +
      '<button type="button" data-acao="aba-mobile" data-aba="quadro" aria-current="' + (aba === 'quadro') + '" data-foco="nav:quadro">' + ic('kanban') + 'Quadro</button>' +
      '<button type="button" data-acao="aba-mobile" data-aba="equipe" aria-current="' + (aba === 'equipe') + '" data-foco="nav:equipe">' + ic('pessoas') + 'Equipe</button>' +
      '<button type="button" data-acao="aba-mobile" data-aba="diario" aria-current="' + (aba === 'diario') + '" data-foco="nav:diario">' + ic('historico') + 'Diário</button>' +
      '<button type="button" class="botao-encerrar" data-acao="' + acaoNav + '" data-foco="nav:encerrar"' +
      (podeEncerrar || estado.fase === 'resumo' ? '' : ' aria-disabled="true" data-motivo="' + esc(OG.kanban.mensagemFase(estado)) + '"') + '>' +
      ic('rodada') + esc(rotuloNav) + '</button>' +

    return '<div class="tela tela-jogo aba-' + aba + (app.ui.lateralAberta ? ' lateral-aberta' : '') + '">' +

      '</div>' + navCelular + '</div>';

  function telaFim(app) {
    const estado = app.estado;
    const m = E().missao(estado);
    const p = OG.pontuacao.calcular(estado);
    const f = OG.pontuacao.resumoFinanceiro(estado);
    const R = OG.regras;
    const escala = 120;
    const largura = Math.max(0, Math.min(p.aproveitamento, escala)) / escala * 100;
    const marcas = [40, 60, 80, 100].map(function (v) {
      return '<span class="marca-faixa" style="left:' + (v / escala * 100) + '%"></span>';
    }).join('');

    const linhasPontos = p.itens.map(function (i) {
      return '<tr><td>' + esc(i.rotulo) + '</td><td class="conta-pts">' + esc(i.conta) + '</td><td>' + i.pontos + '</td></tr>';
    }).join('') + '<tr class="total"><td>Total</td><td></td><td>' + p.total + '</td></tr>';

    const projetos = estado.cartas.slice().sort(function (a, b) {
      return OG.kanban.ORDEM.indexOf(b.coluna) - OG.kanban.ORDEM.indexOf(a.coluna);
    }).map(function (c) {
      const proj = E().projetoDaCarta(c);
      const situacoes = {
        concluido: ['Concluído', 'selo-bom'],
        revisao: ['Faltou revisar', 'selo-alerta'],
        andamento: ['Ficou em andamento', 'selo-alerta'],
        afazer: [c.custoPago !== null ? 'Pago, não terminou' : 'Não iniciado', c.custoPago !== null ? 'selo-alerta' : 'selo-info'],
        backlog: ['Não escolhido', 'selo-info'],
      };
      const s = situacoes[c.coluna];
      return '<li><span class="ponto-cat" style="--cat: var(--cat-' + proj.categoria + ')"></span>' + esc(proj.nome) +
        '<span class="situacao selo ' + s[1] + '">' + s[0] + '</span></li>';
    }).join('');

    const missaoTexto = p.missaoCumprida
      ? '<p class="caixa-bom">' + ic('concluido') + '<span><strong>Missão cumprida:</strong> ' + p.concluidos + ' projetos concluídos (objetivo: ' + p.objetivo + '). Recompensa recebida: ' + esc(textoRecompensa(p.recompensa)) + '.</span></p>'
      : '<p class="caixa-alerta">' + ic('alerta') + '<span><strong>Missão não cumprida:</strong> ' + p.concluidos + ' de ' + p.objetivo + ' projetos concluídos. A recompensa (' + esc(textoRecompensa(p.recompensa)) + ') ficou de fora.</span></p>';

    const licoes = [];
    licoes.push('Os projetos concluídos trouxeram ' + din(f.receitaProjetos) + ' de retorno, mas o lucro deles foi ' + din(f.lucroProjetosConcluidos) + ': retorno não é lucro.');
    if (f.investimentoParado > 0) licoes.push(din(f.investimentoParado) + ' ficaram parados em projetos pagos que não terminaram. Dinheiro investido sem retorno.');
    if (f.despesas > 0) licoes.push('Imprevistos custaram ' + din(f.despesas) + '. Guardar caixa ajuda a absorver o que ninguém planejou.');

    return '<main class="tela tela-fim" id="conteudo">' +
      '<header class="barra-topo" style="padding-left:0;padding-right:0"><h1>Fim de jogo</h1>' + marca() + '</header>' +
      '<section class="fim-destaque" aria-labelledby="classificacao">' +
      '<p class="fim-resumo">' + esc(m.nome) + (estado.caixaApertado ? ' (caixa apertado)' : '') + '</p>' +
      '<h2 id="classificacao" class="carimbo' + (p.aproveitamento < 40 ? ' conversar' : '') + '" tabindex="-1" data-foco-principal>' + esc(p.classificacao) + '</h2>' +
      '<p class="fim-resumo">O Grêmio terminou com <strong>' + p.total + ' pontos</strong>. Descontando os ' + p.pontosIniciais + ' do começo, conquistou ' + p.conquistado + ' dos ' + p.metaConquista + ' que o melhor plano possível conquistaria: <strong>' + p.aproveitamento + '% de aproveitamento</strong>.</p>' +
      '<div class="aproveitamento" role="img" aria-label="Aproveitamento de ' + p.aproveitamento + '%">' +
      '<div class="aproveitamento-barra"><span class="valor" style="width:' + largura + '%"></span>' + marcas + '</div>' +
      '<div class="aproveitamento-legenda" aria-hidden="true"><span style="left:0">0%</span>' +
      [[40, 'Sobreviveu'], [60, 'Aprovado'], [80, 'Destaque'], [100, 'Lendário']].map(function (f) {
        return '<span style="left:' + (f[0] / escala * 100) + '%">' + f[0] + '%<br>' + f[1] + '</span>';
      }).join('') + '</div>' +
      '</div></section>' +
      '<div class="fim-grade" style="margin-top:18px">' +
      '<section class="painel" aria-labelledby="t-pontos"><h2 id="t-pontos">' + ic('premio') + ' Pontuação</h2>' +
      '<table class="tabela-pontos" style="margin-top:8px"><caption class="visualmente-oculto">Cálculo da pontuação</caption><tbody>' + linhasPontos + '</tbody></table>' +
      '<p class="nota" style="margin-top:10px">Meta da missão: ' + p.meta + ' pontos. Pontos iniciais: ' + p.pontosIniciais + ' (caixa ÷ ' + R.REAIS_POR_PONTO + ' + prestígio + tradição do começo).</p></section>' +
      '<section class="painel" aria-labelledby="t-missao"><h2 id="t-missao">' + ic('missao') + ' Missão</h2><div style="margin-top:10px;display:grid;gap:12px">' + missaoTexto +
      '<ul class="lista-projetos-fim">' + projetos + '</ul></div></section>' +
      '<section class="painel" aria-labelledby="t-dinheiro" style="grid-column:1/-1"><h2 id="t-dinheiro">' + ic('financas') + ' Dinheiro do Grêmio</h2>' +
      '<div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:10px">' +
      '<dl class="resumo-financeiro">' +
      '<dt>Caixa inicial</dt><dd>' + din(f.caixaInicial) + '</dd>' +
      '<dt>Investido em projetos</dt><dd class="menos">' + din(-f.investido) + '</dd>' +
      '<dt>Retorno de projetos</dt><dd class="mais">' + OG.util.formatarDinheiroComSinal(f.receitaProjetos) + '</dd>' +
      '<dt>Patrocínios e recompensas</dt><dd class="mais">' + OG.util.formatarDinheiroComSinal(f.outrasReceitas) + '</dd>' +
      '<dt>Despesas inesperadas</dt><dd class="menos">' + din(-f.despesas) + '</dd>' +
      '<dt><strong>Caixa final</strong></dt><dd>' + din(f.caixaFinal) + '</dd></dl>' +
      '<ul class="lista-simples">' + licoes.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>' +
      '</div></section></div>' +
      '<div class="fim-acoes">' +
      '<button type="button" class="botao botao-primario botao-grande" data-acao="jogar-de-novo" data-foco="jogar-de-novo">' + ic('reiniciar') + 'Jogar ' + esc(m.nome) + ' de novo</button>' +
      '<button type="button" class="botao botao-fantasma botao-grande" data-acao="outra-missao" data-foco="outra-missao">Escolher outra missão</button>' +
      '<button type="button" class="botao botao-fantasma botao-grande" data-acao="voltar-inicio" data-foco="voltar-inicio">' + ic('inicio') + 'Início</button>' +
      '</div></main>';
  }

  // ======================= Modais =======================

  function cabecalho(titulo, sub, fechavel, rotuloFechar) {
    return '<header class="modal-cabeca"><div style="flex:1"><h2 id="modal-titulo">' + esc(titulo) + '</h2>' +
      (sub ? '<p class="modal-sub">' + sub + '</p>' : '') + '</div>' +
      (fechavel ? '<button type="button" class="botao botao-secundario botao-icone" data-acao="fechar-modal" aria-label="' + esc(rotuloFechar || 'Fechar') + '">' + ic('fechar') + '</button>' : '') +
      '</header>';
  }

  function botaoOpcao(acao, op, extra) {
    const motivo = op.habilitado === false ? ' aria-disabled="true" data-motivo="' + esc(op.motivo || 'Indisponível') + '" title="' + esc(op.motivo || '') + '"' : '';
    return '<button type="button" class="botao ' + (extra || 'botao-primario') + '" data-acao="' + acao + '" data-escolha="' + esc(op.id) + '" data-foco="' + acao + ':' + esc(op.id) + '"' + motivo + '>' + esc(op.rotulo) + '</button>';
  }

  function modalEvento(app) {

    const opcoes = OG.eventos.opcoesEvento(estado);

      return botaoOpcao('confirmar-evento', op, i === opcoes.length - 1 ? 'botao-primario' : 'botao-secundario');
    }).join('');
    return {
