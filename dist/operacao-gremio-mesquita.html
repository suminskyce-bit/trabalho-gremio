        '<footer class="modal-rodape"><button type="button" class="botao botao-secundario botao-pequeno" data-acao="menu" style="margin-right:auto">' + ic('menu') + 'Menu</button>' + botoes + '</footer>',
    };
  }

  function modalVerEvento(app) {
    return {
      chave: 'ver-evento',
      dispensavel: true,
      html: '<div class="modal-corpo" style="padding-top:20px">' + C().cartaEvento(app.estado) + '</div>' +
        '<footer class="modal-rodape"><button type="button" class="botao botao-primario" data-acao="fechar-modal" data-foco-inicial>Voltar ao quadro</button></footer>',
    };
  }

  function modalDecisao(app) {
    const estado = app.estado;
    const dec = OG.eventos.decisaoFimRodada(estado);
    if (!dec) return null;
    const opcoes = dec.opcoes.map(function (op) {
      const motivo = op.habilitado ? '' : ' aria-disabled="true" data-motivo="' + esc(op.motivo || '') + '"';
      return '<li><button type="button" class="opcao' + (op.habilitado ? '' : ' desabilitada') + '" data-acao="resolver-decisao" data-escolha="' + esc(op.id) + '" data-foco="decisao:' + esc(op.id) + '"' + motivo + '>' +
        '<span class="decisao-opcao"><strong>' + esc(op.rotulo) + '</strong><span>' + esc(op.habilitado ? op.descricao : (op.motivo || '')) + '</span></span></button></li>';
    }).join('');
    return {
      chave: 'decisao:' + estado.rodada,
      dispensavel: false,
      html: cabecalho(dec.titulo, 'Fim da rodada ' + estado.rodada + ': o evento cobra a conta agora.', false) +
        '<div class="modal-corpo"><p>' + esc(dec.pergunta) + '</p><ul class="lista-opcoes">' + opcoes + '</ul></div>' +
        '<footer class="modal-rodape"><button type="button" class="botao botao-secundario" data-acao="cancelar-encerramento">' + ic('voltar') + 'Voltar ao quadro</button></footer>',
    };
  }

  function modalResumo(app) {
    const estado = app.estado;
    const r = E().recursos(estado);
    const m = E().missao(estado);
    const icones = { avancou: 'concluido', parado: 'parado', equipe: 'pessoas', evento: 'info', info: 'info' };
    const linhas = estado.resumo.linhas.map(function (l) {
      return '<li class="' + l.tipo + '">' + ic(icones[l.tipo] || 'info') + '<span>' + esc(l.texto) + '</span></li>';
    }).join('');
    const ultima = estado.rodada >= OG.regras.TOTAL_RODADAS;
    let aviso = '';
    if (ultima) {
      const revisao = E().cartasNaColuna(estado, 'revisao').length;
      aviso = revisao ? '<p class="caixa-alerta">' + ic('alerta') + '<span>' + revisao + ' ' + plural(revisao, 'projeto terminou', 'projetos terminaram') + ' a execução agora, mas não há mais rodada para revisar. Não contam como concluídos.</span></p>' : '';
    } else {
      const revisao = E().cartasNaColuna(estado, 'revisao').length;
      if (revisao) aviso = '<p class="caixa-info">Na próxima rodada, revise ' + (revisao === 1 ? 'o projeto' : 'os ' + revisao + ' projetos') + ' em Revisão para receber retorno e pontos.</p>';
    }
    return {
      chave: 'resumo:' + estado.rodada,
      dispensavel: true,
      aoDispensar: 'fechar-resumo',
      html: cabecalho('Fim da rodada ' + estado.rodada, ultima ? 'Essa foi a última rodada.' : 'Veja o que aconteceu antes da próxima carta de evento.', true, 'Ver o quadro') +
        '<div class="modal-corpo"><ul class="resumo-linhas">' + linhas + '</ul>' + aviso +
        '<div class="mini-recursos"><span>' + ic('dinheiro', '', 'Caixa') + din(r.dinheiro) + '</span><span>' + ic('prestigio', '', 'Prestígio') + r.prestigio + '</span><span>' + ic('tradicao', '', 'Tradição') + r.tradicao + '</span><span>' + ic('missao', '', 'Missão') + E().totalConcluidos(estado) + ' de ' + m.objetivo + '</span></div></div>' +
        '<footer class="modal-rodape"><button type="button" class="botao botao-primario" data-acao="avancar" data-foco-inicial>' +
        (ultima ? ic('premio') + 'Ver resultado final' : ic('jogar') + 'Começar a rodada ' + (estado.rodada + 1)) + '</button></footer>',
    };
  }

  function linhaPessoa(estado, p, proj, op) {
    const marcado = op.marcado;
    const desab = op.desabilitado;
    const tags = [];
    if (!op.radio && E().ehEspecialista(p, proj)) tags.push(op.comDesconto ? '<span class="selo selo-bom">Especialista −' + din(OG.regras.DESCONTO_ESPECIALISTA) + '</span>' : '<span class="selo selo-bom">Especialista</span>');
    if (!op.radio && p.papel === 'coordenador') tags.push('<span class="selo selo-info" title="Só coordenadores fazem revisões. Quem está em projeto não revisa.">Coordenador</span>');
    if (p.somentePorEvento) tags.push('<span class="selo selo-alerta">Temporário</span>');
    return '<li><label class="opcao' + (marcado ? ' marcada' : '') + (desab ? ' desabilitada' : '') + '">' +
      '<input type="' + (op.radio ? 'radio' : 'checkbox') + '" name="' + (op.radio ? 'revisor' : 'equipe') + '" data-acao="' + op.acao + '" data-pessoa="' + p.id + '" data-foco="pessoa:' + p.id + '"' +
      (marcado ? ' checked' : '') + (desab ? ' disabled' : '') + '>' +
      C().avatar(p) +
      '<span class="opcao-texto"><strong>' + esc(p.nome) + '</strong><span>' + (op.detalhe ? esc(op.detalhe) + '. ' : '') + esc(op.radio ? p.cargo : p.papel === 'coordenador' ? p.cargo + '. ' + C().especialidadeTexto(p) : p.especialidade.rotulo) + '</span></span>' +
      '<span class="opcao-tags">' + tags.join('') + '</span></label></li>';
  }

  function ordenarVoluntariosPrimeiro(a, b) {
    if (a.papel !== b.papel) return a.papel === 'voluntario' ? -1 : 1;
    return a.nome.localeCompare(b.nome, 'pt-BR');
  }

  function modalEquipe(app) {
    const estado = app.estado;
    const m = app.ui.modal;
    const c = E().carta(estado, m.cartaId);
    if (!c) return null;
    const proj = E().projetoDaCarta(c);
    const completar = m.tipo === 'completar';
    const precisa = completar ? proj.trabalhadores - c.equipe.length : proj.trabalhadores;
    const restante = proj.tempo - c.progresso;
    const presentes = E().todasPessoas().filter(function (p) { return E().presente(estado, p.id); });
    const livres = presentes.filter(function (p) { return E().statusPessoa(estado, p.id).codigo === 'livre'; });
    const cabem = livres.filter(function (p) { return E().rodadasRestantes(estado, p.id) >= restante; });
    const especialistas = cabem.filter(function (p) { return E().ehEspecialista(p, proj); }).sort(ordenarVoluntariosPrimeiro);
    const outras = cabem.filter(function (p) { return !E().ehEspecialista(p, proj); }).sort(ordenarVoluntariosPrimeiro);
    const fora = presentes.filter(function (p) { return cabem.indexOf(p) === -1; });
    const sel = m.selecionados;
    const cheia = sel.length >= precisa;
    const comDesconto = !completar && c.custoPago === null;
    const linha = function (p) {
      const marcado = sel.indexOf(p.id) !== -1;
      return linhaPessoa(estado, p, proj, { marcado: marcado, desabilitado: !marcado && cheia, comDesconto: comDesconto, acao: 'alternar-pessoa' });
    };

    let validacao;
    if (completar) {
      validacao = sel.length === precisa ? { ok: true } : { ok: false, erro: 'Escolha ' + precisa + ' ' + plural(precisa, 'pessoa', 'pessoas') + '.' };
    } else {
      validacao = OG.motor.aplicar(estado, { tipo: 'INICIAR', cartaId: c.id, equipe: sel });
    }
    const custo = completar ? null : OG.financas.calcularCusto(estado, c, sel);
    const avisos = [];
    if (!completar && !E().terminaATempo(estado, c)) {
      avisos.push('<p class="caixa-alerta">' + ic('alerta') + '<span><strong>Não termina a tempo.</strong> Começando agora, este projeto não executa e revisa antes do fim da partida: o custo vira dinheiro parado.</span></p>');
    }
    const ev = estado.eventoAtual ? E().definicaoEvento(estado.eventoAtual.id) : null;
    if (!completar && ev && ev.quando === 'fim' && ev.risco && proj.riscos.indexOf(ev.risco) !== -1) {
      avisos.push('<p class="caixa-alerta">' + ic(ev.risco) + '<span><strong>' + esc(ev.nome) + '</strong> no fim desta rodada pode afetar este projeto.</span></p>');
    }
    const rotuloConfirmar = completar
      ? 'Adicionar à equipe'
      : custo.jaPago ? 'Retomar projeto' : 'Iniciar e pagar ' + din(custo.final);
    const sub = esc(OG.dados.categorias[proj.categoria].nome) + '. Precisa de ' + precisa + ' ' + plural(precisa, 'pessoa', 'pessoas') +
      (completar ? ' para completar a equipe' : '') + '. Escolhidas: ' + sel.length + ' de ' + precisa + '.';
    return {
      chave: m.tipo + ':' + c.id,
      classe: 'modal-largo',
      dispensavel: true,
      aoDispensar: 'fechar-modal',
      html: cabecalho((completar ? 'Completar equipe: ' : (c.custoPago !== null ? 'Retomar: ' : 'Iniciar: ')) + proj.nome, sub, true, 'Cancelar') +
        '<div class="modal-corpo">' + avisos.join('') +
        (custo ? C().contaCusto(estado, custo) : '') +
        (especialistas.length ? '<div><h3 class="modal-sub" style="margin:0 0 6px;font-weight:700">Especialistas livres</h3><ul class="lista-opcoes">' + especialistas.map(linha).join('') + '</ul></div>' : '<p class="nota">Nenhum especialista livre nesta categoria agora.</p>') +
        (outras.length ? '<div><h3 class="modal-sub" style="margin:0 0 6px;font-weight:700">Outras pessoas livres</h3><ul class="lista-opcoes">' + outras.map(linha).join('') + '</ul></div>' : '') +
        (fora.length ? '<details class="indisponiveis"><summary>Indisponíveis agora (' + fora.length + ')</summary><ul>' + fora.map(function (p) {
          const st = E().statusPessoa(estado, p.id);
          const motivo = st.codigo === 'livre' ? 'só fica mais ' + E().rodadasRestantes(estado, p.id) + ' rodada, e o projeto precisa de ' + restante : st.texto.toLowerCase();
          return '<li><strong>' + esc(p.nome) + '</strong>: ' + esc(motivo) + '</li>';
        }).join('') + '</ul></details>' : '') +
        '</div>' +
        '<footer class="modal-rodape"><button type="button" class="botao botao-secundario" data-acao="fechar-modal">Cancelar</button>' +
        '<button type="button" class="botao botao-primario" data-acao="confirmar-equipe" data-foco="confirmar-equipe"' +
        (validacao.ok ? '' : ' aria-disabled="true" data-motivo="' + esc(validacao.erro) + '"') + '>' + ic(completar ? 'reforco' : 'jogar') + esc(rotuloConfirmar) + '</button></footer>',
    };
  }

  function modalRevisor(app) {
    const estado = app.estado;
    const m = app.ui.modal;
    const c = E().carta(estado, m.cartaId);
    if (!c) return null;
    const proj = E().projetoDaCarta(c);
    const coords = OG.dados.coordenadores.map(function (p) { return E().pessoa(p.id); });
    const lucro = proj.retorno - (c.custoPago || 0);
    const missao = E().missao(estado);
    const cumpre = !estado.missaoCumprida && E().totalConcluidos(estado) + 1 >= missao.objetivo;
    const lista = coords.map(function (p) {
      const st = E().statusPessoa(estado, p.id);
      const livre = st.codigo === 'livre';
      return linhaPessoa(estado, p, proj, {
        marcado: m.revisor === p.id, desabilitado: !livre, acao: 'escolher-revisor', radio: true,
        detalhe: livre ? null : st.texto,
      });
    }).join('');
    const ganhos = ['+' + din(proj.retorno) + ' de retorno (lucro do projeto: ' + din(lucro) + ')'];
    if (proj.prestigio) ganhos.push('+' + proj.prestigio + ' Prestígio');
    if (proj.tradicao) ganhos.push('+' + proj.tradicao + ' Tradição');
    const validacao = m.revisor
      ? OG.motor.aplicar(estado, { tipo: 'REVISAR', cartaId: c.id, revisorId: m.revisor })
      : { ok: false, erro: 'Escolha um coordenador.' };
    return {
      chave: 'revisor:' + c.id,
      dispensavel: true,
      aoDispensar: 'fechar-modal',
      html: cabecalho('Revisar: ' + proj.nome, 'Um coordenador livre confere o projeto. Quem revisa fica ocupado até o fim da rodada.', true, 'Cancelar') +
        '<div class="modal-corpo">' +
        '<p class="caixa-bom">' + ic('concluido') + '<span><strong>Ao concluir:</strong> ' + esc(OG.util.listaPt(ganhos)) + '.</span></p>' +
        (cumpre ? '<p class="caixa-bom">' + ic('missao') + '<span><strong>Isso cumpre a missão!</strong> Recompensa: ' + esc(textoRecompensa(missao.recompensa)) + '.</span></p>' : '') +
        '<ul class="lista-opcoes" role="radiogroup" aria-label="Coordenador que revisa">' + lista + '</ul></div>' +
        '<footer class="modal-rodape"><button type="button" class="botao botao-secundario" data-acao="fechar-modal">Cancelar</button>' +
        '<button type="button" class="botao botao-primario" data-acao="confirmar-revisao" data-foco="confirmar-revisao"' +
        (validacao.ok ? '' : ' aria-disabled="true" data-motivo="' + esc(validacao.erro) + '"') + '>' + ic('revisar') + 'Concluir projeto</button></footer>',
    };
  }

  function modalDetalhe(app) {
    const estado = app.estado;
    const c = E().carta(estado, app.ui.modal.cartaId);
    if (!c) return null;
    const proj = E().projetoDaCarta(c);
    const cat = OG.dados.categorias[proj.categoria];
    const custoRef = c.custoPago !== null ? c.custoPago : proj.custo;
    const especialistas = E().todasPessoas().filter(function (p) { return E().ehEspecialista(p, proj); });
    const riscos = proj.riscos.length
      ? '<ul class="lista-simples">' + proj.riscos.map(function (r) {
        const d = OG.dados.riscos[r];
        return '<li>' + ic(r) + ' ' + esc(d.nome) + ': sofre com o evento “' + esc(d.evento) + '”.</li>';
      }).join('') + '</ul>'
      : '<p class="nota">Nenhum risco especial: nenhum evento de fim de rodada mira este projeto.</p>';
    const acoes = [C().acoesDaCarta(estado, c, true)];
    if (estado.fase === 'planejamento' && c.coluna === 'afazer' && c.custoPago === null) {
      acoes.push(C().botao('desplanejar', 'Voltar ao backlog', { carta: c.id, icone: 'voltar' }));
    }
    const situacao = {
      backlog: 'No Backlog: ainda não escolhido.',
      afazer: c.custoPago !== null ? 'Em A fazer, já pago: recomeça sem custo.' : 'Em A fazer: pronto para iniciar.',
      andamento: 'Em andamento: ' + c.progresso + ' de ' + proj.tempo + ' rodadas de execução.',
      revisao: 'Em Revisão: execução completa, falta um coordenador conferir.',
      concluido: 'Concluído na rodada ' + c.concluidoNaRodada + '.',
    }[c.coluna];
    const equipe = c.coluna === 'andamento' ? c.equipe : c.equipeFinal;
    return {
      chave: 'detalhe:' + c.id,
      classe: 'modal-largo',
      dispensavel: true,
      aoDispensar: 'fechar-modal',
      html: cabecalho(proj.nome, ic(cat.icone) + ' ' + esc(cat.nome) + (proj.novo ? '. Card de apoio criado para completar a missão.' : ''), true) +
        '<div class="modal-corpo">' +
        '<p>' + esc(proj.descricao) + '</p>' +
        '<dl class="conta">' +
        '<dt>' + (c.custoPago !== null ? 'Custo pago' : 'Custo base (sem descontos)') + '</dt><dd>' + din(custoRef) + '</dd>' +
        '<dt>Retorno ao concluir</dt><dd>' + din(proj.retorno) + '</dd>' +
        '<dt class="total">Lucro se concluir</dt><dd>' + din(proj.retorno - custoRef) + '</dd>' +
        '<dt>Tempo de execução</dt><dd>' + proj.tempo + ' ' + plural(proj.tempo, 'rodada', 'rodadas') + '</dd>' +
        '<dt>Pessoas necessárias</dt><dd>' + proj.trabalhadores + '</dd>' +
        '<dt>Prestígio ao concluir</dt><dd>+' + proj.prestigio + '</dd>' +
        '<dt>Tradição ao concluir</dt><dd>+' + proj.tradicao + '</dd>' +
        '</dl>' +
        '<p class="caixa-info"><strong>Situação:</strong> ' + esc(situacao) +
        (equipe && equipe.length ? ' Equipe: ' + esc(OG.util.listaPt(equipe.map(function (id) { return E().pessoa(id).nome; }))) + '.' : '') + '</p>' +
        '<div><strong>Riscos</strong>' + riscos + '</div>' +
        '<div><strong>Especialistas (−' + din(OG.regras.DESCONTO_ESPECIALISTA) + ' cada)</strong><p class="nota">' + esc(OG.util.listaPt(especialistas.map(function (p) { return p.nome; }))) + '.</p></div>' +
        '</div>' +
        '<footer class="modal-rodape"><div class="card-acoes" style="margin-right:auto">' + acoes.join('') + '</div>' +
        '<button type="button" class="botao botao-secundario" data-acao="fechar-modal">Fechar</button></footer>',
    };
  }

  function modalMenu(app) {
    const emJogo = app.tela === 'jogo';
    return {
      chave: 'menu',
      dispensavel: true,
      aoDispensar: 'fechar-modal',
      html: cabecalho('Menu', emJogo ? 'A partida fica salva neste navegador.' : '', true) +
        '<div class="modal-corpo"><div class="lista-opcoes">' +
        '<button type="button" class="opcao" data-acao="como-jogar">' + ic('ajuda') + '<span class="decisao-opcao"><strong>Como jogar</strong><span>Regras completas em 2 minutos.</span></span></button>' +
        '<button type="button" class="opcao" data-acao="configuracoes">' + ic('config') + '<span class="decisao-opcao"><strong>Configurações</strong><span>Caixa apertado e partida salva.</span></span></button>' +
        '<button type="button" class="opcao" data-acao="nova-partida">' + ic('reiniciar') + '<span class="decisao-opcao"><strong>Nova partida</strong><span>Escolher missão. A partida atual só é substituída quando você confirmar.</span></span></button>' +
        '<button type="button" class="opcao" data-acao="voltar-inicio">' + ic('inicio') + '<span class="decisao-opcao"><strong>Voltar ao início</strong><span>Você pode continuar depois de onde parou.</span></span></button>' +
        '</div></div>' +
        '<footer class="modal-rodape"><button type="button" class="botao botao-primario" data-acao="fechar-modal">Voltar ao jogo</button></footer>',
    };
  }

  function modalComoJogar() {
    const R = OG.regras;
    return {
      chave: 'como-jogar',
      classe: 'modal-largo',
      dispensavel: true,
      aoDispensar: 'fechar-modal',
      html: cabecalho('Como jogar', 'Você é o Grêmio Estudantil do Mesquita. A missão: tirar um evento do papel em 4 rodadas.', true) +
        '<div class="modal-corpo">' +
        '<ol class="passos">' +
        '<li><span><strong>Leia o evento da rodada.</strong> Toda rodada começa com uma carta: imprevisto, boa notícia ou despesa. Ela vale para a rodada inteira, então dá para se preparar.</span></li>' +
        '<li><span><strong>Planeje.</strong> Arraste projetos do Backlog para A fazer (ou use o botão Planejar).</span></li>' +
        '<li><span><strong>Inicie.</strong> Leve o projeto para Em andamento, escolha a equipe e pague o custo. No máximo ' + R.LIMITE_EM_ANDAMENTO + ' projetos ao mesmo tempo: esse é o limite do Kanban.</span></li>' +
        '<li><span><strong>Encerre a rodada.</strong> Cada projeto em andamento ganha 1 rodada de progresso. Projeto de 1 rodada termina; de 2 rodadas, precisa de duas. Quem termina vai sozinho para Revisão.</span></li>' +
        '<li><span><strong>Revise.</strong> Na rodada seguinte, um coordenador livre confere o projeto e ele vai para Concluído. Só então entram o retorno, o prestígio e a tradição.</span></li>' +
        '<li><span><strong>Cumpra a missão.</strong> Conclua os projetos pedidos antes do fim da rodada ' + R.TOTAL_RODADAS + '. A recompensa entra na hora.</span></li>' +
        '</ol>' +
        '<div><strong>Dinheiro</strong><ul class="lista-simples">' +
        '<li>O custo é pago uma vez, ao iniciar. O retorno entra uma vez, ao concluir. Retorno não é lucro: lucro é retorno menos custo.</li>' +
        '<li>O Grêmio começa com ' + din(R.CAIXA_INICIAL) + ' e o caixa nunca fica negativo. Se faltar dinheiro para uma despesa obrigatória, o que faltar vira perda de prestígio (−1 a cada ' + din(R.REAIS_POR_PONTO_DE_DESGASTE) + ').</li>' +
        '<li>Especialista na categoria do projeto dá ' + din(R.DESCONTO_ESPECIALISTA) + ' de desconto por pessoa. Doações e materiais encontrados descontam o próximo projeto.</li>' +
        '</ul></div>' +
        '<div><strong>Equipe</strong><ul class="lista-simples">' +
        '<li>Cada pessoa trabalha em um projeto por vez. Só os 5 coordenadores revisam, e quem revisou fica ocupado até o fim da rodada.</li>' +
        '<li>Patrício é o coringa: só aparece com o evento “Patrício Ajudou” e fica 2 rodadas.</li>' +
        '</ul></div>' +
        '<div><strong>Tempo</strong><ul class="lista-simples">' +
        '<li>Projeto iniciado na última rodada não termina a tempo (precisa executar e ainda ser revisado). O jogo avisa.</li>' +
        '<li>Ícones nos cards mostram riscos: quadra, equipamento, fornecedor e mesas. Alguns eventos miram esses projetos.</li>' +
        '</ul></div>' +
        '<div><strong>Pontuação</strong><p class="nota">Caixa ÷ 10 + prestígio + tradição + 5 por projeto concluído. A classificação compara o que você conquistou com o melhor plano possível da missão: 100% ou mais é GRÊMIO LENDÁRIO; 80% DESTAQUE; 60% APROVADO; 40% SOBREVIVEU; abaixo disso, A DIREÇÃO QUER CONVERSAR.</p></div>' +
        '</div>' +
        '<footer class="modal-rodape"><button type="button" class="botao botao-primario" data-acao="fechar-modal" data-foco-inicial>Entendi</button></footer>',
    };
  }

  function modalConfig(app) {
    const salvo = !!app.estado;
    return {
      chave: 'config',
      dispensavel: true,
      aoDispensar: 'fechar-modal',
      html: cabecalho('Configurações', 'Valem para as próximas partidas.', true) +
        '<div class="modal-corpo">' +
        '<label class="interruptor"><input type="checkbox" data-acao="alternar-caixa-apertado" data-foco="cfg-caixa"' + (app.config.caixaApertado ? ' checked' : '') + '>' +
        '<span><strong>Caixa apertado</strong><span>Começar com ' + din(OG.regras.CAIXA_APERTADO) + ' em vez de ' + din(OG.regras.CAIXA_INICIAL) + '. O dinheiro passa a ser uma decisão de verdade: dá para ficar sem caixa no meio da partida.</span></span></label>' +
        '<div class="caixa-info">A partida é salva automaticamente neste navegador. ' + (salvo ? 'Há uma partida salva agora.' : 'Não há partida salva.') + '</div>' +
        (salvo ? '<button type="button" class="botao botao-secundario" data-acao="apagar-salvo">' + ic('reiniciar') + 'Apagar partida salva</button>' : '') +
        '</div>' +
        '<footer class="modal-rodape"><button type="button" class="botao botao-primario" data-acao="fechar-modal" data-foco-inicial>Pronto</button></footer>',
    };
  }

  function modalConfirmar(app) {
    const c = app.ui.modal.confirmar;
    return {
      chave: 'confirmar:' + c.id,
      dispensavel: true,
      aoDispensar: 'fechar-modal',
      html: cabecalho(c.titulo, '', true) +
        '<div class="modal-corpo">' + c.html + '</div>' +
        '<footer class="modal-rodape"><button type="button" class="botao botao-secundario" data-acao="fechar-modal" data-foco-inicial>' + esc(c.cancelar || 'Cancelar') + '</button>' +
        '<button type="button" class="botao ' + (c.perigo ? 'botao-perigo' : 'botao-primario') + '" data-acao="confirmar-acao">' + esc(c.rotulo) + '</button></footer>',
    };
  }

  OG.telas = {
    telaInicio,
    telaMissoes,
    telaJogo,
    telaFim,
    modalEvento,
    modalVerEvento,
    modalDecisao,
    modalResumo,
    modalEquipe,
    modalRevisor,
    modalDetalhe,
    modalMenu,
    modalComoJogar,
    modalConfig,
    modalConfirmar,
  };
})(globalThis);

</script>
  <script>
/*
 * app.js — controlador da interface.
 *
 * Fluxo: clique/arraste -> ação -> OG.motor.aplicar (núcleo valida tudo) ->
 *        estado novo -> salva no navegador -> renderiza a tela de novo.
 * Se o núcleo recusar, o estado não muda e o motivo aparece num aviso.
 */
(function (global) {
  'use strict';
  const OG = (global.OG = global.OG || {});

  const CHAVE_CONFIG = 'operacao-gremio-mesquita:config';
  const MODAIS_GLOBAIS = ['menu', 'como-jogar', 'config', 'confirmar'];
  const DICAS_SOLTAR = {
    planejar: 'Solte para planejar',
    desplanejar: 'Solte para voltar ao Backlog',
    iniciar: 'Solte para montar a equipe e iniciar',
    revisar: 'Solte para escolher quem revisa',
  };

  function novoUi() {
    return {
      modal: null,
      aba: 'historico',
      abaMobile: 'quadro',
      colunaMobile: 'backlog',
      lateralAberta: false,
      resumoFechado: null,
      pulsar: [],
      focoDepois: null,
    };
  }

  const app = {
    estado: null,
    tela: 'inicio',
    config: { caixaApertado: false },
    ui: novoUi(),
    avisouSemSalvar: false,
  };

  function E() { return OG.estado; }
  function esc(v) { return OG.ui.esc(v); }

  // ---------------- Configurações ----------------

  function carregarConfig() {
    try {
      const texto = global.localStorage.getItem(CHAVE_CONFIG);
      if (!texto) return;
      const c = JSON.parse(texto);
      app.config.caixaApertado = !!(c && c.caixaApertado === true);
    } catch (erro) {
      // Sem armazenamento: fica o padrão.
    }
  }

  function salvarConfig() {
    try {
      global.localStorage.setItem(CHAVE_CONFIG, JSON.stringify(app.config));
    } catch (erro) {
      // Sem armazenamento: a escolha vale só nesta sessão.
    }
  }

  function novaSemente() {
    try {
      const a = new Uint32Array(1);
      global.crypto.getRandomValues(a);
      return a[0] || 1;
    } catch (erro) {
      return (Math.floor(Math.random() * 4294967295) >>> 0) || 1;
    }
  }

  // ---------------- Despacho de ações ----------------

  function salvar() {
    if (!OG.persistencia.salvar(app.estado) && !app.avisouSemSalvar) {
      app.avisouSemSalvar = true;
      OG.ui.aviso('Este navegador não deixou salvar a partida. Dá para jogar, mas se recarregar a página ela se perde.', 'info');
    }
  }

  function marcarPulsos(antes, depois) {
    const a = E().recursos(antes);
    const d = E().recursos(depois);
    app.ui.pulsar = ['dinheiro', 'prestigio', 'tradicao'].filter(function (k) { return a[k] !== d[k]; });
  }

  /** Aplica a ação no núcleo. `aoSucesso(antes, depois)` roda antes de renderizar. */
  function despachar(acao, aoSucesso) {
    if (!app.estado) return false;
    const antes = app.estado;
    const r = OG.motor.aplicar(antes, Object.assign({ rodada: antes.rodada }, acao));
    if (!r.ok) {
      OG.ui.aviso(r.erro, 'erro');
      return false;
    }
    app.estado = r.estado;
    salvar();
    marcarPulsos(antes, app.estado);
    if (aoSucesso) aoSucesso(antes, app.estado);
    if (!antes.missaoCumprida && app.estado.missaoCumprida) {
      const m = E().missao(app.estado);
      OG.ui.aviso('Missão cumprida: ' + m.nome + '! A recompensa já entrou.', 'bom');
    }
    if (app.estado.fase === 'fim' && app.tela !== 'fim') {
      irPara('fim');
      return true;
    }
    render();
    return true;
  }

  function textoDelta(antes, depois) {
    const a = E().recursos(antes);
    const d = E().recursos(depois);
    const partes = [];
    if (d.dinheiro !== a.dinheiro) partes.push('Caixa ' + OG.util.formatarDinheiroComSinal(d.dinheiro - a.dinheiro));
    if (d.prestigio !== a.prestigio) partes.push('Prestígio ' + OG.util.formatarPontos(d.prestigio - a.prestigio));
    if (d.tradicao !== a.tradicao) partes.push('Tradição ' + OG.util.formatarPontos(d.tradicao - a.tradicao));
    return partes.join(', ');
  }

  function avisoDelta(antes, depois) {
    const t = textoDelta(antes, depois);
    if (t) OG.ui.aviso(t + '.', 'info');
  }

  // ---------------- Navegação ----------------

  function irPara(tela) {
    app.tela = tela;
    app.ui.modal = null;
    app.ui.lateralAberta = false;
    render();
    global.scrollTo(0, 0);
    if (!OG.ui.modalAberto()) {
      const principal = document.querySelector('[data-foco-principal]');
      if (principal) principal.focus({ preventScroll: true });
    }
  }

  function abrirModal(modal) {
    app.ui.modal = modal;
    render();
  }

  function fecharModalUi() {
    app.ui.modal = null;
    render();
  }

  function confirmar(dados) {
    abrirModal({ tipo: 'confirmar', confirmar: dados });
  }

  // ---------------- Partida ----------------

  function novaPartida(missaoId) {
    app.estado = OG.motor.criarPartida(missaoId, novaSemente(), { caixaApertado: app.config.caixaApertado });
    app.ui = novoUi();
    salvar();
    irPara('jogo');
  }

  function escolherMissao(missaoId) {
    if (app.estado && app.estado.fase !== 'fim') {
      const m = E().missao(app.estado);
      confirmar({
        id: 'substituir',
        titulo: 'Começar outra partida?',
        html: '<p>Você tem uma partida em andamento (' + esc(m.nome) + ', rodada ' + app.estado.rodada + '). Ela será substituída pela nova e não dá para recuperar.</p>',
        rotulo: 'Começar nova partida',
        perigo: true,
        acao: function () { novaPartida(missaoId); },
      });
      return;
    }
    novaPartida(missaoId);
  }

  function ordemSugestao(proj) {
    return function (a, b) {
      const pa = (E().ehEspecialista(a, proj) ? 0 : 4) + (a.papel === 'coordenador' ? 2 : 0) + (a.somentePorEvento ? -1 : 0);
      const pb = (E().ehEspecialista(b, proj) ? 0 : 4) + (b.papel === 'coordenador' ? 2 : 0) + (b.somentePorEvento ? -1 : 0);
      return pa - pb || a.nome.localeCompare(b.nome, 'pt-BR');
    };
  }

  /** Sugere a equipe: especialistas primeiro, voluntários antes dos coordenadores (que revisam). */
  function sugerirEquipe(c, quantos) {
    const proj = E().projetoDaCarta(c);
    return OG.kanban.candidatos(app.estado, c).slice().sort(ordemSugestao(proj)).slice(0, quantos).map(function (p) { return p.id; });
  }

  function abrirEquipe(cartaId, tipo) {
    const c = E().carta(app.estado, cartaId);
    if (!c) return;
    const proj = E().projetoDaCarta(c);
    if (tipo === 'equipe') {
      const av = OG.kanban.avaliarMovimento(app.estado, cartaId, 'andamento');
      if (!av.ok) {
        OG.ui.aviso(av.motivo, 'erro');
        return;
      }
      abrirModal({ tipo: 'equipe', cartaId: cartaId, selecionados: sugerirEquipe(c, proj.trabalhadores) });
    } else {
      const falta = proj.trabalhadores - c.equipe.length;
      abrirModal({ tipo: 'completar', cartaId: cartaId, selecionados: sugerirEquipe(c, falta) });
    }
  }

  function alternarPessoa(pessoaId, marcado) {
    const m = app.ui.modal;
    if (!m || (m.tipo !== 'equipe' && m.tipo !== 'completar')) return;
    const c = E().carta(app.estado, m.cartaId);
    const proj = E().projetoDaCarta(c);
    const limite = m.tipo === 'completar' ? proj.trabalhadores - c.equipe.length : proj.trabalhadores;
    const sel = m.selecionados.filter(function (id) { return id !== pessoaId; });
    if (marcado && sel.length < limite) sel.push(pessoaId);
    m.selecionados = sel;
    render();
  }

  function confirmarEquipe() {
    const m = app.ui.modal;
    if (!m) return;
    const c = E().carta(app.estado, m.cartaId);
    const proj = E().projetoDaCarta(c);
    if (m.tipo === 'completar') {
      // Aplica todas as inclusões numa cópia; só confirma se todas derem certo.
      let estado = app.estado;
      for (let i = 0; i < m.selecionados.length; i++) {
        const r = OG.motor.aplicar(estado, { tipo: 'COMPLETAR_EQUIPE', cartaId: c.id, pessoaId: m.selecionados[i], rodada: estado.rodada });
        if (!r.ok) {
          OG.ui.aviso(r.erro, 'erro');
          return;
        }
        estado = r.estado;
      }
      const antes = app.estado;
      app.estado = estado;
      salvar();
      marcarPulsos(antes, estado);
      app.ui.modal = null;
      OG.ui.aviso('Equipe de ' + proj.nome + ' completa.', 'bom');
      render();
      return;
    }
    despachar({ tipo: 'INICIAR', cartaId: c.id, equipe: m.selecionados.slice() }, function (antes, depois) {
      app.ui.modal = null;
      app.ui.focoDepois = c.id;
      const pago = E().recursos(antes).dinheiro - E().recursos(depois).dinheiro;
      OG.ui.aviso(proj.nome + (E().carta(antes, c.id).custoPago !== null ? ' foi retomado sem custo.' : ' começou. Pago: ' + OG.util.formatarDinheiro(pago) + '.'), 'info');
    });
  }

  function sugerirRevisor() {
    const livres = E().coordenadoresLivres(app.estado);
    if (!livres.length) return null;
    const futuros = app.estado.cartas.filter(function (c) { return c.coluna === 'backlog' || c.coluna === 'afazer'; });
    const utilidade = function (p) {
      return futuros.filter(function (c) { return E().ehEspecialista(p, E().projetoDaCarta(c)); }).length;
    };
    return livres.slice().sort(function (a, b) { return utilidade(a) - utilidade(b); })[0].id;
  }

  function abrirRevisor(cartaId) {
    const av = OG.kanban.avaliarMovimento(app.estado, cartaId, 'concluido');
    if (!av.ok) {
      OG.ui.aviso(av.motivo, 'erro');
      return;
    }
    abrirModal({ tipo: 'revisor', cartaId: cartaId, revisor: sugerirRevisor() });
  }

  function confirmarRevisao() {
    const m = app.ui.modal;
    if (!m || !m.revisor) {
      OG.ui.aviso('Escolha um coordenador para revisar.', 'erro');
      return;
    }
    const proj = E().projetoDaCarta(E().carta(app.estado, m.cartaId));
    despachar({ tipo: 'REVISAR', cartaId: m.cartaId, revisorId: m.revisor }, function (antes, depois) {
      app.ui.modal = null;
      app.ui.focoDepois = m.cartaId;
      OG.ui.aviso(proj.nome + ' concluído! ' + textoDelta(antes, depois) + '.', 'bom');
    });
  }

  function encerrar() {
    despachar({ tipo: 'ENCERRAR_RODADA' }, function () { app.ui.resumoFechado = null; });
  }

  function pedirEncerramento() {
    const estado = app.estado;
    if (!estado || estado.fase !== 'planejamento') return;
    const avisos = [];
    if (OG.kanban.mutiraoDisponivel(estado)) avisos.push('Você ainda não usou o Mutirão da Gurizada. Ele acaba no fim desta rodada.');
    const revisaveis = E().cartasNaColuna(estado, 'revisao').filter(function (c) {
      return OG.kanban.avaliarMovimento(estado, c.id, 'concluido').ok;
    });
    if (estado.rodada === OG.regras.TOTAL_RODADAS && revisaveis.length) {
      avisos.push((revisaveis.length === 1 ? 'Ainda há 1 projeto' : 'Ainda há ' + revisaveis.length + ' projetos') + ' para revisar. Na última rodada, projeto não revisado não conta.');
    }
    const semEquipe = E().cartasNaColuna(estado, 'andamento').filter(function (c) {
      return c.equipe.length < E().projetoDaCarta(c).trabalhadores;
    });
    if (semEquipe.length) {
      avisos.push(OG.util.listaPt(semEquipe.map(function (c) { return E().projetoDaCarta(c).nome; })) + ' está com a equipe incompleta e não vai avançar.');
    }
    if (!avisos.length) {
      encerrar();
      return;
    }
    confirmar({
      id: 'encerrar',
      titulo: 'Encerrar a rodada ' + estado.rodada + '?',
      html: '<ul class="lista-simples">' + avisos.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul>',
      rotulo: 'Encerrar mesmo assim',
      cancelar: 'Voltar ao quadro',
      acao: encerrar,
    });
  }

  // ---------------- Ações da interface ----------------

  function executarAcao(acao, el) {
    const d = (el && el.dataset) || {};
    switch (acao) {
      case 'jogar':
      case 'nova-partida':
      case 'outra-missao':
        irPara('missoes');
        break;
      case 'continuar':
        if (app.estado) irPara(app.estado.fase === 'fim' ? 'fim' : 'jogo');
        break;
      case 'voltar-inicio':
        irPara('inicio');
        break;
      case 'como-jogar':
        abrirModal({ tipo: 'como-jogar' });
        break;
      case 'configuracoes':
        abrirModal({ tipo: 'config' });
        break;
      case 'menu':
        abrirModal({ tipo: 'menu' });
        break;
      case 'fechar-modal':
        fecharModalUi();
        break;
      case 'fechar-resumo':
        app.ui.resumoFechado = app.estado ? app.estado.rodada : null;
        render();
        break;
      case 'escolher-missao':
        escolherMissao(d.missao);
        break;
      case 'jogar-de-novo':
        if (app.estado) novaPartida(app.estado.missaoId);
        break;
      case 'confirmar-evento':
        despachar({ tipo: 'CONFIRMAR_EVENTO', escolha: d.escolha }, avisoDelta);
        break;
      case 'ver-evento':
        abrirModal({ tipo: 'ver-evento' });
        break;
      case 'planejar':
        despachar({ tipo: 'PLANEJAR', cartaId: d.carta }, function () { app.ui.modal = null; app.ui.focoDepois = d.carta; });
        break;
      case 'desplanejar':
        despachar({ tipo: 'DESPLANEJAR', cartaId: d.carta }, function () { app.ui.modal = null; app.ui.focoDepois = d.carta; });
        break;
      case 'abrir-iniciar':
        abrirEquipe(d.carta, 'equipe');
        break;
      case 'abrir-completar':
        abrirEquipe(d.carta, 'completar');
        break;
      case 'alternar-pessoa':
        alternarPessoa(d.pessoa, el.checked);
        break;
      case 'confirmar-equipe':
        confirmarEquipe();
        break;
      case 'abrir-revisar':
        abrirRevisor(d.carta);
        break;
      case 'escolher-revisor':
        if (app.ui.modal) {
          app.ui.modal.revisor = d.pessoa;
          render();
        }
        break;
      case 'confirmar-revisao':
        confirmarRevisao();
        break;
      case 'mutirao':
        despachar({ tipo: 'USAR_MUTIRAO', cartaId: d.carta }, function (antes, depois) {
          app.ui.modal = null;
          app.ui.focoDepois = d.carta;
          const c = E().carta(depois, d.carta);
          OG.ui.aviso('Mutirão: ' + E().projetoDaCarta(c).nome + (c.coluna === 'revisao' ? ' terminou a execução e foi para Revisão.' : ' avançou 1 rodada.'), 'bom');
        });
        break;
      case 'detalhes':
        abrirModal({ tipo: 'detalhe', cartaId: d.carta });
        break;
      case 'encerrar-rodada':
        pedirEncerramento();
        break;
      case 'resolver-decisao':
        despachar({ tipo: 'RESOLVER_DECISAO', escolha: d.escolha }, avisoDelta);
        break;
      case 'cancelar-encerramento':
        despachar({ tipo: 'CANCELAR_ENCERRAMENTO' });
        break;
      case 'avancar':
        despachar({ tipo: 'AVANCAR' }, function () { app.ui.resumoFechado = null; });
        break;
      case 'aba':
        app.ui.aba = d.aba;
        render();
        break;
      case 'aba-mobile':
        app.ui.abaMobile = d.aba;
        render();
        global.scrollTo(0, 0);
        break;
      case 'coluna-mobile':
        irParaColuna(d.coluna);
        break;
      case 'abrir-lateral':
        app.ui.lateralAberta = true;
        render();
        focar('[data-acao="fechar-lateral"]');
        break;
      case 'fechar-lateral':
        app.ui.lateralAberta = false;
        render();
        focar('[data-acao="abrir-lateral"]');
        break;
      case 'alternar-caixa-apertado':
        app.config.caixaApertado = !!el.checked;
        salvarConfig();
        render();
        break;
      case 'apagar-salvo':
        confirmar({
          id: 'apagar',
          titulo: 'Apagar a partida salva?',
          html: '<p>A partida salva neste navegador será apagada. Não dá para desfazer.</p>',
          rotulo: 'Apagar partida',
          perigo: true,
          acao: function () {
            OG.persistencia.apagar();
            app.estado = null;
            app.ui = novoUi();
            irPara('inicio');
            OG.ui.aviso('Partida salva apagada.', 'bom');
          },
        });
        break;
      case 'confirmar-acao': {
        const c = app.ui.modal && app.ui.modal.confirmar;
        app.ui.modal = null;
        if (c && c.acao) c.acao();
        else render();
        break;
      }
      default:
        break;
    }
  }

  function focar(seletor) {
    const el = document.querySelector(seletor);
    if (el) el.focus({ preventScroll: true });
  }

  // ---------------- Colunas no celular ----------------

  function prefereMenosMovimento() {
    return global.matchMedia && global.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function marcarColunaAtual(id) {
    app.ui.colunaMobile = id;
    document.querySelectorAll('.trocar-coluna button').forEach(function (b) {
      b.setAttribute('aria-current', String(b.dataset.coluna === id));
    });
  }

  function irParaColuna(id) {
    marcarColunaAtual(id);
    const col = document.getElementById('coluna-' + id);
    if (col) col.scrollIntoView({ behavior: prefereMenosMovimento() ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });
  }

  let temporizadorRolagem = null;
  function aoRolarQuadro(evento) {
    const quadro = evento.target;
    if (!quadro.classList || !quadro.classList.contains('quadro')) return;
    clearTimeout(temporizadorRolagem);
    temporizadorRolagem = setTimeout(function () {
      const centro = quadro.scrollLeft + quadro.clientWidth / 2;
      let melhor = null;
      let distancia = Infinity;
      quadro.querySelectorAll('.coluna').forEach(function (col) {
        const meio = col.offsetLeft + col.offsetWidth / 2;
        const dist = Math.abs(meio - centro);
        if (dist < distancia) { distancia = dist; melhor = col.dataset.coluna; }
      });
      if (melhor && melhor !== app.ui.colunaMobile) marcarColunaAtual(melhor);
    }, 90);
  }

  // ---------------- Renderização ----------------

  function construirModal(tipo) {
    const T = OG.telas;
    switch (tipo) {
      case 'menu': return T.modalMenu(app);
      case 'como-jogar': return T.modalComoJogar(app);
      case 'config': return T.modalConfig(app);
      case 'confirmar': return T.modalConfirmar(app);
      case 'equipe':
      case 'completar': return T.modalEquipe(app);
      case 'revisor': return T.modalRevisor(app);
      case 'detalhe': return T.modalDetalhe(app);
      case 'ver-evento': return T.modalVerEvento(app);
      default: return null;
    }
  }

  function descritorModal() {
    const m = app.ui.modal;
    if (m && MODAIS_GLOBAIS.indexOf(m.tipo) !== -1) return construirModal(m.tipo);
    if (app.tela === 'jogo' && app.estado) {
      const fase = app.estado.fase;
      if (fase === 'evento') return OG.telas.modalEvento(app);
      if (fase === 'decisao') return OG.telas.modalDecisao(app);
      if (fase === 'resumo') return app.ui.resumoFechado === app.estado.rodada ? null : OG.telas.modalResumo(app);
      if (fase === 'planejamento' && m) {
        const d = construirModal(m.tipo);
        if (!d) app.ui.modal = null;
        return d;
      }
    }
    if (m && app.tela !== 'jogo') app.ui.modal = null;
    return null;
  }

  function renderModal(chaveOpener) {
    const d = descritorModal();
    if (d && typeof d.aoDispensar === 'string') {
      const acao = d.aoDispensar;
      d.aoDispensar = function () { executarAcao(acao, null); };
    }
    OG.ui.mostrarModal(d, chaveOpener);
  }

  function salvarRolagens() {
    const r = {};
    const lateral = document.querySelector('.lateral');
    const quadro = document.querySelector('.quadro');
    if (lateral) r.lateral = lateral.scrollTop;
    if (quadro) r.quadro = quadro.scrollLeft;
    r.janela = global.scrollY;
    return r;
  }

  function restaurarRolagens(r) {
    const lateral = document.querySelector('.lateral');
    const quadro = document.querySelector('.quadro');
    if (lateral && r.lateral) lateral.scrollTop = r.lateral;
    if (quadro && r.quadro) quadro.scrollLeft = r.quadro;
    if (Math.abs(global.scrollY - r.janela) > 2) global.scrollTo(0, r.janela);
  }

  function aplicarPulsos() {
    app.ui.pulsar.forEach(function (k) {
      const el = document.querySelector('.recurso[data-recurso="' + k + '"]');
      if (el) el.classList.add('pulsa');
    });
    app.ui.pulsar = [];
  }

  function tituloDaPagina() {
    const base = 'Operação Grêmio — Mesquita';
    if (app.tela === 'jogo' && app.estado) return 'Rodada ' + app.estado.rodada + ' — ' + base;
    if (app.tela === 'fim') return 'Resultado — ' + base;
    if (app.tela === 'missoes') return 'Missões — ' + base;
    return base;
  }

  function render() {
    const raiz = document.getElementById('app');
    if (!raiz) return;
    const foco = OG.ui.modalAberto() ? null : OG.ui.chaveDoFoco();
    const rolagens = salvarRolagens();
    let html;
    if (app.tela === 'jogo' && !app.estado) app.tela = 'inicio';
    if (app.tela === 'fim' && !app.estado) app.tela = 'inicio';
    switch (app.tela) {
      case 'missoes': html = OG.telas.telaMissoes(app); break;
      case 'jogo': html = OG.telas.telaJogo(app); break;
      case 'fim': html = OG.telas.telaFim(app); break;
      default: html = OG.telas.telaInicio(app);
    }
    raiz.innerHTML = html;
    restaurarRolagens(rolagens);
    aplicarPulsos();
    renderModal(foco);
    if (!OG.ui.modalAberto()) {
      const depois = app.ui.focoDepois;
      app.ui.focoDepois = null;
      if (depois) focarCard(depois);
      else if (foco) OG.ui.restaurarFoco(raiz, foco);
    }
    document.title = tituloDaPagina();
  }

  /** Depois que um card muda de coluna, o foco do teclado acompanha o card. */
  function focarCard(cartaId) {
    const raiz = document.getElementById('app');
    const chaves = ['abrir-iniciar:', 'abrir-revisar:', 'abrir-completar:', 'mutirao:', 'detalhes:'];
    for (let i = 0; i < chaves.length; i++) {
      if (OG.ui.restaurarFoco(raiz, chaves[i] + cartaId)) {
        const el = document.activeElement;
        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        return;
      }
    }
  }

  // ---------------- Eventos do navegador ----------------

  function aoClicar(evento) {
    if (OG.ui.cliqueNoFundo(evento)) return;
    const alvo = evento.target.closest ? evento.target.closest('[data-acao]') : null;
    if (!alvo) {
      // Clique no corpo do card abre os detalhes.
      const card = evento.target.closest ? evento.target.closest('.card') : null;
      if (card && !evento.target.closest('button, a, input, label, summary')) {
        abrirModal({ tipo: 'detalhe', cartaId: card.dataset.carta });
      }
      return;
    }
    if (alvo.tagName === 'INPUT') return; // tratado no "change"
    if (alvo.getAttribute('aria-disabled') === 'true') {
      evento.preventDefault();
      OG.ui.aviso(alvo.dataset.motivo || 'Ação indisponível agora.', 'erro');
      return;
    }
    evento.preventDefault();
    executarAcao(alvo.dataset.acao, alvo);
  }

  function aoMudar(evento) {
    const alvo = evento.target;
    if (!alvo || alvo.tagName !== 'INPUT' || !alvo.dataset.acao) return;
    executarAcao(alvo.dataset.acao, alvo);
  }

  function aoTeclar(evento) {
    if (OG.ui.tratarTecladoModal(evento)) return;
    if (evento.key === 'Escape' && app.ui.lateralAberta) {
      app.ui.lateralAberta = false;
      render();
      focar('[data-acao="abrir-lateral"]');
      return;
    }
    const aba = evento.target.closest ? evento.target.closest('[role="tab"]') : null;
    if (aba && (evento.key === 'ArrowRight' || evento.key === 'ArrowLeft')) {
      const abas = Array.prototype.slice.call(aba.parentNode.querySelectorAll('[role="tab"]'));
      const i = abas.indexOf(aba);
      const proxima = abas[(i + (evento.key === 'ArrowRight' ? 1 : abas.length - 1)) % abas.length];
      evento.preventDefault();
      app.ui.aba = proxima.dataset.aba;
      render();
      focar('[data-foco="aba:' + app.ui.aba + '"]');
    }
  }

  // ---------------- Arrastar e soltar ----------------

  let arrasto = null;

  function limparArrasto() {
    arrasto = null;
    document.querySelectorAll('.sendo-arrastado').forEach(function (el) { el.classList.remove('sendo-arrastado'); });
    const quadro = document.querySelector('.quadro');
    if (quadro) quadro.classList.remove('arrastando');
    document.querySelectorAll('.coluna').forEach(function (col) {
      col.classList.remove('alvo-valido', 'alvo-invalido', 'origem', 'sobre');
      col.removeAttribute('title');
      const dica = col.querySelector('[data-dica-soltar]');
      if (dica) dica.textContent = '';
    });
  }

  function aoIniciarArrasto(evento) {
    const card = evento.target.closest ? evento.target.closest('.card[draggable="true"]') : null;
    if (!card || !app.estado || app.estado.fase !== 'planejamento') return;
    const id = card.dataset.carta;
    const c = E().carta(app.estado, id);
    if (!c) return;
    arrasto = { id: id, avaliacoes: {} };
    evento.dataTransfer.effectAllowed = 'move';
    try { evento.dataTransfer.setData('text/plain', id); } catch (erro) { /* navegador antigo */ }
    card.classList.add('sendo-arrastado');
    const quadro = document.querySelector('.quadro');
    if (quadro) quadro.classList.add('arrastando');
    document.querySelectorAll('.coluna').forEach(function (col) {
      const destino = col.dataset.coluna;
      if (destino === c.coluna) {
        col.classList.add('origem');
        return;
      }
      const av = OG.kanban.avaliarMovimento(app.estado, id, destino);
      arrasto.avaliacoes[destino] = av;
      col.classList.add(av.ok ? 'alvo-valido' : 'alvo-invalido');
      if (!av.ok) col.setAttribute('title', av.motivo);
      const dica = col.querySelector('[data-dica-soltar]');
      if (dica) dica.textContent = av.ok ? DICAS_SOLTAR[av.acao] : '';
    });
  }

  function aoArrastarSobre(evento) {
    if (!arrasto) return;
    const col = evento.target.closest ? evento.target.closest('.coluna') : null;
    if (!col) return;
    // Aceita o "soltar" em qualquer coluna para poder explicar movimentos inválidos.
    evento.preventDefault();
    evento.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.coluna.sobre').forEach(function (x) { if (x !== col) x.classList.remove('sobre'); });
    col.classList.add('sobre');
  }

  function aoSoltar(evento) {
    if (!arrasto) return;
    evento.preventDefault();
    const col = evento.target.closest ? evento.target.closest('.coluna') : null;
    const id = arrasto.id;
    limparArrasto();
    if (!col || !app.estado) return;
    const destino = col.dataset.coluna;
    const c = E().carta(app.estado, id);
    if (!c || c.coluna === destino) return;
    const av = OG.kanban.avaliarMovimento(app.estado, id, destino);
    if (!av.ok) {
      OG.ui.aviso(av.motivo, 'erro');
      return;
    }
    if (av.acao === 'planejar') despachar({ tipo: 'PLANEJAR', cartaId: id });
    else if (av.acao === 'desplanejar') despachar({ tipo: 'DESPLANEJAR', cartaId: id });
    else if (av.acao === 'iniciar') abrirEquipe(id, 'equipe');
    else if (av.acao === 'revisar') abrirRevisor(id);
  }

  // ---------------- Início ----------------

  function iniciar() {
    OG.icones.instalarIcones(document);
    carregarConfig();
    const r = OG.persistencia.carregar();
    if (r.estado) app.estado = r.estado;
    render();
    if (r.problema === 'corrompido') {
      OG.ui.aviso('A partida salva estava danificada e foi descartada. Comece uma nova.', 'erro');
    }
    document.addEventListener('click', aoClicar);
    document.addEventListener('change', aoMudar);
    document.addEventListener('keydown', aoTeclar);
    document.addEventListener('dragstart', aoIniciarArrasto);
    document.addEventListener('dragover', aoArrastarSobre);
    document.addEventListener('drop', aoSoltar);
    document.addEventListener('dragend', limparArrasto);
    document.addEventListener('scroll', aoRolarQuadro, true);
  }

  OG.app = {
    estadoAtual: function () { return app; },
    render: render,
    executarAcao: executarAcao,
  };

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
    else iniciar();
  }
})(globalThis);

</script>
</body>
</html>
